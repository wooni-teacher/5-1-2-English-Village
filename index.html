    <h3>이번 주에 얻은 배지</h3>${r.badges.length?`<div class="chips">${r.badges.map(b=>`<span class="chip have">${b.emoji} ${esc(b.name)}</span>`).join('')}</div>`:'<p class="empty">아직 없어요. 다음 주에 도전!</p>'}
    <h3>다음에 해 볼 활동</h3>${r.tips.length?`<div class="recs">${r.tips.map(c=>`<div class="rec"><span class="e">${c.icon}</span><div><b>${esc(c.title)}</b><p>${c.reason}</p></div></div>`).join('')}</div>`:'<p class="empty">마음껏 놀아요!</p>'}
    </div><button class="btn" data-act="rp-print" style="margin-top:10px">🖨️ 인쇄하기</button>
    <p class="hint">다른 친구의 점수는 보이지 않아요. 내 기록만 담겨 있어요.</p>`;
}
function renderLesson(){
  const s=Session.cur; // 학생·선생님 모두 전체 현황만 봐요
  if(!s) return head('🎓 수업 활동','')+'<p class="empty">지금은 열린 수업 활동이 없어요.</p>';
  const S=Session.summary(), kind=SESSION_KINDS.find(k=>k[0]===s.kind)?.[1]||s.kind;
  let h=head('🎓 선생님 활동','')+`<div class="kv"><span>활동</span><span>${kind}</span><span>상태</span><span>${SESSION_STATES.find(x=>x[0]===s.state)?.[1]}</span>
    <span>남은 시간</span><span>${s.state==='active'?fmtClock(Session.left()):'-'}</span><span>참여</span><span>${S.n}명</span></div>`;
  if(GS.isStudent()){
    h+=`<div class="kv"><span>내 정답</span><span>${Session.right}개</span><span>내 오답</span><span>${Session.wrong}개</span></div>`;
    if(!Session.joined&&Session.live()) h+='<button class="btn gem" data-act="ls-join">✋ 참여하기</button>';
    else if(s.state==='active'&&s.kind==='quiz'&&!Session.quizOn) h+='<button class="btn gem" data-act="ls-resume">📝 문제 이어 풀기</button>';
    h+='<p class="hint">전체 현황만 보여요. 친구의 개별 점수는 나오지 않아요.</p>';
  }
  return h;
}
function renderLessonResult(){
  const S=Session.summary(), s=Session.cur;
  let h=`<div class="p-head"><h2>🎓 수업 활동 결과</h2></div><div class="kv"><span>우리 반 정답률</span><span>${S.rate===null?'-':S.rate+'%'}</span>
    <span>참여</span><span>${S.n}명</span>${GS.isStudent()?`<span>내 정답</span><span>${Session.right}개</span><span>내 오답</span><span>${Session.wrong}개</span>`:''}</div>`;
  if(S.top.length) h+='<h3>같이 복습하면 좋은 것</h3><div class="chips">'+S.top.map(([id,c])=>`<span class="chip have"><b class="en">${esc(Analytics.label(id))}</b> ${esc(Analytics.labelKo(id))} ×${c}</span>`).join('')+'</div>';
  if(GS.isStudent()){ const tips=Recommend.cards().slice(0,2);
    h+='<h3>다음에 해 볼 활동</h3><div class="recs">'+tips.map(c=>`<div class="rec"><span class="e">${c.icon}</span><div><b>${esc(c.title)}</b><p>${c.reason}</p></div></div>`).join('')+'</div>'; }

}

        <button class="btn sm" data-act="c-edit" data-k="${cid}">${sel?'접기':'⚙️ 설정'}</button>
        <button class="btn sm" data-act="c-arch" data-k="${cid}" data-v="${c.archived?0:1}">${c.archived?'다시 열기':'📦 닫기'}</button></div>
      ${sel?`<div class="form" style="margin-top:10px">
        <label>레슨 시작 <select id="cl-from">${LESSONS.map(L=>`<option value="${L.n}" ${+c.lessonFrom===L.n?'selected':''}>L${L.n}</option>`).join('')}</select></label>
        <label>레슨 끝 <select id="cl-to">${LESSONS.map(L=>`<option value="${L.n}" ${+c.lessonTo===L.n?'selected':''}>L${L.n}</option>`).join('')}</select></label>
        <label>난이도 <select id="cl-diff">${DIFFS.map(([k,t])=>`<option value="${k}" ${c.diff===k?'selected':''}>${t}</option>`).join('')}</select></label>
        <label>시즌 <select id="cl-season"><option value="">사용 안 함</option>${Object.values(SEASONS).map(s=>`<option value="${s.key}" ${c.season===s.key?'selected':''}>${s.emoji} ${s.title}</option>`).join('')}</select></label>
        <div><button class="btn gem" data-act="c-save" data-k="${cid}">💾 저장</button></div>
        <div class="wide"><b>학생 ${members.length}명</b> ${members.map(([u,m])=>`<span class="chip have">${esc(realName(u))} <small>${esc(m.name)}</small> <button class="btn sm" data-act="c-kick" data-k="${cid}" data-u="${u}">✖</button></span>`).join('')||'<span class="chip">아직 없어요</span>'}</div>

function adminLesson(){
  const s=Session.cur, S=Session.summary(), cid=Classes.cur;
  let h=`<p class="p-sub">수업 대상 학급: <b>${esc(cid?Classes.name(cid):'학급을 먼저 골라 주세요')}</b></p>`;

  h+=`<div class="form"><label>활동 <select id="ls-kind">${SESSION_KINDS.map(([k,t])=>`<option value="${k}" ${ls5.kind===k?'selected':''}>${t}</option>`).join('')}</select></label>
    <label>레슨 <select id="ls-lesson"><option value="0">학급 범위에서 자동</option>${LESSONS.map(L=>`<option value="${L.n}" ${+ls5.lesson===L.n?'selected':''}>Lesson ${L.n}</option>`).join('')}</select></label>
    <label>문제 유형 <select id="ls-qtype"><option value="mix" ${ls5.qtype==='mix'?'selected':''}>난이도에 맞게 섞기</option>${QTYPES.map(([k,t])=>`<option value="${k}" ${ls5.qtype===k?'selected':''}>${t}</option>`).join('')}</select></label>
    <label>시간(분) <select id="ls-mins">${SESSION_MINS.map(m=>`<option value="${m}" ${+ls5.mins===m?'selected':''}>${m}분</option>`).join('')}</select></label>
    <label class="wide"><input type="checkbox" id="ls-anon" ${ls5.anon?'checked':''}> 학생별 정답은 감추고 <b>전체 현황만</b> 보기</label>

      <div class="kv"><span>활동</span><span>${SESSION_KINDS.find(k=>k[0]===s.kind)?.[1]}</span><span>참여</span><span>${S.n}명</span>
        <span>남은 시간</span><span>${s.state==='active'?fmtClock(Session.left()):'-'}</span><span>정답률</span><span>${S.rate===null?'-':S.rate+'%'} (⭕${S.right} / ❌${S.wrong})</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${s.state==='lobby'?'<button class="btn gem sm" data-act="ls-start">▶️ 활동 시작</button>':''}
        ${s.state==='active'?'<button class="btn sm" data-act="ls-result">⏹ 결과 보기</button>':''}
        ${s.state==='result'?'<button class="btn sm" data-act="ls-end">✅ 수업 끝내기</button>':''}
        <button class="btn berry sm" data-act="ls-clear">🗑 수업 치우기</button></div>`;
    if(S.top.length) h+='<h3>많이 틀린 항목</h3><div class="chips">'+S.top.map(([id,c])=>`<span class="chip have"><b class="en">${esc(Analytics.label(id))}</b> ×${c}</span>`).join('')+'</div>';
    h+=s.anon?'<p class="hint">🙈 학생별 정답은 감춰져 있어요. 참여한 학생 이름만 보여요.</p>'
      :`<div class="tbl-wrap"><table><thead><tr><th>학생</th><th>⭕</th><th>❌</th></tr></thead><tbody>${S.rows.map(([u,r])=>`<tr><td>${esc(realName(u))}</td><td>${r.right||0}</td><td>${r.wrong||0}</td></tr>`).join('')}</tbody></table></div>`;
    if(s.anon&&S.rows.length) h+=`<div class="chips">${S.rows.map(([u])=>`<span class="chip have">${esc(realName(u))}</span>`).join('')}</div>`;

}

    <h3>학급이 자주 틀린 항목</h3>${R.top.length?`<div class="chips">${R.top.map(([id,c])=>`<span class="chip have"><b class="en">${esc(Analytics.label(id))}</b> ${esc(Analytics.labelKo(id))} ×${c}</span>`).join('')}</div>`:'<p class="empty">아직 기록이 없어요.</p>'}
    <p class="hint">개인 성적은 표시하지 않아요. 학생 개별 내용은 📊 학습 분석 탭에서 볼 수 있어요.</p></div>`;

// --- 클릭 처리 (5차) ---
panelEl.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t) return; const d=t.dataset, g=i=>document.getElementById(i);
  switch(d.act){
    case 'ml-tab': ml5.tab=d.k; UI.render(); break;
    case 'rc-go': { const c=(UI._recs||[])[+d.i]; if(c) Recommend.run(c); break; }
    case 'bg-main': Badges.setMain(d.k); UI.render(); break;
    case 'rp-print': window.print(); break;
    case 'c-join': await Classes.join(g('c-code')?.value); UI.render(); break;
    case 'c-sel': Classes.select(d.k); UI.render(); break;
    case 'c-leave': if(confirm('이 학급에서 나갈까요?')){ Classes.leave(d.k); UI.render(); } break;
    // 선생님
    case 'c-new': { const cid=await Classes.create(g('cl-name')?.value,g('cl-grade')?.value,g('cl-room')?.value); if(cid){ Classes.select(cid,true); cls5.sel=cid; } UI.render(); break; }
    case 'c-pick': Classes.cur=d.k; Session.watch(); UI.classHud(); UI.render(); break;
    case 'c-edit': cls5.sel=cls5.sel===d.k?null:d.k; UI.render(); break;
    case 'c-save': await Classes.update(d.k,{lessonFrom:+g('cl-from').value,lessonTo:+g('cl-to').value,diff:g('cl-diff').value,season:g('cl-season').value}); toast('💾 학급 설정을 저장했어요.'); break;
    case 'c-arch': Classes.archive(d.k,d.v==='1'); break;
    case 'c-kick': if(confirm('이 학생을 학급에서 빼낼까요?')) Classes.kick(d.k,d.u); break;
    case 'ls-open': { Object.assign(ls5,{kind:g('ls-kind').value,lesson:+g('ls-lesson').value,qtype:g('ls-qtype').value,mins:+g('ls-mins').value,anon:g('ls-anon').checked});
      await Session.open(ls5); toast('🎓 대기실을 열었어요. 학생 화면에 참여 버튼이 나타나요.'); break; }
    case 'ls-start': Session.start(); break;
    case 'ls-result': Session.toResult(); break;
    case 'ls-end': Session.end(); break;
    case 'ls-clear': if(confirm('수업 기록을 화면에서 치울까요?')) Session.clear(); break;
    case 'ls-join': Session.join(); UI.render(); break;
    case 'ls-resume': Session.quizOn=true; Session.nextQuiz(); break;
    case 'tp-save-session': await Templates.save({title:`${SESSION_KINDS.find(k=>k[0]===ls5.kind)?.[1]||''} ${ls5.mins}분`,desc:'수업 탭에서 저장한 설정이에요.',
      tags:['수업'],lessons:ls5.lesson?[ls5.lesson]:[],diff:Classes.diff(),kind:'session',data:{...ls5},scope:'private'}); UI.render(); break;
    case 'tp-use': await Templates.use(d.k); break;
    case 'tp-prev': { const tp=Templates.get(d.k); if(tp) toast(`📋 <b>${esc(tp.title)}</b><br><small>${esc(tp.desc||'')}<br>${tp.kind==='session'?`활동 ${SESSION_KINDS.find(k=>k[0]===tp.data.kind)?.[1]||''} · ${tp.data.mins||15}분`:`콘텐츠 종류 ${tp.kind}`}</small>`,6000); break; }
    case 'tp-scope': FB.update('templates/'+d.k,{scope:d.v}); break;
    case 'tp-del': if(confirm('템플릿을 지울까요?')) Templates.remove(d.k); break;
    case 'wk-go': wk5.cid=g('wk-cid').value; UI.render(); break;
    case 'st-tpl': Templates.fromContent(d.id); break;
  }
});
</script>
