      if(o.t==='goal'&&R.started&&!R.done) this.finish(now);
    }
    if(!UI.modal&&now>R.quizCool&&!R.done) for(const [oid,o] of Object.entries(this.objs)){ if(o.t!=='quiz'||R.solved[oid]) continue;
      const [x,z]=this.cellCenter(o.i,o.j); if(Math.hypot(pos.x-x,pos.z-z)<2.1){ this.askQuiz(oid,x,z); break; } }
    const quizN=this.count('quiz'), solved=Object.keys(R.solved).length;
    UI.prompt(`⏱ ${R.started&&!R.done?((now-R.t0)/1000).toFixed(1):'0.0'}초   🔤 ${R.letters.length}   ❓ ${solved}/${quizN}   🟦 점프 발판으로 장애물을 넘어요`);
  },
  askQuiz(oid,x,z){ const R=this.run; R.quizCool=performance.now()+99999;
    UI.openQuiz(Quiz.make('choice',this.meta.lesson),{title:'❓ 단어 문제판',sub:'맞히면 문제판이 열려요!',onDone:ok=>{
      if(ok){ R.solved[oid]=1; removeColliders('mapq:'+oid); const g=this.meshes[oid]; if(g) g.visible=false; R.quizCool=0; }
      else { const d=Math.hypot(pos.x-x,pos.z-z)||1; pos.x+=(pos.x-x)/d*2.5; pos.z+=(pos.z-z)/d*2.5; R.quizCool=performance.now()+2000; } }});
  },
  async finish(now){
    const R=this.run; R.done=true; const ms=Math.round(now-R.t0), id=this.id, m=this.meta, mine=m.owner===me_();
    tune([659,784,1047,1319]); burst(pos.x,1.5,pos.z,0xffc93c,20);
    let rewardText_='';
    if(mine){ this.meta.verified=true; await FB.update('userMaps/'+id,{verified:true}).catch(()=>{}); await FB.update('mapIndex/'+id,{verified:true}).catch(()=>{});
      rewardText_='✅ 테스트 성공! 이제 🏁 챌린지 → 내 코스에서 공개할 수 있어요. (내 코스는 보상이 없어요)'; }
    else if(GS.isStudent()){
      const prev=await FB.get(`mapPlays/${id}/${me_()}`).catch(()=>null)||{};
      await FB.set(`mapPlays/${id}/${me_()}`,{name:GS.me.name,best:prev.best?Math.min(prev.best,ms):ms,clears:(prev.clears||0)+1,at:FB.serverTs()}).catch(()=>{});
      if(!prev.clears) FB.transaction(`mapIndex/${id}/clears`,c=>(c||0)+1).catch(()=>{});
      if(Rewards.give('map:'+id,MAPS.reward.first)) rewardText_=`첫 클리어 보상 ${rewardText(MAPS.reward.first)}`;
      else { const day=kstDay(FB.now()), S=GS.inv.social; if(S.mapDay!==day){ S.mapDay=day; S.mapN=0; }
        if(S.mapN<MAPS.reward.dailyCap){ S.mapN++; Rewards.give(null,MAPS.reward.repeat); rewardText_=`다시 깨기 보상 ${rewardText(MAPS.reward.repeat)}`; } else rewardText_='오늘 받을 수 있는 코스 보상은 다 받았어요.'; }
      if(R.letters.length){ GS.grant({letters:R.letters}); rewardText_+=`  알파벳 ${R.letters.join(' ')}`; }
      Bus.emit('learn',{kind:'mapClear'});
    }
    setTimeout(()=>UI.open('mapresult',{ms,title:m.title,text:rewardText_,id}),900);
  },
  replay(){ if(!this.id) return; const id=this.id, mode=this.mode; this.open(id,mode==='edit'?'edit':'play'); },
  editUpdate(){
    const c=this.cursor=this.cursorCell();
    if(this.erase){ if(this.ghost){ scene.remove(this.ghost); this.ghost=null; this.ghostT=''; }
      const at=c&&Object.values(this.objs).find(o=>o.i===c.i&&o.j===c.j); UI.prompt(at?`<kbd>E</kbd> ${MAPS.types[at.t].name} 지우기`:'지울 블록을 가리켜요'); return; }
    if(this.ghostT!==this.sel){ if(this.ghost) scene.remove(this.ghost); this.ghost=this.makeMesh(this.sel,null,true); scene.add(this.ghost); this.ghostT=this.sel; }
    if(!c){ this.ghost.visible=false; UI.prompt('무대 위를 가리키면 미리보기가 보여요'); return; }
    const [x,z]=this.cellCenter(c.i,c.j); this.ghost.visible=true; this.ghost.position.set(x,0,z);
    const w=this.why(this.sel,c.i,c.j); this.ghost.userData.gm.color.setHex(w?0xff4d6d:0x3cff9e);
    UI.prompt(w?`🚫 ${w}`:`<kbd>E</kbd> ${MAPS.types[this.sel].name} 놓기 (${Object.keys(this.objs).length}/${MAPS.maxObjects})`);
  },
  // 다른 친구가 내 코스를 깨면 조금씩 받아요 (같은 친구는 코스마다 한 번, 하루 한도)
  async claimFans(){
    if(!GS.isStudent()) return; const day=kstDay(FB.now()), S=GS.inv.social; if(S.fanDay!==day){ S.fanDay=day; S.fanN=0; }
    let got=0; for(const [id] of this.myMaps()){ const plays=await FB.get('mapPlays/'+id).catch(()=>null)||{};
      for(const [uid,p] of Object.entries(plays)){ if(uid===me_()||!(p.clears>0)||S.fanN>=MAPS.reward.fanDailyCap) continue;
        if(Rewards.give(`mapfan:${id}:${uid}`,MAPS.reward.fan)){ S.fanN++; got++; } } }
    if(got) toast(`🏁 친구 ${got}명이 내 코스를 깼어요! ${rewardText({coins:MAPS.reward.fan.coins*got,score:MAPS.reward.fan.score*got})}`,4500);
  }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §27 [4차] SEASON — 시즌 장식·날씨·시즌 포인트·보상 트랙        ║
   ╚══════════════════════════════════════════════════════════════╝
   season/current = {seasonId, title, theme('spring'|'summer'|'autumn'|'winter'), startAt, endAt, status, note}
   season/archive/{seasonId} = 지난 시즌 기록
   학생 저장: inventory/{uid}/season = {id, pts, base:{활동 기준값}}  ← 시즌이 바뀌면 포인트만 0으로, 아이템·건축물은 그대로예요.
   ⚠ TODO(서버): 시즌 포인트와 보상 지급은 Cloud Functions(onCall: seasonClaim)에서 검증하면 조작을 막을 수 있어요. */
const Season={
  cur:null, group:null, applied:null, weather:null, wv:null,
  init(){
    Object.assign(ITEM_DEFS,SEASON_ITEMS); // 시즌 재료도 평범한 아이템으로 가방에 남아요
    FB.on('season/current',v=>{ this.cur=v||null; this.checkReset(); this.apply(); UI.seasonHud(); UI.refreshAdmin(); if(UI.modal==='season') UI.render(); });
    Bus.on('learn',d=>this.onLearn(d));
  },
  preset(){ return SEASONS[this.cur?.theme]||null; },
  active(){ const c=this.cur; if(!c) return null; const n=FB.now(); return (c.status!=='ended'&&n>=(c.startAt||0)&&n<=(c.endAt||0))?c:null; },
  left(){ const c=this.active(); return c?Math.max(0,c.endAt-FB.now()):0; },
  st(){ const S=GS.inv?.season; if(!S||typeof S!=='object'){ if(GS.inv) GS.inv.season={id:null,pts:0,base:{}}; return GS.inv?.season||{pts:0,base:{}}; } if(!S.base) S.base={}; return S; },
  pts(){ return this.st().pts||0; },
  checkReset(){
    const c=this.cur; if(!GS.isStudent()||!c) return; const S=this.st();
    if(S.id!==c.seasonId){ GS.inv.season={id:c.seasonId,pts:0,base:{...(GS.inv.stats||{})}}; GS.change();
      const P=this.preset(); if(this.active()&&P) toast(`${P.emoji} <b>${esc(c.title||P.title)}</b> 시즌이 시작됐어요!<br><small>${esc(c.note||P.intro)}</small>`,7000); }
  },
  addPts(n){ if(!GS.isStudent()||!this.active()||!n) return; const S=this.st(); S.pts=(S.pts||0)+n; GS.change(); this.checkPass(); UI.seasonHud(); },
  onLearn(d){
    if(!GS.isStudent()||!this.active()) return;
    this.addPts(SEASON_PTS[d.kind]||0);
    const P=this.preset();
    if(P&&(d.kind==='mine'||d.kind==='dungeonClear')){
      const sure=d.kind==='dungeonClear'; if(!sure&&Math.random()>SEASON_TOKEN_CHANCE) { this.checkQuests(); return; }
      const n=sure?3:1; GS.grant({items:{[P.token.id]:n}}); Progress.inc(P.token.id+'Got',n);
      if(player) popAt(pos.x,pos.y+3.4,pos.z,`${P.token.emoji} +${n}`);
    }
    this.checkQuests();
  },
  quests(){ const P=this.preset(); return this.active()&&P?P.quests:[]; },
  questProg(q){ const S=this.st(); return Math.max(0,(GS.inv.stats?.[q.stat]||0)-(S.base?.[q.stat]||0)); },
  questDone(q){ return !!GS.inv.claims[`sq:${this.cur?.seasonId}:${q.id}`]; },
  checkQuests(){
    for(const q of this.quests()){ if(this.questProg(q)<q.n||this.questDone(q)) continue;
      if(Rewards.give(`sq:${this.cur.seasonId}:${q.id}`,{exp:q.pts},`시즌 과제 「${q.text}」 완료!`)){ this.addPts(q.pts); tune([659,880,1047]); } }
  },
  passStep(){ const p=this.pts(); let i=0; while(i<SEASON_PASS.length&&p>=SEASON_PASS[i].pts) i++; return i; },
  checkPass(){
    const c=this.cur; if(!c) return;
    SEASON_PASS.forEach((s,i)=>{ if(this.pts()>=s.pts) Rewards.give(`season:${c.seasonId}:${i}`,s.reward,`${this.preset()?.emoji||'🎁'} 시즌 보상 「${s.name}」 도착!`); });
  },
  // --- 마을 꾸미기와 날씨 ---
  apply(){
    const A=this.active(), P=A?this.preset():null, key=P?P.key:null;
    if(this.applied===key) { this.rebuildWeather(); return; }
    this.applied=key;
    if(this.group){ scene.remove(this.group); this.group.traverse(o=>{ if(o.isSprite) disposeSprite(o); }); this.group=null; }
    SKY.village.bg=P?P.sky:0x9ad8f5; if(!Dungeon.inside) setSky('village');
    if(P){ this.group=this.buildDeco(P); scene.add(this.group); }
    this.rebuildWeather();
  },
  buildDeco(P){
    const g=new THREE.Group(); const at=(deg,r)=>[Math.sin(deg*Math.PI/180)*r,Math.cos(deg*Math.PI/180)*r];
    for(let i=0;i<10;i++){ const [x,z]=at(i*36+18,26+((i%3)*3));
      if(P.key==='spring'){ box(.7,3,.7,0x8a5a36,x,1.5,z,g); const c=mesh(new THREE.SphereGeometry(2,10,8),mat(0xffc0d8),x,4,z,g); c.scale.y=.8; }
      else if(P.key==='summer'){ box(.2,2.4,.2,0xf0f0f0,x,1.2,z,g); const u=mesh(new THREE.ConeGeometry(2.2,1,10),mat(i%2?0xff6b8b:0x4fa3ff),x,2.8,z,g); u.rotation.y=i;
        mesh(new THREE.TorusGeometry(.9,.3,8,14),mat(0xffe14a),x+2.6,.35,z,g).rotation.x=Math.PI/2; }
      else if(P.key==='autumn'){ const pk=mesh(new THREE.SphereGeometry(1.1,10,8),mat(0xff9f43),x,.9,z,g); pk.scale.y=.8; box(.2,.5,.2,0x4f7a3a,x,1.8,z,g);
        if(i%3===0){ box(1.6,1.6,1.6,0xe0c060,x+3,.8,z,g); } }
      else { const s1=mesh(new THREE.SphereGeometry(1.1,10,8),mat(0xffffff),x,.9,z,g); s1.name='snow';
        mesh(new THREE.SphereGeometry(.8,10,8),mat(0xffffff),x,2.2,z,g); box(.6,.1,.6,0x2a2a2a,x,3,z,g); box(.1,.6,.1,0xff6b3c,x,2.3,z+.8,g);
        if(i%3===0){ mesh(new THREE.ConeGeometry(1.4,3.4,8),mat(0x2e7d5b),x+3.4,1.7,z,g); } }
    }
    const lab=textSprite(`${P.emoji} ${P.title}`,{font:'64px Jua',h:1.6,bg:'rgba(255,255,255,.85)'}); lab.position.set(0,9.5,-14); g.add(lab);
    return g;
  },
  rebuildWeather(){
    this.clearWeather(); const P=this.active()?this.preset():null, n=P?Math.round((Perf.q.weather||0)*(P.weather?1:0)):0;
    if(!n||!P.weather) return;
    const pos3=new Float32Array(n*3); for(let i=0;i<n;i++){ pos3[i*3]=(Math.random()-.5)*140; pos3[i*3+1]=Math.random()*40; pos3[i*3+2]=(Math.random()-.5)*140; }
    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos3,3));
    this.weather=new THREE.Points(geo,new THREE.PointsMaterial({color:P.weather.color,size:.55,transparent:true,opacity:.85,depthWrite:false}));
    this.weather.frustumCulled=false; this.wv=P.weather; scene.add(this.weather);
  },
  clearWeather(){ if(this.weather){ scene.remove(this.weather); this.weather.geometry.dispose(); this.weather.material.dispose(); this.weather=null; } },
  update(dt){
    if(!this.weather||Dungeon.inside||Maps.mode) { if(this.weather) this.weather.visible=!Dungeon.inside&&!Maps.mode; return; }
    this.weather.visible=true; const a=this.weather.geometry.attributes.position, t=performance.now()/1000, W=this.wv;
    for(let i=0;i<a.count;i++){ let y=a.getY(i)-W.speed*dt*4; let x=a.getX(i)+Math.sin(t+i)*W.sway*dt;
      if(y<0){ y=40; x=(Math.random()-.5)*140; a.setZ(i,(Math.random()-.5)*140); }
      a.setY(i,y); a.setX(i,x); }
    a.needsUpdate=true; this.weather.position.set(Math.round(pos.x/70)*70,0,Math.round(pos.z/70)*70);
  }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §28 [4차] STUDIO — 선생님이 코드 없이 만드는 콘텐츠            ║
   ╚══════════════════════════════════════════════════════════════╝
   content/{id} = {type, title, status:'draft'|'published'|'archived', data:{...}, createdAt, updatedAt, deletedAt, by}
   - deletedAt이 있으면 휴지통(soft delete). 30일 안에 되살릴 수 있어요.
   - 학생 클라이언트는 status==='published' 이고 deletedAt이 없는 것만 읽어 써요. */
const Studio={
  items:{}, mirror:{}, pub:{quiz:[],quest:[],npc:{},event:[],raid:null,notice:null},
  // content = 선생님 작업실(초안 포함, 선생님만 읽기) / contentPub = 학생에게 보이는 게시본
  init(){
    if(FB.isAdmin) FB.on('content',v=>{ this.items=v||{}; UI.refreshAdmin(); });
    FB.on('contentPub',v=>{ this.mirror=v||{}; this.index(); UI.refreshAdmin(); UI.seasonHud(); });
  },
  index(){
    const P={quiz:[],quest:[],npc:{},event:[],raid:null,notice:null};
    for(const [id,it] of Object.entries(this.mirror)){
      if(!it) continue; const d=it.data||{};
      if(it.type==='quiz') P.quiz.push({id,title:it.title,...d});
      else if(it.type==='quest') P.quest.push({id,title:it.title,...d});
      else if(it.type==='npc'){ const k=d.npc||'toto'; (P.npc[k]=P.npc[k]||[]).push(...String(d.lines||'').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,8)); }
      else if(it.type==='event') P.event.push({id,title:it.title,...d});
      else if(it.type==='raid') P.raid={id,title:it.title,...d};
      else if(it.type==='notice') P.notice={id,title:it.title,...d};
    }
    this.pub=P;
  },
  list(type,{trash=false,status=''}={}){ return Object.entries(this.items).filter(([,it])=>it&&it.type===type&&(!!it.deletedAt===trash)&&(!status||it.status===status))
    .sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0)); },
  defaults(type){
    if(type==='quiz') return {qtype:'choice',lesson:7,diff:1,prompt:'사과',answer:'apple',wrong:'banana, melon, grape',hint:'빨갛고 아삭해요',reward:{exp:10,coins:3}};
    if(type==='quest') return {desc:'오늘의 도전이에요!',stat:'words',n:5,period:'daily',reward:{exp:40,coins:25}};
    if(type==='npc') return {npc:'toto',lines:'오늘도 열심히 공부했구나!\n새 단어를 만들면 힘이 솟는단다.'};
    if(type==='event') return {type:'treasure',goalMul:1,rewardMul:1,note:'선생님이 준비한 특별 이벤트예요!'};
    if(type==='raid') return {name:'영어 괴물 대왕',hpMul:1,rewardMul:1};
    return {body:'시즌 안내를 적어 주세요.'};
  },
  async create(type){
    if(!FB.isAdmin) return; const id='c'+FB.now().toString(36)+Math.random().toString(36).slice(2,5);
    await FB.set('content/'+id,{type,title:'새 '+(CONTENT_TYPES.find(t=>t[0]===type)?.[1]||'콘텐츠'),status:'draft',data:this.defaults(type),createdAt:FB.now(),updatedAt:FB.now(),by:GS.me.uid}).catch(()=>toast('만들지 못했어요.'));
    return id;
  },
  async save(id,patch){ await FB.update('content/'+id,{...patch,updatedAt:FB.now()}).catch(()=>toast('저장하지 못했어요.')); return this.sync(id); },
  // 게시 상태가 되면 학생용 사본을 만들고, 내리면 지워요
  sync(id){ const cur=this.items[id];
    if(cur&&cur.status==='published'&&!cur.deletedAt) return FB.set('contentPub/'+id,{type:cur.type,title:cur.title,data:cur.data||{}}).catch(()=>{});
    return FB.remove('contentPub/'+id); },
  saveData(id,data){ const it=this.items[id]; this.items[id]={...(it||{}),data:{...(it?.data||{}),...data}}; return this.save(id,{data:this.items[id].data}); },
  setStatus(id,s){ this.items[id]={...(this.items[id]||{}),status:s}; return this.save(id,{status:s}); },
  trash(id){ this.items[id]={...(this.items[id]||{}),deletedAt:FB.now(),status:'archived'}; return this.save(id,{deletedAt:FB.now(),status:'archived'}); },
  restore(id){ this.items[id]={...(this.items[id]||{}),deletedAt:null,status:'draft'}; return FB.update('content/'+id,{deletedAt:null,status:'draft',updatedAt:FB.now()}); },
  purge(id){ FB.remove('contentPub/'+id); return FB.remove('content/'+id); },
  purgeOld(){ if(!FB.isAdmin) return; const cut=FB.now()-TRASH_KEEP_DAYS*864e5;
    for(const [id,it] of Object.entries(this.items)) if(it?.deletedAt&&it.deletedAt<cut) this.purge(id); },
  // --- 학생 쪽에서 쓰기 ---
  quizPool(type,lesson){ return this.pub.quiz.filter(q=>(!type||q.qtype===type)&&(!lesson||+q.lesson===+lesson)); },
  makeQuiz(type,lesson){ const pool=this.quizPool(type,lesson); if(!pool.length||Math.random()>.45) return null; return this.buildQ(pick(pool)); },
  buildQ(c){
    const ans=String(c.answer||'').trim(), id='c:'+c.id, base={id,hint:c.hint||'',custom:true,reward:c.reward};
    const wrongs=String(c.wrong||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,3);
    if(c.qtype==='choice'||c.qtype==='listen')
      return {...base,type:c.qtype,prompt:c.qtype==='listen'?'잘 듣고 알맞은 단어를 골라요':(c.prompt||ans),answer:ans,options:shuffle([ans,...wrongs.length?wrongs:['banana','melon','grape']])};
    if(c.qtype==='spell'||c.qtype==='order'){
      const letters=c.qtype==='order'?[...ans.replace(/[^a-z]/gi,'')]:letterList({en:ans});
      const extra=c.qtype==='order'?[]:[pick(ALL_LETTERS),pick(ALL_LETTERS)];
      return {...base,type:c.qtype,prompt:c.qtype==='order'?'알파벳 순서대로 놓아요':(c.prompt||ans),answer:ans,tiles:shuffle([...letters,...extra]).map(l=>({l:String(l).toLowerCase(),used:false})),placed:[]};
    }
    const toks=ans.split(/\s+/).filter(Boolean);
    return {...base,type:'sentence',prompt:c.prompt||'문장을 순서대로 놓아요',answer:ans,pool:shuffle([...toks,...(wrongs[0]?[wrongs[0]]:[])]).map(t=>({t,used:false})),ans:[],len:toks.length};
  },
  npcLines(k){ return this.pub.npc[k]||[]; },
  raidCfg(){ return this.pub.raid; },
  eventCfg(){ return this.pub.event.length?pick(this.pub.event):null; }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §29 [4차] TQUESTS — 선생님이 만든 일일·주간 퀘스트            ║
   ╚══════════════════════════════════════════════════════════════╝ */
const TQuests={
  init(){ Bus.on('learn',()=>this.check()); },
  key(p){ return p==='weekly'?'W'+Math.floor((FB.now()+9*3600e3)/(7*864e5)):kstDay(FB.now()); },
  base(q){ const k=`${q.id}:${this.key(q.period)}`; if(!GS.inv.tq||typeof GS.inv.tq!=='object') GS.inv.tq={};
    if(GS.inv.tq[k]===undefined){ GS.inv.tq[k]=GS.inv.stats?.[q.stat]||0; GS.change(); } return GS.inv.tq[k]; },
  prog(q){ if(!GS.isStudent()) return 0; return Math.max(0,(GS.inv.stats?.[q.stat]||0)-this.base(q)); },
  claimId(q){ return `tq:${q.id}:${this.key(q.period)}`; },
  done(q){ return !!GS.inv.claims[this.claimId(q)]; },
  check(){ if(!GS.isStudent()) return;
    for(const q of Studio.pub.quest){ if(this.prog(q)<(+q.n||1)) continue;
      if(Rewards.give(this.claimId(q),q.reward||{exp:30,coins:20},`📜 선생님 퀘스트 「${esc(q.title)}」 완료!`)) tune([659,880,1047]); } }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §30 [4차] ANALYTICS — 학습 분석 (선생님 화면 전용, 읽기만)     ║
   ╚══════════════════════════════════════════════════════════════╝
   새 학생처럼 데이터가 하나도 없어도 0으로 안전하게 계산해요. */
const Analytics={
  _id2les:null,
  id2les(){ if(this._id2les) return this._id2les; const m={};
    for(const L of LESSONS){ (L.words||[]).forEach(w=>m[w.id]=L.n); (L.sents||[]).forEach(s=>m[s.id]=L.n); } return this._id2les=m; },
  label(id){ return WORDS[id]?.en||SENTS[id]?.en||String(id); },
  labelKo(id){ return WORDS[id]?.ko||SENTS[id]?.ko||''; },
  inv(uid){ return GS.allInv?.[uid]||{}; },
  classStats(){
    const today=kstDay(FB.now()), ids=Object.keys(GS.profiles||{});
    const out={n:ids.length,todayN:0,words:0,sentences:0,quiz:0,mined:0,newWords:0,newSents:0,eventN:0,dungeonN:0,mapN:0,
      lessons:LESSONS.map(L=>({n:L.n,right:0,miss:0})),miss:{},levels:{}};
    for(const uid of ids){
      const p=GS.profiles[uid]||{}, iv=this.inv(uid), st=iv.stats||{};
      if(p.lastSeen&&kstDay(p.lastSeen)===today) out.todayN++;
      out.words+=st.words||0; out.sentences+=st.sentences||0; out.quiz+=st.quizRight||0; out.mined+=st.mined||0;
      out.newWords+=Object.keys(iv.words||{}).length; out.newSents+=Object.keys(iv.sentences||{}).length;
      if(Object.keys(iv.eventClaims||{}).length) out.eventN++;
      if((st.dungeonWins||0)>0||Object.keys(iv.dungeonRuns||{}).length) out.dungeonN++;
      if(Object.keys(iv.claims||{}).some(k=>k.startsWith('map:'))) out.mapN++;
      out.levels[uid]=iv.level||1;
      const L2=this.id2les();
      for(const [id,c] of Object.entries(iv.words||{})){ const L=out.lessons.find(x=>x.n===L2[id]); if(L) L.right+=c||1; }
      for(const [id,c] of Object.entries(iv.sentences||{})){ const L=out.lessons.find(x=>x.n===L2[id]); if(L) L.right+=c||1; }
      for(const [id,c] of Object.entries(iv.mistakes||{})){ const L=out.lessons.find(x=>x.n===L2[id]); if(L) L.miss+=c||0; out.miss[id]=(out.miss[id]||0)+(c||0); }
    }
    out.lessons.forEach(L=>{ const t=L.right+L.miss; L.acc=t?Math.round(L.right/t*100):null; });
    out.topMiss=Object.entries(out.miss).sort((a,b)=>b[1]-a[1]).slice(0,8);
    return out;
  },
  student(uid){
    const p=GS.profiles[uid]||{}, iv=this.inv(uid), st=iv.stats||{}, L2=this.id2les();
    const per={}; for(const [id,c] of Object.entries(iv.words||{})){ const n=L2[id]; if(n){ per[n]=per[n]||{right:0,miss:0}; per[n].right+=c||1; } }
    for(const [id,c] of Object.entries(iv.sentences||{})){ const n=L2[id]; if(n){ per[n]=per[n]||{right:0,miss:0}; per[n].right+=c||1; } }
    for(const [id,c] of Object.entries(iv.mistakes||{})){ const n=L2[id]; if(n){ per[n]=per[n]||{right:0,miss:0}; per[n].miss+=c||0; } }
    const lessons=LESSONS.map(L=>{ const d=per[L.n]||{right:0,miss:0}, t=d.right+d.miss; return {n:L.n,...d,acc:t?Math.round(d.right/t*100):null}; });
    const weak=lessons.filter(l=>l.acc!==null).sort((a,b)=>a.acc-b.acc)[0]||lessons.find(l=>!l.right)||lessons[0];
    const quests=Object.entries(iv.npcQuests||{}).filter(([,q])=>q&&q.state==='doing').map(([k])=>k);
    return {name:p.name||'-',real:realName(uid),lastSeen:p.lastSeen||0,level:iv.level||1,score:p.score||0,
      activity:(st.mined||0)+(st.words||0)*2+(st.sentences||0)*3,words:Object.keys(iv.words||{}).length,sents:Object.keys(iv.sentences||{}).length,
      quiz:st.quizRight||0,lessons,weak,quests,
      topMiss:Object.entries(iv.mistakes||{}).sort((a,b)=>b[1]-a[1]).slice(0,5),
      recommend:(LES[weak?.n]?.words||[]).slice(0,3).map(w=>`${w.en} (${w.ko})`)};
  },
  // 학생 본인에게는 순위가 아니라 "다음에 해 볼 활동"으로 부드럽게 보여 줘요
  myTips(){
    if(!GS.isStudent()) return [];
    const s=this.student(GS.me.uid), tips=[];
    if(s.weak&&s.weak.acc!==null&&s.weak.acc<80) tips.push({e:'📚',t:`Lesson ${s.weak.n} 단어를 한 번 더 만들어 볼까요?`});
    if(s.topMiss.length) tips.push({e:'🔁',t:`자꾸 헷갈린 <b class="en">${esc(this.label(s.topMiss[0][0]))}</b>, 오늘 다시 도전!`});
    if(!s.sents) tips.push({e:'📝',t:'문장 제작소에서 첫 문장을 만들어 봐요.'});
    if(Season.active()) tips.push({e:Season.preset()?.emoji||'🎁',t:'시즌 과제를 하면 시즌 보상을 받을 수 있어요.'});
    if(tips.length<3) tips.push({e:'🏁',t:'친구가 만든 챌린지 코스를 하나 플레이해 봐요.'});
    return tips.slice(0,3);
  }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §31 [4차] SAFETY — 신고 처리·이용 제한·별명 초기화            ║
   ╚══════════════════════════════════════════════════════════════╝
   reports/{id}에 status('new'|'review'|'done'|'reject')가 생겼어요.
   banned/{uid} = {until, reason, at}   nickReset/{uid} = true
   ⚠ TODO(서버): 차단은 보안 규칙이 막지만, Custom Claims(admin)로 바꾸면 더 안전해요. */
const Safety={
  banned:{}, nickAsked:false,
  init(){
    if(FB.isAdmin) FB.on('banned',v=>{ this.banned=v||{}; UI.refreshAdmin(); });
    else if(GS.isStudent()) FB.on('banned/'+GS.me.uid,v=>{ this.banned={[GS.me.uid]:v}; if(v) toast(`🔒 선생님이 소셜 기능을 잠시 멈췄어요.${v.reason?'<br><small>'+esc(v.reason)+'</small>':''}`,6000); });
    if(GS.isStudent()) FB.on('nickReset/'+GS.me.uid,v=>{ if(v&&!this.nickAsked){ this.nickAsked=true;
      toast('🏷️ 선생님이 별명을 다시 정해 달라고 하셨어요.',6000); GS.inv.nick=''; GS.change(); FB.remove('nickReset/'+GS.me.uid); UI.open('social',{tab:'me'}); } });
  },
  banOf(uid){ const b=this.banned?.[uid]; return b&&(!b.until||b.until>FB.now())?b:null; },
  myBan(){ return GS.isStudent()?this.banOf(GS.me.uid):null; },
  blocked(kind){ const b=this.myBan(); if(!b) return false;
    toast(`🔒 선생님이 ${BAN_LIMITS[kind]||'이 기능'}을(를) 잠시 멈췄어요.${b.reason?`<br><small>${esc(b.reason)}</small>`:''}`,4500); return true; },
  ban(uid,days,reason){ if(!FB.isAdmin) return; FB.set('banned/'+uid,{until:FB.now()+days*864e5,reason:String(reason||'').slice(0,40),at:FB.now()}); toast(`${days}일 동안 소셜 기능을 제한했어요.`); },
  unban(uid){ FB.remove('banned/'+uid); toast('제한을 풀었어요.'); },
  askNick(uid){ FB.set('nickReset/'+uid,true); toast('별명 초기화를 요청했어요. 학생이 접속하면 새 별명을 고르게 돼요.'); },
  setStatus(id,s){ FB.update('reports/'+id,{status:s,handledAt:FB.now()}); },
  removeSticker(owner,key){ FB.remove(`guestbook/${owner}/${key}`); toast('스티커를 지웠어요.'); }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §32 [4차] PERF / NET / GUARD — 품질 설정·연결 상태·오류 보호   ║
   ╚══════════════════════════════════════════════════════════════╝ */
const Perf={
  name:'normal', q:QUALITY.normal, sfx:true,
  init(){
    const saved=localStorage.getItem('e5_quality');
    this.sfx=localStorage.getItem('e5_sfx')!=='0';
    this.set(saved||(matchMedia('(pointer:coarse)').matches?'low':'normal'),true);
  },
  set(name,silent){
    if(!QUALITY[name]) name='normal'; this.name=name; this.q=QUALITY[name];
    try{ localStorage.setItem('e5_quality',name); }catch(e){}
    renderer.shadowMap.enabled=this.q.shadow;
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,this.q.pixel));
    renderer.setSize(innerWidth,innerHeight);
    LIMITS.maxParticles=this.q.particles; LIMITS.plotViewDist=this.q.plotDist; LIMITS.maxRemotes=name==='low'?16:40;
    scene.traverse(o=>{ if(o.isMesh&&o.castShadow!==undefined&&!this.q.shadow) o.receiveShadow=false; });
    Season.rebuildWeather?.();
    if(!silent) toast(`🎚️ 그래픽 품질을 <b>${this.q.name}</b>(으)로 바꿨어요.`);
    UI.refresh?.();
  },
  setSfx(v){ this.sfx=!!v; try{ localStorage.setItem('e5_sfx',v?'1':'0'); }catch(e){} }
};
const Net={
  online:true, saving:false, savedAt:0, lastErr:'',
  init(){
    this.online=FB.mode==='online';
    if(FB.mode==='online'&&FB.api.onConn) FB.api.onConn(v=>{
      const was=this.online; this.online=v;
      if(!v) toast('📡 인터넷이 끊겼어요. 지금 한 것은 기기에 담아 두었다가 연결되면 저장돼요.',6000);
      else if(!was){ toast('✅ 다시 연결됐어요! 저장을 이어 갈게요.'); GS.flush(true); }
      UI.netHud(); });
    addEventListener('online',()=>UI.netHud()); addEventListener('offline',()=>{ this.online=false; UI.netHud(); });
  },
  onSave(){ this.saving=true; UI.netHud(); clearTimeout(this._t); this._t=setTimeout(()=>{ this.saving=false; this.savedAt=FB.now(); UI.netHud(); },700); }
};
const Guard={
  count:0,
  init(){
    addEventListener('error',e=>this.report(e.message||e.error));
    addEventListener('unhandledrejection',e=>this.report(e.reason?.message||e.reason));
  },
  report(err){
    const msg=String(err&&err.message||err||'알 수 없는 문제').slice(0,160);
    this.count++; console.warn('[게임 오류]',msg);
    if(this.count<=3){ UI.errorBar(msg); this.log(msg); }
  },
  // 학생 이름·UID는 저장하지 않아요 (개인 식별 정보 없이 오류만)
  log(msg){ try{ FB.push('errorLog',{m:msg,at:FB.serverTs(),ua:(navigator.userAgent||'').slice(0,60),role:GS.me?.role||'?'}); }catch(e){} }
};
// PWA: 설치와 오프라인 껍데기 캐시
const PWA={
  deferred:null,
  init(){
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
    addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); this.deferred=e; UI.hud(); });
  },
  can(){ return !!this.deferred; },
  async install(){ if(!this.deferred) return toast('브라우저 메뉴의 “홈 화면에 추가”로도 설치할 수 있어요.');
    this.deferred.prompt(); await this.deferred.userChoice.catch(()=>{}); this.deferred=null; UI.hud(); }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §34 [5차] CLASSES — 학급 만들기·참여·학급 안에서만 어울리기     ║
   ╚══════════════════════════════════════════════════════════════╝
   classes/{cid}      = {name, grade, room, code, owner, lessonFrom, lessonTo, diff, season, archived, createdAt}
   classCodes/{CODE}  = cid                     (학생이 입력하는 6자리 학급 코드)
   classMembers/{cid}/{uid} = {name, at}        (본인만 자기 줄을 쓰고, 선생님은 지울 수 있어요)
   inventory/{uid}.class / .classes = 지금 활동 중인 학급 / 내가 속한 학급 목록 */
const Classes={
  all:{}, mates:{}, members:{}, cur:null, unsubMates:null,
  init(){
    FB.on('classes',v=>{ this.all=v||{}; UI.refreshAdmin(); UI.classHud(); if(UI.modal==='classes') UI.render(); });
    if(FB.isAdmin) FB.on('classMembers',v=>{ this.members=v||{}; UI.refreshAdmin(); });
    if(GS.isStudent()){ const cid=GS.inv.class; if(cid) this.select(cid,true); }
  },
  cfg(){ return this.all[this.cur]||null; },
  name(cid){ return this.all[cid]?.name||'학급'; },
  mine(){ return Object.keys(GS.inv?.classes||{}).filter(c=>this.all[c]&&!this.all[c].archived); },
  count(cid){ return Object.keys(this.members[cid]||(cid===this.cur?this.mates:{})||{}).length; },
  lessonRange(){ const c=this.cfg(); const a=+c?.lessonFrom||LESSONS[0].n, b=+c?.lessonTo||LESSONS[LESSONS.length-1].n;
    const r=LESSONS.filter(L=>L.n>=Math.min(a,b)&&L.n<=Math.max(a,b)).map(L=>L.n); return r.length?r:LESSONS.map(L=>L.n); },
  pickLesson(){ return pick(this.lessonRange()); },
  diff(){ return DIFF_CFG[this.cfg()?.diff]?this.cfg().diff:'normal'; },
  qtype(){ return pick(DIFF_CFG[this.diff()].types); },
  inClass(uid){ if(!this.cur||!GS.isStudent()) return true; return uid===GS.me.uid||!!this.mates[uid]; }, // 학급을 안 고르면 모두와 어울려요
  select(cid,silent){
    if(!cid){ this.cur=null; this.unsubMates?.(); this.mates={}; return; }
    this.cur=cid; this.unsubMates?.();
    this.unsubMates=FB.on('classMembers/'+cid,v=>{ this.mates=v||{}; UI.classHud(); UI.refreshSocial(); if(UI.modal==='classes') UI.render(); },()=>{ this.mates={}; });
    if(GS.isStudent()){ if(GS.inv.class!==cid){ GS.inv.class=cid; GS.change(); GS.flush(true); }
      if(!GS.inv.classes||typeof GS.inv.classes!=='object') GS.inv.classes={};
      if(!GS.inv.classes[cid]){ GS.inv.classes[cid]=true; GS.change(); } }
    Session.watch();
    if(!silent) toast(`🏫 「${esc(this.name(cid))}」 학급으로 들어왔어요!`);
    UI.classHud();
  },
  async join(code){
    code=String(code||'').trim().toUpperCase(); if(!/^[A-Z0-9]{6}$/.test(code)) return toast('학급 코드는 영어와 숫자 6자리예요.');
    const cid=await FB.get('classCodes/'+code).catch(()=>null); if(!cid||!this.all[cid]) return toast('그 코드의 학급을 찾지 못했어요. 선생님께 다시 여쭤 보세요.');
    if(this.all[cid].archived) return toast('지금은 닫힌 학급이에요.');
    try{ await FB.set(`classMembers/${cid}/${GS.me.uid}`,{name:GS.me.name,at:FB.serverTs()}); }
    catch(e){ return toast('학급에 들어가지 못했어요. 다시 해 볼까요?'); }
    this.select(cid); tune([523,659,784]); UI.render();
  },
  leave(cid){
    FB.remove(`classMembers/${cid}/${GS.me.uid}`); if(GS.inv.classes) delete GS.inv.classes[cid]; GS.change();
    if(this.cur===cid){ const next=this.mine()[0]||null; GS.inv.class=next; this.select(next,true); }
    toast('학급에서 나왔어요.');
  },
  // --- 선생님 ---
  code6(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<CLASS.codeLen;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; },
  async create(name,grade,room){
    if(!FB.isAdmin) return; const cid='k'+FB.now().toString(36)+Math.random().toString(36).slice(2,4);
    let code=this.code6(); for(let i=0;i<5;i++){ if(!await FB.get('classCodes/'+code).catch(()=>null)) break; code=this.code6(); }
    await FB.set('classes/'+cid,{name:String(name||'우리 반').slice(0,CLASS.nameMax),grade:+grade||5,room:+room||1,code,owner:GS.me.uid,
      lessonFrom:LESSONS[0].n,lessonTo:LESSONS[LESSONS.length-1].n,diff:'normal',season:'',archived:false,createdAt:FB.now()});
    await FB.set('classCodes/'+code,cid); toast(`🏫 학급을 만들었어요! 학급 코드: ${code}`); return cid;
  },
  update(cid,patch){ return FB.update('classes/'+cid,patch); },
  archive(cid,v){ return FB.update('classes/'+cid,{archived:!!v}); },
  kick(cid,uid){ return FB.remove(`classMembers/${cid}/${uid}`); }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §35 [5차] SESSION — 실시간 수업 모드 (방 상태 머신)            ║
   ╚══════════════════════════════════════════════════════════════╝
      [없음] ──선생님 "수업 열기"──▶ lobby(대기실)
                                      │ 학생: 참여하기 → sessionStats에 이름만 기록
              선생님 "활동 시작" ─────▶ active(활동 진행)  ⏱ 남은 시간 endsAt
                                      │ 학생: 문제/던전/코스 활동, 정답·오답 집계
        시간 종료 또는 "결과 보기" ──▶ result(결과 확인)  학급 정답률·복습 추천
                    선생님 "끝내기" ─▶ ended(종료) → 기록만 남고 배너 사라짐
   sessions/{cid} = {sid, state, kind, lesson, mins, anon, mapId, startAt, endsAt, by, createdAt}
   sessionStats/{sid}/{uid} = {name, right, wrong, at, w:{문항id:틀린 수}}
   ⚠ TODO(서버): 정답 집계와 수업 보상은 Cloud Functions(onCall: sessionAnswer)에서 검증해야 조작을 막을 수 있어요. */
const Session={
  cur:null, stats:{}, unsub:null, unsubStats:null, joined:false, right:0, wrong:0, wrongIds:{}, lastPush:0, lastState:null, quizOn:false,
  init(){ this.watch(); },
  watch(){
    this.unsub?.(); this.unsubStats?.(); this.unsub=this.unsubStats=null; this.cur=null; this.stats={};
    const cid=Classes.cur; if(!cid) { UI.classHud(); return; }
    this.unsub=FB.on('sessions/'+cid,v=>this.onSession(v));
  },
  onSession(v){
    const prev=this.cur?.sid, prevState=this.cur?.state; this.cur=v||null;
    if(v?.sid!==prev){ this.joined=false; this.right=0; this.wrong=0; this.wrongIds={}; this.quizOn=false;
      this.unsubStats?.(); this.unsubStats=v?.sid?FB.on('sessionStats/'+v.sid,s=>{ this.stats=s||{}; UI.refreshAdmin(); UI.classHud(); }):null; }
    if(v&&v.state!==prevState){
      if(v.state==='lobby') toast('🎓 선생님이 수업 활동을 열었어요! 화면 위의 <b>참여하기</b>를 눌러요.',6000);
      else if(v.state==='active'){ toast('▶️ 수업 활동을 시작했어요!',4000); tune([523,659,784]); if(this.joined) this.begin(); }
      else if(v.state==='result'&&GS.isStudent()&&this.joined) UI.open('lessonresult');
      else if(v.state==='ended') this.quizOn=false;
    }
    UI.classHud(); UI.refreshAdmin(); if(UI.modal==='lesson') UI.render();
  },
  live(){ return this.cur&&['lobby','active'].includes(this.cur.state); },
  left(){ return this.cur?.endsAt?Math.max(0,this.cur.endsAt-FB.now()):0; },
  // --- 학생 ---
  join(){
    if(!this.live()||!GS.isStudent()) return; this.joined=true;
    FB.set(`sessionStats/${this.cur.sid}/${GS.me.uid}`,{name:GS.me.name,right:0,wrong:0,at:FB.serverTs()}).catch(()=>{});
    toast('✋ 참여했어요! 선생님이 시작하면 활동이 열려요.');
    if(this.cur.state==='active') this.begin();
    UI.classHud();
  },
  begin(){
    const s=this.cur; if(!s) return;
    if(s.kind==='quiz'){ this.quizOn=true; this.nextQuiz(); }
    else if(s.kind==='dungeon'){ toast('⚔️ 광장 포털로 가서 던전에 들어가요!',5000); Dungeon.tryEnter(); }
    else if(s.kind==='map'&&s.mapId) Maps.open(s.mapId,'play');
    else if(s.kind==='event') toast('🎪 마을 광장에서 이벤트에 참여해요!',5000);
    else if(s.kind==='raid') toast('👾 광장에 괴물 대왕이 나타나요! 모두 모여요!',5000);
  },
  nextQuiz(){
    if(!this.quizOn||!this.live()||this.cur.state!=='active') { this.quizOn=false; return; }
    const s=this.cur, lesson=+s.lesson||Classes.pickLesson(), type=s.qtype&&s.qtype!=='mix'?s.qtype:Classes.qtype();
    UI.openQuiz(Quiz.make(type,lesson),{title:'🎓 선생님 활동',sub:`${Classes.name(Classes.cur)} · 남은 시간 ${fmtClock(this.left())}`,
      onDone:ok=>{ this.record(ok,UI.qz?.q?.id); setTimeout(()=>{ if(this.quizOn) this.nextQuiz(); },400); }});
  },
  record(ok,id){
    if(!this.cur||!GS.isStudent()) return;
    if(ok) this.right++; else { this.wrong++; if(id) this.wrongIds[id]=(this.wrongIds[id]||0)+1; }
    const t=performance.now(); if(t-this.lastPush<1200) return; this.lastPush=t;
    FB.set(`sessionStats/${this.cur.sid}/${GS.me.uid}`,{name:GS.me.name,right:this.right,wrong:this.wrong,w:this.wrongIds,at:FB.serverTs()}).catch(()=>{});
  },
  // --- 선생님 ---
  open(cfg){
    const cid=Classes.cur||Object.keys(Classes.all)[0]; if(!cid) return toast('먼저 학급을 만들고 골라 주세요.');
    const now=FB.now();
    return FB.set('sessions/'+cid,{sid:'ls'+now.toString(36),state:'lobby',createdAt:now,by:GS.me.uid,
      kind:cfg.kind||'quiz',lesson:+cfg.lesson||0,qtype:cfg.qtype||'mix',mins:+cfg.mins||15,anon:cfg.anon!==false,mapId:cfg.mapId||null});
  },
  start(){
    const s=this.cur; if(!s) return; const now=FB.now();
    FB.update('sessions/'+Classes.cur,{state:'active',startAt:now,endsAt:now+(+s.mins||15)*60e3});
    if(s.kind==='event') EventSys.start(Studio.eventCfg()?.type||'treasure');
    if(s.kind==='raid') Raid.start('chief');
  },
  toResult(){ FB.update('sessions/'+Classes.cur,{state:'result',endsAt:FB.now()}); },
  end(){ FB.update('sessions/'+Classes.cur,{state:'ended'}); },
  clear(){ FB.remove('sessions/'+Classes.cur); },
  tick(){ const s=this.cur; if(s?.state==='active'&&FB.now()>s.endsAt&&FB.isAdmin) this.toResult(); },
  summary(){
    const rows=Object.entries(this.stats), right=rows.reduce((a,[,r])=>a+(r.right||0),0), wrong=rows.reduce((a,[,r])=>a+(r.wrong||0),0);
    const miss={}; rows.forEach(([,r])=>{ for(const [id,c] of Object.entries(r.w||{})) miss[id]=(miss[id]||0)+c; });
    return {n:rows.length,right,wrong,rate:right+wrong?Math.round(right/(right+wrong)*100):null,
      top:Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,5),rows};
  }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §36 [5차] RECOMMEND — 규칙 기반 개인화 추천 (외부 AI 없음)      ║
   ╚══════════════════════════════════════════════════════════════╝
   우선순위 1) 자주 틀린 것 → 2) 아직 못 만든 필수 단어 → 3) 오래 복습 안 한 것 → 4) 레벨에 맞는 활동
   추천 이유는 초등학생이 읽을 수 있는 문장으로 만들어요. 강제가 아니라 눌러서 고르는 방식이에요. */
const Recommend={
  init(){ Bus.on('learn',d=>{ if(d.id&&(d.kind==='word'||d.kind==='sentence')){ if(!GS.inv.seen||typeof GS.inv.seen!=='object') GS.inv.seen={}; GS.inv.seen[d.id]=FB.now(); GS.change(); } }); },
  cards(){
    if(!GS.isStudent()||!GS.inv) return []; const inv=GS.inv, out=[], used=new Set();
    // 1) 자주 틀린 단어·문장
    Object.entries(inv.mistakes||{}).sort((a,b)=>b[1]-a[1]).slice(0,2).forEach(([id,c])=>{
      if(c<REC.missMin) return; const w=WORDS[id]||SENTS[id]; if(!w||used.has(id)) return; used.add(id);
      out.push({icon:'🔁',w:REC.weights.miss,title:`${w.en} 다시 연습하기`,
        reason:`지난번에 헷갈렸던 <b class="en">${esc(w.en)}</b>(${esc(w.ko)})을(를) 다시 연습해 볼까요?`,act:'focus',id,kind:WORDS[id]?'word':'sent'});
    });
    // 2) 우리 학급 레슨에서 아직 한 번도 안 만든 단어
    for(const n of Classes.lessonRange()){ const w=(LES[n]?.words||[]).find(x=>!inv.words?.[x.id]&&!used.has(x.id)); if(!w) continue; used.add(w.id);
      out.push({icon:'✨',w:REC.weights.todo,title:`${w.en} 처음 만들어 보기`,
        reason:`Lesson ${n}의 <b class="en">${esc(w.en)}</b>(${esc(w.ko)})은(는) 아직 만들지 않았어요.`,act:'focus',id:w.id,kind:'word'}); break; }
    // 3) 오래 복습하지 않은 단어
    const seen=inv.seen||{};
    const stale=Object.keys(inv.words||{}).filter(id=>WORDS[id]&&!used.has(id)).map(id=>[id,seen[id]||0]).sort((a,b)=>a[1]-b[1])[0];
    if(stale){ const days=stale[1]?Math.floor((FB.now()-stale[1])/864e5):REC.staleDays;
      if(days>=REC.staleDays){ used.add(stale[0]); const w=WORDS[stale[0]];
        out.push({icon:'⏳',w:REC.weights.stale,title:`${w.en} 오랜만에 복습`,
          reason:`<b class="en">${esc(w.en)}</b>은(는) ${days}일 동안 안 만들었어요. 아직 기억나는지 볼까요?`,act:'focus',id:stale[0],kind:'word'}); } }
    // 4) 지금 레벨에 어울리는 활동
    const st=inv.stats||{};
    if((inv.level||1)>=3&&!(st.dungeonWins||0)) out.push({icon:'⚔️',w:REC.weights.level,title:'던전에 처음 도전하기',reason:`Lv.${inv.level}이 되었으니 광장 포털에서 던전에 들어갈 수 있어요!`,act:'dungeon'});
    else if(Season.active()&&Season.quests().some(q=>!Season.questDone(q))) out.push({icon:Season.preset()?.emoji||'🎪',w:REC.weights.level,title:'시즌 과제 이어 하기',reason:'시즌 과제를 끝내면 시즌 보상 트랙이 쌓여요.',act:'season'});
    else if(!Object.keys(inv.claims||{}).some(k=>k.startsWith('map:'))) out.push({icon:'🏁',w:REC.weights.level,title:'친구 코스 도전하기',reason:'친구가 만든 챌린지 코스를 하나 깨 볼까요?',act:'maps'});
    else out.push({icon:'📝',w:REC.weights.level,title:'문장 만들기',reason:'문장 제작소에서 오늘의 문장을 하나 만들어 봐요.',act:'none'});
    return out.sort((a,b)=>b.w-a.w).slice(0,REC.maxCards);
  },
  run(c){
    if(c.act==='focus'&&c.kind==='word'&&WORDS[c.id]){ GS.focusWord=WORDS[c.id]; GS.change(); UI.close();
      toast(`🎯 <b class="en">${esc(WORDS[c.id].en)}</b>을(를) 골랐어요! 단어 제작대(광장 서쪽)로 가 봐요.`,5000); return; }
    if(c.act==='focus'){ UI.close(); const s=SENTS[c.id]; toast(s?`🎯 문장 제작소에서 「${esc(s.ko)}」 문장을 만들어 봐요!`:'제작대로 가 봐요!',5000); return; }
    if(c.act==='dungeon'){ UI.close(); toast('⚔️ 마을 광장 가운데 포털로 가면 던전에 들어갈 수 있어요!',5000); return; }
    if(c.act==='season') return UI.open('season');
    if(c.act==='maps') return UI.open('maps',{tab:'play'});
    UI.close();
  }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §37 [5차] TEMPLATES — 수업 콘텐츠 템플릿 저장·복제             ║
   ╚══════════════════════════════════════════════════════════════╝
   templates/{tid} = {title, desc, tags, lessons, diff, kind, data, owner, ownerName, scope, createdAt, uses} */
const Templates={
  all:{},
  init(){ if(FB.isAdmin) FB.on('templates',v=>{ this.all=v||{}; UI.refreshAdmin(); }); },
  list(){ return [...TEMPLATE_PRESETS.map(p=>[p.id,{...p,preset:true,ownerName:'기본 제공',scope:'school'}]),
    ...Object.entries(this.all).filter(([,t])=>t&&(t.scope==='school'||t.owner===GS.me.uid)).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0))]; },
  get(id){ return TEMPLATE_PRESETS.find(p=>p.id===id)||this.all[id]||null; },
  async save(t){
    if(!FB.isAdmin) return; const id='t'+FB.now().toString(36)+Math.random().toString(36).slice(2,4);
    await FB.set('templates/'+id,{title:String(t.title||'새 템플릿').slice(0,30),desc:String(t.desc||'').slice(0,80),
      tags:(t.tags||[]).slice(0,4),lessons:t.lessons||[],diff:t.diff||'normal',kind:t.kind,data:t.data||{},
      owner:GS.me.uid,ownerName:GS.me.name,scope:t.scope||'private',createdAt:FB.now(),uses:0}).catch(()=>toast('저장하지 못했어요.'));
    toast('📦 템플릿으로 저장했어요.'); return id;
  },
  fromContent(id){ const it=Studio.items[id]; if(!it) return;
    return this.save({title:it.title,desc:'선생님 콘텐츠에서 저장했어요.',tags:[it.type],lessons:it.data?.lesson?[it.data.lesson]:[],kind:it.type,data:it.data,scope:'private'}); },
  async use(id){
    const t=this.get(id); if(!t) return;
    if(!t.preset) FB.update('templates/'+id,{uses:(t.uses||0)+1}).catch(()=>{});
    if(t.kind==='session'){ Object.assign(ls5,{kind:t.data.kind||'quiz',lesson:t.data.lesson||0,mins:t.data.mins||15,anon:t.data.anon!==false,qtype:t.data.qtype||'mix'});
      adm.tab='lesson'; toast(`📋 「${esc(t.title)}」 설정을 수업 탭에 넣었어요. 확인하고 수업을 열어요.`); UI.render(); return; }
    const cid=await Studio.create(t.kind); if(!cid) return;
    Studio.items[cid]={type:t.kind,title:t.title,status:'draft',data:t.data};
    await Studio.save(cid,{title:t.title,data:t.data});
    st4.type=t.kind; st4.sel=cid; adm.tab='studio'; toast('📥 템플릿을 콘텐츠 초안으로 가져왔어요. 확인 후 게시해요.'); UI.render();
  },
  remove(id){ if(this.get(id)?.preset) return toast('기본 제공 템플릿은 지울 수 없어요.'); FB.remove('templates/'+id); }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §38 [5차] REPORT — 주간 리포트 (인쇄 친화 화면)                ║
   ╚══════════════════════════════════════════════════════════════╝
   inventory/{uid}.week = {key, base:{활동 기준값}, words, sents, at}  ← 주가 바뀌면 자동으로 새로 시작해요 */
const Report={
  key(t){ return 'W'+Math.floor(((t??FB.now())+9*3600e3)/WEEK_MS); },
  st(){
    if(!GS.isStudent()) return {key:this.key(),base:{},words:0,sents:0};
    let W=GS.inv.week;
    if(!W||typeof W!=='object'||W.key!==this.key()){
      W=GS.inv.week={key:this.key(),base:{...(GS.inv.stats||{})},words:Object.keys(GS.inv.words||{}).length,sents:Object.keys(GS.inv.sentences||{}).length,at:FB.now()};
      GS.change(); }
    return W;
  },
  mine(){
    const W=this.st(), st=GS.inv.stats||{}, d=k=>Math.max(0,(st[k]||0)-(W.base?.[k]||0));
    const growth=Object.keys(GROWTH_LABELS).map(k=>({k,n:d(k)})).sort((a,b)=>b.n-a.n)[0];
    const badges=Object.entries(GS.inv.badges||{}).filter(([,t])=>FB.now()-t<WEEK_MS).map(([id])=>Badges.def(id)).filter(Boolean);
    return {words:d('words'),sentences:d('sentences'),quiz:d('quizRight'),mined:d('mined'),builds:d('builds'),
      newWords:Math.max(0,Object.keys(GS.inv.words||{}).length-(W.words||0)),newSents:Math.max(0,Object.keys(GS.inv.sentences||{}).length-(W.sents||0)),
      growth,badges,tips:Recommend.cards(),since:W.at||FB.now()};
  },
  // 선생님: 학급 전체 합계만 보여 주고 개인 성적은 노출하지 않아요
  classReport(cid){
    const ids=cid?Object.keys(Classes.members[cid]||{}):Object.keys(GS.profiles||{});
    const out={n:ids.length,active:0,words:0,sentences:0,quiz:0,badges:0,miss:{}};
    const key=this.key();
    for(const uid of ids){ const iv=GS.allInv?.[uid]||{}, st=iv.stats||{}, W=iv.week;
      const base=(W&&W.key===key)?(W.base||{}):null; const d=k=>base?Math.max(0,(st[k]||0)-(base[k]||0)):0;
      const w=d('words'), s=d('sentences'), q=d('quizRight');
      if(w+s+q>0) out.active++;
      out.words+=w; out.sentences+=s; out.quiz+=q;
      out.badges+=Object.values(iv.badges||{}).filter(t=>FB.now()-t<WEEK_MS).length;
      for(const [id,c] of Object.entries(iv.mistakes||{})) out.miss[id]=(out.miss[id]||0)+c;
    }
    out.top=Object.entries(out.miss).sort((a,b)=>b[1]-a[1]).slice(0,6);
    return out;
  }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §39 [5차] BADGES — 학습·협동·창작·꾸미기 성취 기록             ║
   ╚══════════════════════════════════════════════════════════════╝
   inventory/{uid}.badges = {배지id: 획득 시각}, .badge = 대표 배지 (profiles에도 올려서 친구가 볼 수 있어요)
   ⚠ TODO(서버): 배지 조건 검사도 Cloud Functions에서 한 번 더 확인하면 조작을 막을 수 있어요. */
const Badges={
  init(){ Bus.on('learn',d=>{ if(d.kind==='dungeonClear'&&Party.id) Progress.inc('partyDungeon'); this.check(); }); setTimeout(()=>this.check(),4000); },
  def(id){ return BADGES.find(b=>b.id===id)||null; },
  has(id){ return !!GS.inv?.badges?.[id]; },
  ctx(){ return {inv:GS.inv,st:GS.inv.stats||{},friends:Object.keys(Social.friends||{}).length,
    maps:Object.values(Maps.idx||{}).filter(m=>m.owner===GS.me.uid&&m.public).length}; },
  check(){
    if(!GS.isStudent()||!GS.inv) return;
    if(!GS.inv.badges||typeof GS.inv.badges!=='object') GS.inv.badges={};
    const c=this.ctx();
    for(const B of BADGES){ if(this.has(B.id)) continue; let ok=false; try{ ok=!!B.ok(c); }catch(e){ ok=false; }
      if(!ok) continue;
      GS.inv.badges[B.id]=FB.now(); if(!GS.inv.badge) GS.inv.badge=B.id; GS.change();
      Rewards.give('badge:'+B.id,B.reward,`${B.emoji} 배지 「${B.name}」을(를) 얻었어요!`); tune([659,880,1047,1319]);
      if(player) popAt(pos.x,pos.y+3.8,pos.z,B.emoji+' 배지!'); }
  },
  mine(){ return Object.entries(GS.inv?.badges||{}).map(([id,t])=>({...this.def(id),at:t})).filter(b=>b.id); },
  setMain(id){ if(!this.has(id)) return; GS.inv.badge=id; GS.change(); GS.flush(true); toast('대표 배지를 바꿨어요.'); },
  mainOf(uid){ const id=uid===GS.me.uid?GS.inv?.badge:GS.profiles[uid]?.badge; const b=this.def(id); return b?`${b.emoji}`:''; }
};

/* ╔══════════════════════════════════════════════════════════════╗

const panelEl=$('#panel'), modalEl=$('#modal');
const wb={lesson:7,sel:null,placed:[],wrong:[],ok:false,busy:false};
const fg={lesson:7,sel:null,pool:[],ans:[],state:'',busy:false};

const bd={tab:'daily'}; // [2차] 게시판 탭

const UI={
  modal:null, arg:null, qz:null, bt:{phase:'choose',q:null,type:null,msg:'',bad:false,busy:false}, lastPrompt:'',
  open(k,arg=null){
    if(k==='board'&&!GS.isStudent()) k='admin';

    this.modal=k; this.arg=arg; modalEl.classList.add('open'); this.render(); panelEl.scrollTop=0; beep(520,.05,'triangle',.05);
  },
  close(){ this.modal=null; this.qz=null; modalEl.classList.remove('open'); },
  render(){
    if(!this.modal) return; const st=panelEl.scrollTop;
    const f={work:renderWork,forge:renderForge,bag:renderBag,board:renderBoard,rank:renderRank,say:renderSay,help:renderHelp,admin:renderAdmin,quiz:renderQuiz,battle:renderBattle,dgresult:renderDgResult,
      npc:renderNpc,shop:renderShop,craft:renderCraft,attend:renderAttend,
      social:renderSocial,profile:renderProfile,invite:renderInvite,report:renderReport,guestbook:renderGuestbook,raid:renderRaid,raidresult:renderRaidResult,maps:renderMaps,mapresult:renderMapResult, // [3차]
      season:renderSeason,settings:renderSettings,safety:renderSafety, // [4차]
      mylog:renderMylog,lesson:renderLesson,lessonresult:renderLessonResult}[this.modal]; // [5차] // [2차] npc·shop·craft·attend
    panelEl.className='panel'+(['battle','dgresult','raid','raidresult'].includes(this.modal)?' dark':''); panelEl.innerHTML=f(); panelEl.scrollTop=st;
  },
  refresh(){ this.hud(); if(!this.modal) return;
    if(this.modal==='admin'&&['quest','notice'].includes(adm.tab)){ const el=$('#adm-list'); if(el) el.innerHTML=adminQuestList(); return; }
    if(['board','rank','admin','bag'].includes(this.modal)) this.render(); },
  refreshAdmin(){ if(this.modal==='admin'&&['event','dungeon','check','stats','daily','raid','maps','reports','season','studio','analytics','trash','class','lesson','templates','weekly'].includes(adm.tab)) this.render(); },
  openQuiz(q,opts){ this.qz={q,opts,res:null,busy:false}; this.open('quiz'); },
  prompt(html){ const el=$('#prompt'); if(!html){ el.classList.add('hidden'); this.lastPrompt=''; return; } el.classList.remove('hidden'); if(html!==this.lastPrompt){ el.innerHTML=html; this.lastPrompt=html; } },
  hud(){ // [2차] 레벨·경험치·코인·보석·기운
    if(!GS.inv) return; const inv=GS.inv;
    $('#me-name').textContent=(GS.isStudent()?'':'👑 ')+GS.me.name;

      const need=Growth.need(inv.level);

// --- 단어 제작대 ---
function renderWork(){
  const L=LES[wb.lesson];
  let h=head('🔨 단어 제작대','한글 뜻을 보고 가방 속 알파벳을 순서대로 눌러 영어 단어를 만들어요. 틀리면 알파벳은 그대로 돌려받아요.')+lessonTabs(wb.lesson,'wb-lesson');
  h+='<div class="wgrid">'+L.words.map(w=>{ const made=GS.inv.words[w.id]||0, miss=missingLetters(w).length;
    return `<button class="card ${made?'done':''} ${wb.sel===w.id?'sel':''}" data-act="wb-word" data-id="${w.id}"><span class="ko">${esc(w.ko)}</span>
      <span class="meta">${made?`✅ ${made}번 만들었어요`:'아직 안 만들었어요'}<br>${miss?`알파벳 ${miss}개가 모자라요`:'알파벳이 충분해요'}</span></button>`; }).join('')+'</div>';
  if(wb.sel) h+=craftWordHTML(WORDS[wb.sel]);
  return h;
}
function craftWordHTML(w){
  const used={}; wb.placed.forEach(l=>{ if(l) used[l]=(used[l]||0)+1; });
  const slots=[...w.en].map((ch,i)=>{ if(!/[a-z]/i.test(ch)) return `<span class="slot fixed">${ch===' '?'':esc(ch)}</span>`;
    const p=wb.placed[i], cls=wb.wrong.includes(i)?'wrong':(wb.ok?'good':'');
    return p?`<button class="slot filled ${cls}" data-act="wb-unslot" data-i="${i}">${ch!==ch.toLowerCase()?p.toUpperCase():p}</button>`:'<span class="slot"></span>'; }).join('');
  const avail=Object.keys(GS.inv.letters).filter(l=>GS.inv.letters[l]-(used[l]||0)>0).sort();
  const tray=avail.length?avail.map(l=>`<button class="tile" data-act="wb-letter" data-l="${l}">${l}<span class="cnt">${GS.inv.letters[l]-(used[l]||0)}</span></button>`).join(''):'<p class="empty">남은 알파벳이 없어요. 마을 광산에서 알파벳을 캐 오세요.</p>';
  const miss=missingLetters(w).length;
  return `<div class="craft ${wb.ok?'celebrate':''}"><div class="craft-top"><span class="craft-ko">${esc(w.ko)}</span>
    <button class="btn leaf sm" data-act="speak" data-t="${esc(w.en)}">🔊 발음 듣기</button><button class="btn sm" data-act="wb-clear">다시 놓기</button></div>
    <div class="slots">${slots}</div>${miss?`<p class="hint">이 단어를 만들려면 알파벳이 ${miss}개 더 필요해요. 지금 광산에 가면 필요한 알파벳이 더 자주 나와요.</p>`:''}
    <div class="tray">${tray}</div></div>`;
}
function checkWord(w){
  const chars=[...w.en], wrong=[]; chars.forEach((ch,i)=>{ if(/[a-z]/i.test(ch)&&wb.placed[i]!==ch.toLowerCase()) wrong.push(i); });
  wb.busy=true;
  if(!wrong.length){ const first=Learn.finishWord(w,wb.placed); speak(w.en); tune([523,659,784]); wb.ok=true;
    toast(first?`📘 새 단어 <b class="en">${esc(w.en)}</b> 완성! ⭐+10 🪙+2`:`📘 <b class="en">${esc(w.en)}</b> 복습 완료! ⭐+3 🪙+1`); UI.render();
    setTimeout(()=>{ wb.ok=false; wb.placed=[]; wb.busy=false; if(UI.modal==='work') UI.render(); },1100); }
  else { wb.wrong=wrong; Learn.miss(w.id); beep(180,.25,'sawtooth',.05); UI.render();
    setTimeout(()=>{ wb.wrong=[]; wb.placed=[]; wb.busy=false; if(UI.modal==='work') UI.render(); },1000); }
}
// --- 문장 제작소 ---
function preparePool(s){
  const mine=new Set(s.tokens.map(norm)), others=[];
  LES[s.lesson].sents.forEach(o=>{ if(o.id!==s.id) o.tokens.forEach(t=>{ if(!mine.has(norm(t))&&!others.some(x=>norm(x)===norm(t))) others.push(t); }); });
  fg.pool=shuffle([...s.tokens,...shuffle(others).slice(0,2)]).map(t=>({t,used:false})); fg.ans=[]; fg.state='';
}
function renderForge(){
  const L=LES[fg.lesson];
  let h=head('🔥 문장 제작소','단어 제작대에서 만든 단어가 있어야 문장을 만들 수 있어요. 문장을 완성하면 아이템이 나와요.')+lessonTabs(fg.lesson,'fg-lesson');
  h+='<div class="sgrid">'+L.sents.map(s=>{ const made=GS.inv.sentences[s.id]||0, ready=s.keyIds.every(k=>GS.inv.words[k]);
    const chips=s.keyIds.map(k=>`<span class="chip ${GS.inv.words[k]?'have':''}">${GS.inv.words[k]?'✅':'🔒'} ${esc(WORDS[k].ko)}</span>`).join('');
    return `<button class="card scard ${made?'done':''} ${fg.sel===s.id?'sel':''} ${ready?'':'locked'}" data-act="fg-sent" data-id="${s.id}"><span class="item">${made?s.item[0]:'❔'}</span>
      <span class="scard-body"><span class="ko">${esc(s.ko)}</span><span class="meta">${made?`${esc(s.item[1])} ${made}개`:'필요한 단어'}</span><span class="chips">${chips}</span></span></button>`; }).join('')+'</div>';
  if(fg.sel){ const s=SENTS[fg.sel];
    const ans=fg.ans.map((a,i)=>`<button class="wtile ${fg.state}" data-act="fg-unans" data-i="${i}">${esc(a.t)}</button>`).join('')||'<span class="ph">아래 단어 블록을 순서대로 눌러요</span>';
    const pool=fg.pool.map((t,i)=>t.used?'':`<button class="wtile" data-act="fg-pick" data-i="${i}">${esc(t.t)}</button>`).join('');
    h+=`<div class="craft ${fg.state==='good'?'celebrate':''}"><div class="craft-top"><span class="craft-ko">${esc(s.ko)}</span>
      <button class="btn leaf sm" data-act="speak" data-t="${esc(s.en)}">🔊 문장 듣기</button><button class="btn sm" data-act="fg-clear">다시 놓기</button></div>
      <div class="ansline ${fg.state==='bad'?'shake':''}">${ans}</div><div class="pool">${pool}</div><p class="hint">필요 없는 블록이 2개 섞여 있어요.</p>
      ${fg.state==='good'?`<div class="reveal"><span>${s.item[0]}</span>${esc(s.item[1])}을(를) 만들었어요!</div>`:`<button class="btn gem" data-act="fg-check" ${fg.ans.length===s.tokens.length?'':'disabled'}>문장 완성하기</button>`}</div>`; }
  return h;
}
function checkSentence(s){
  fg.busy=true;
  if(fg.ans.map(a=>a.t).join(' ')===s.en){ const first=Learn.finishSentence(s); tune([523,659,784,1047]); fg.state='good';
    toast(`${s.item[0]} ${esc(s.item[1])} 획득! ⭐+${first?30:10} 🪙+${first?5:2}`); Multi.say(`${s.item[0]} ${s.en}`); UI.render();
    setTimeout(()=>{ fg.busy=false; preparePool(s); if(UI.modal==='forge') UI.render(); },2200); }
  else { fg.state='bad'; Learn.miss(s.id); beep(180,.25,'sawtooth',.05); UI.render();
    setTimeout(()=>{ fg.busy=false; fg.state=''; fg.ans=[]; fg.pool.forEach(p=>p.used=false); if(UI.modal==='forge') UI.render(); },1000); }
}

function npcQuestCard(q,atNpc){
  const s=NpcQuests.state(q), prog=NpcQuests.prog(q), lock=NpcQuests.lockReason(q), N=NPCS[q.npc]; let st, btn='';
  if(s?.s==='claimed') st='✅ 완료';
  else if(s?.s==='on'){ st=`${prog}/${q.n}`; if(prog>=q.n) btn=atNpc?`<button class="btn gem sm" data-act="npc-claim" data-id="${q.id}">보상 받기</button>`:`<span class="stamp wait">${esc(N.name)}에게 가서 보상 받기</span>`; }
  else if(lock) st='🔒 '+lock;
  else { st='새 퀘스트!'; btn=atNpc?`<button class="btn leaf sm" data-act="npc-accept" data-id="${q.id}">퀘스트 받기</button>`:`<span class="stamp wait">${esc(N.name)}에게 가서 받기</span>`; }
  return `<div class="qcard ${s?.s==='claimed'?'claimed':''} ${lock&&!s?'lock':''}"><div class="q-head"><span class="tier">${TIER_NAMES[q.tier]}</span><span class="q-title">${esc(q.title)}</span><span class="q-date">${st}</span></div>
    <p class="q-note">${esc(q.desc)}</p>${s?.s==='on'?`<div class="bars"><div class="bar">진행<i><b style="width:${prog/q.n*100}%"></b></i></div></div>`:''}<p class="hint">보상: ${rewardText(q.reward)}</p>${btn}</div>`;
}

function quizBody(q){
  let h=`<div class="craft"><div class="craft-top"><span class="craft-ko">${esc(q.prompt)}</span>${q.type!=='choice'?`<button class="btn leaf sm" data-act="speak" data-t="${esc(q.answer)}">🔊 듣기</button>`:''}</div>`;
  if(q.type==='listen'){ // [4차] 듣고 단어 고르기 (글자는 보이지 않아요)
    h+=`<div class="choices">${q.options.map(o=>`<button class="wtile" data-act="qz-opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <p class="hint">🔊 듣기를 눌러 여러 번 들어 봐요.</p>`; setTimeout(()=>speak(q.answer),250); }
  else if(q.type==='choice') h+=`<div class="choices">${q.options.map(o=>`<button class="wtile" data-act="qz-opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  else if(q.type==='spell'||q.type==='order'){ // [4차] 알파벳 순서 맞추기도 같은 방식이에요
    h+='<div class="slots">'+[...q.answer].map((ch,i)=>{ if(!/[a-z]/i.test(ch)) return `<span class="slot fixed">${ch===' '?'':esc(ch)}</span>`; const ti=q.placed[i];
      return ti!=null?`<button class="slot filled" data-act="qz-unslot" data-i="${i}">${q.tiles[ti].l}</button>`:'<span class="slot"></span>'; }).join('')+'</div>';
    h+='<div class="tray">'+q.tiles.map((t,i)=>t.used?'':`<button class="tile" data-act="qz-tile" data-i="${i}">${t.l}</button>`).join('')+`</div><p class="hint">${q.type==='order'?'알파벳을 순서대로 놓아요.':'필요 없는 알파벳이 2개 섞여 있어요.'}${q.hint?'<br>💡 '+esc(q.hint):''}</p>`;
  } else {
    h+=`<div class="ansline">${q.ans.map((a,i)=>`<button class="wtile" data-act="qz-unans" data-i="${i}">${esc(a.t)}</button>`).join('')||'<span class="ph">블록을 순서대로 눌러요</span>'}</div>
      <div class="pool">${q.pool.map((t,i)=>t.used?'':`<button class="wtile" data-act="qz-pick" data-i="${i}">${esc(t.t)}</button>`).join('')}</div>
      <button class="btn gem" data-act="qz-check" ${q.ans.length===q.len?'':'disabled'}>문장 완성하기</button>`;
  }
  return h+'</div>';
}
function renderQuiz(){ const z=UI.qz; if(!z) return head('문제','');
  return head(z.opts.title,z.opts.sub)+(z.res?`<p class="result ${z.res.ok?'ok':'no'}">${z.res.ok?'⭕ 정답이에요!':`❌ 아쉬워요. 정답은 <b class="en">${esc(z.q.answer)}</b>`}</p>`:quizBody(z.q)); }
function curQuiz(){ return UI.modal==='quiz'?UI.qz?.q:UI.modal==='battle'?UI.bt.q:UI.modal==='raid'?UI.rb.q:null; }
async function answerQuiz(ok){
  if(UI.modal==='quiz'){ const z=UI.qz; if(z.busy) return; z.busy=true; z.res={ok}; if(ok){ tune([659,880]); Bus.emit('learn',{kind:'quiz'}); } else { beep(180,.25,'sawtooth',.05); Learn.miss(z.q.id); }
    UI.render(); setTimeout(()=>{ UI.close(); z.opts.onDone?.(ok); },ok?700:1600); return; }
  if(UI.modal==='raid'){ const b=UI.rb; if(b.busy) return; b.busy=true; const r=Raid.quizAttack(b.type,b.q,ok); if(ok) tune([700,900]); else beep(180,.25,'sawtooth',.05);
    b.msg=r.msg+(ok?'':` 정답: ${b.q.answer}`); b.bad=!!r.bad; b.phase='choose'; b.q=null; b.busy=false; UI.render(); UI.raidHud(); return; } // [3차]
  if(UI.modal==='battle'){ const b=UI.bt; if(b.busy) return; b.busy=true; const r=await Dungeon.attack(b.type,b.q,ok);
    b.msg=r.msg+(ok?'':` 정답: ${b.q.answer}`); b.bad=!!r.bad; b.phase='choose'; b.q=null; b.busy=false; if(UI.modal==='battle') UI.render(); UI.dungeonHud(); }
}
function quizAct(d){
  const q=curQuiz(); if(!q) return;
  if(d.act==='qz-opt') return answerQuiz(d.v===q.answer);
  if(d.act==='qz-tile'){ const chars=[...q.answer]; const i=chars.findIndex((ch,j)=>/[a-z]/i.test(ch)&&q.placed[j]==null); if(i<0) return;
    q.placed[i]=+d.i; q.tiles[+d.i].used=true; beep(700,.04,'triangle',.05);
    if(chars.every((ch,j)=>!/[a-z]/i.test(ch)||q.placed[j]!=null)){ const ok=chars.every((ch,j)=>!/[a-z]/i.test(ch)||q.tiles[q.placed[j]].l===ch.toLowerCase()); return answerQuiz(ok); }
    return UI.render(); }
  if(d.act==='qz-unslot'){ const ti=q.placed[+d.i]; if(ti!=null){ q.tiles[ti].used=false; q.placed[+d.i]=null; } return UI.render(); }
  if(d.act==='qz-pick'){ q.pool[+d.i].used=true; q.ans.push({t:q.pool[+d.i].t,from:+d.i}); return UI.render(); }
  if(d.act==='qz-unans'){ const a=q.ans.splice(+d.i,1)[0]; q.pool[a.from].used=false; return UI.render(); }
  if(d.act==='qz-check') return answerQuiz(q.ans.map(a=>a.t).join(' ')===q.answer);
}

  const D=Dungeon, r=D.room, b=UI.bt, tg=D.target();

      <p class="hint">${FB.mode==='offline'?'지금은 체험 모드예요.':'관리자 확인: 통과'}</p><button class="btn" data-act="logout">로그아웃</button>`;
  return h;
}

panelEl.addEventListener('click',e=>{

  switch(d.act){
    case 'close': UI.close(); break;
    case 'speak': speak(d.t); break;

    case 'wb-unslot': if(!wb.busy){ wb.placed[+d.i]=null; UI.render(); } break;
    case 'wb-letter': { if(wb.busy) break; const w=WORDS[wb.sel], chars=[...w.en]; const i=chars.findIndex((ch,j)=>/[a-z]/i.test(ch)&&!wb.placed[j]); if(i<0) break;
      wb.placed[i]=d.l; beep(700,.04,'triangle',.05); UI.render(); if(chars.every((ch,j)=>!/[a-z]/i.test(ch)||wb.placed[j])) checkWord(w); break; }
    case 'fg-lesson': fg.lesson=+d.n; fg.sel=null; UI.render(); break;
    case 'fg-sent': { if(fg.busy) break; const s=SENTS[d.id]; if(!s.keyIds.every(k=>GS.inv.words[k])){ toast('🔒 먼저 단어 제작대에서 필요한 단어를 만들어요.'); break; } fg.sel=d.id; preparePool(s); UI.render(); break; }
    case 'fg-pick': if(fg.busy) break; fg.pool[+d.i].used=true; fg.ans.push({t:fg.pool[+d.i].t,from:+d.i}); beep(620,.04,'triangle',.05); UI.render(); break;
    case 'fg-unans': { if(fg.busy) break; const a=fg.ans.splice(+d.i,1)[0]; fg.pool[a.from].used=false; UI.render(); break; }

    case 'dg-out': UI.close(); clearTimeout(Dungeon.leaveT); Dungeon.leave('clear'); break;
    case 'adm-tab': adm.tab=d.k; UI.render(); break;
    case 'q-create': { const L=+$('#q-lesson').value, maxW=L?LES[L].words.length:TOTAL_WORDS, maxS=L?4:TOTAL_SENTS;
      const nW=Math.min(maxW,Math.max(0,+$('#q-w').value||0)), nS=Math.min(maxS,Math.max(0,+$('#q-s').value||0));

    case 'sub-all': { const up={}; pendingSubs().forEach(s=>{ up[`${s.qid}/${s.uid}/status`]='approved'; up[`${s.qid}/${s.uid}/doneAt`]=FB.now(); }); FB.update('submissions',up); break; }

      ['profiles','inventory','craftlog','builds'].forEach(p=>FB.remove(`${p}/${k}`)); const idx=Build.plotOwner[k]; if(idx!==undefined) FB.remove('plots/'+idx);
      for(const qid in GS.subs) if(GS.subs[qid][k]) FB.remove(`submissions/${qid}/${k}`); } break;
    case 'ev-start': EventSys.start(d.k); break;
    case 'ev-reroll': { const nx=EventSys.next; FB.set('events/next',{type:pick(EVENT_KEYS.filter(k=>k!==nx?.type)),at:nx?.at||FB.now()+5*60e3}); break; }
    case 'ev-win': FB.update('events/current',{state:'success',endedAt:FB.now(),cooldownUntil:FB.now()+68e3}); break;

    case 'n-clear': FB.remove('notice'); toast('공지를 내렸어요.'); break;
    case 'logout': FB.logout(); break;
    // [2차]
    case 'bd-tab': bd.tab=d.k; UI.render(); break;
    case 'tut-skip': if(confirm('튜토리얼을 건너뛸까요? 다시 켤 수 없어요.')){ Tutorial.skip(); UI.render(); } break;
    case 'tut-report': Tutorial.report(); UI.render(); break;
    case 'npc-accept': NpcQuests.accept(NPC_QUESTS.find(q=>q.id===d.id)); UI.render(); break;
    case 'npc-claim': NpcQuests.claim(NPC_QUESTS.find(q=>q.id===d.id)); UI.render(); break;

    case 'attend-claim': Attendance.claim(); break;
    case 'shop-tab': Shop.tab=d.k; UI.render(); break;
    case 'shop-buy': Shop.buy(SHOP_LIST[+d.i]); break;
    case 'craft-make': Craft.make(RECIPES[+d.i]); break;

    case 'unequip': Equip.unequip(d.k); UI.render(); break;
    case 'pet-rest': Equip.unequip('pet'); UI.render(); break;
  }
});

function loginMsg(t,err=false){ const m=$('#login-msg'); m.innerHTML=t; m.classList.toggle('err',err); }
function authErr(e){ const c=e?.code||'';
  if(c.includes('operation-not-allowed')) return 'Firebase 콘솔 Authentication에서 "이메일/비밀번호" 로그인을 켜 주세요.';
  if(c.includes('network')) return '인터넷 연결을 확인해 주세요.';
  if(c.includes('too-many-requests')) return '너무 여러 번 시도했어요. 잠시 뒤에 다시 해 주세요.';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')) return '이메일이나 비밀번호가 달라요.';
  if(c.includes('invalid-email')) return '이메일 모양이 올바르지 않아요.';
  return '들어가지 못했어요: '+esc(e?.message||c); }
async function migrateLegacy(name){
  // 예전 버전(students/{이름})의 기록을 한 번만 옮겨 와요.
  const key=name.trim().replace(/[.#$\[\]\/]/g,'_');
  const old=await FB.get('students/'+key).catch(()=>null); if(!old) return null;
  const crafts=await FB.get('crafts/'+key).catch(()=>null); if(crafts) FB.set('craftlog/'+GS.me.uid,crafts).catch(()=>{});
  toast('📦 예전 기록을 찾아서 옮겨 왔어요!',3500);
  return {inv:{letters:old.letters||{},words:old.words||{},sentences:old.sentences||{},mistakes:old.mistakes||{},rewarded:old.rewarded||{}},score:old.score||0};
}
async function enterStudent(name,pin){
  loginMsg('내 계정을 확인하고 있어요…');
  try{ await FB.loginStudent(name,pin); }
  catch(e){ loginMsg(e.message==='PIN'?'비밀 숫자가 달라요. 처음 정한 4자리 숫자를 적어 주세요. 잊어버렸다면 촌장님께 말씀드려요.':authErr(e),true); return; }
  GS.me={uid:FB.uid,name,color:chosenColor,role:'student'};
  try{
    const [inv,prof]=await Promise.all([FB.get('inventory/'+FB.uid),FB.get('profiles/'+FB.uid)]);
    let score=prof?.score||0, data=inv;
    if(!inv){ const m=await migrateLegacy(name); if(m){ data=m.inv; score=Math.max(score,m.score); } }
    GS.load(data); GS.score=score;
    // [3차] 다른 친구에게는 별명만, 실명은 선생님만 볼 수 있는 inventory에 둬요
    GS.inv.realName=name; if(!GS.inv.nick) GS.inv.nick=Social.genNick(hashStr(FB.uid)); GS.me.name=GS.inv.nick; GS.me.realName=name;
    GS._dirty=true; GS.flush(true);
  }catch(e){ console.error(e); loginMsg('기록을 불러오지 못했어요. 보안 규칙을 확인해 주세요.',true); return; }
  localStorage.setItem('e5_name',name); localStorage.setItem('e5_color',chosenColor); start();
}
async function enterChief(email,pw){
  loginMsg('선생님 계정을 확인하고 있어요…');

  if(!FB.isAdmin){ loginMsg(`로그인은 됐지만 아직 촌장님으로 등록되지 않았어요.<br>Firebase 콘솔 → Realtime Database → <b>english5/admins</b> 아래에 이 UID를 키로, 값을 <b>true</b>로 넣은 뒤 다시 들어와 주세요.<br><span class="code">${esc(FB.uid)}</span>`,true); return; }
  GS.me={uid:FB.uid,name:'촌장님',color:'#ffc93c',role:'chief'}; GS.load({}); start();
}
function subscribeAll(){
  FB.on('quests',v=>{ GS.quests=v||{}; UI.refresh(); });
  FB.on('submissions',v=>{ GS.subs=v||{}; checkQuestRewards(); UI.refresh(); });
  FB.on('profiles',v=>{ GS.profiles=v||{}; Build.refreshSigns(); UI.refresh(); });
  FB.on('notice',v=>{ GS.notice=v; const el=$('#notice'); if(v&&v.text){ el.textContent='📢 '+v.text; el.classList.remove('hidden'); } else el.classList.add('hidden'); });
  if(GS.isStudent()) FB.on('craftlog/'+GS.me.uid,v=>{ GS.crafts=v||{}; UI.refresh(); });
  if(FB.isAdmin&&GS.me.role==='chief'){ FB.on('inventory',v=>{ GS.allInv=v||{}; UI.refreshAdmin(); }); FB.on('reports',v=>{ const n=Object.keys(v||{}).length; if(n>Object.keys(GS.reports||{}).length&&GS.reports) toast('🚩 새 신고가 들어왔어요.'); GS.reports=v||{}; UI.refreshAdmin(); }); }
  if(FB.mode==='online') FB.on('players',v=>Multi.onPlayers(v));
  EventSys.init(); Dungeon.init(); Build.init();
}

  // [3차] 소셜·파티·레이드·코스

  if(FB.isAdmin) setTimeout(()=>Studio.purgeOld(),8000);
  if(GS.isStudent()) setTimeout(()=>Maps.claimFans(),5000);
  if(FB.mode==='online'){ FB.onDisconnectRemove('players/'+GS.me.uid); Multi.send(performance.now(),true); }
  $('#login').classList.add('hidden'); $('#hud').classList.remove('hidden'); GS.started=true; UI.hud();
  if(GS.isStudent()&&GS.score===0) UI.open('help');

  if(FB.mode==='offline') toast('체험 모드예요. 기록은 이 기기에만 저장되고 친구는 보이지 않아요.',5000);
}

const clock=new THREE.Clock(), camTarget=new THREE.Vector3(), camWant=new THREE.Vector3(); let lastHud=0, lastHud2=0;
function tick(){ requestAnimationFrame(tick); try{ tickBody(); }catch(e){ Guard.report(e); } } // [4차] 오류가 나도 게임이 멈추지 않아요
function tickBody(){
  const dt=Math.min(clock.getDelta(),.05), now=performance.now();
  if(GS.started&&player){
    updatePlayer(dt); Multi.update(dt); Multi.send(now);
    Build.update(now);
    if(Maps.mode){ Maps.update(dt,now); $('#act').textContent=Maps.mode==='edit'?(Maps.erase?'🧹':'🔨'):'🏁'; } // [3차]
    else if(!Build.mode){ Interact.update(); const n=Interact.near;
      if(UI.modal) UI.prompt(null);
      else if(n){ UI.prompt(`<kbd>E</kbd> ${n.label()}`); $('#act').textContent=n.icon||'✋'; }
      else if(Dungeon.inside){ UI.prompt('<kbd>E</kbd> ⚔️ 공격 문제 풀기'); $('#act').textContent='⚔️'; }
      else { UI.prompt(null); $('#act').textContent='⛏️'; } }
    else $('#act').textContent=Build.demolish?'🧹':'🔨';
    camTarget.set(pos.x,pos.y+2.2,pos.z); const cp=Math.cos(camPitch);
    camWant.set(camTarget.x+Math.sin(camYaw)*cp*camDist,Math.max(.6,camTarget.y+Math.sin(camPitch)*camDist),camTarget.z+Math.cos(camYaw)*cp*camDist);
    camera.position.lerp(camWant,1-Math.exp(-dt*10)); camera.lookAt(camTarget);
    sun.position.set(pos.x+40,70,pos.z+25); sun.target.position.set(pos.x,0,pos.z);
    EventSys.drive(); EventSys.updateVisuals(dt,now); Dungeon.update(dt,now); Pets.update(dt,now); Npc.update(dt,now); Raid.update(dt,now); Raid.tick(now); Party.tick(now); Season.update(dt); GS.flush();
    if(now-lastHud2>3000){ lastHud2=now; UI.hud(); if(GS.isStudent()){ Daily.ensure(); if(Attendance.pending&&!UI.modal){ Attendance.pending=false; if(!Attendance.claimedToday()) UI.open('attend'); } } }
    if(now-lastHud>500){ lastHud=now; UI.eventHud(); UI.dungeonHud(); UI.locHud(); UI.partyHud(); UI.raidHud(); UI.visitBar(); UI.socialBadge(); Social.showQueued(); UI.seasonHud(); UI.netHud(); UI.classHud(); if(FB.isAdmin) Session.tick(); if(UI.modal==='admin'&&['event','dungeon'].includes(adm.tab)) UI.render(); }
  } else { const t=now/9000; camera.position.set(Math.sin(t)*38,22,Math.cos(t)*38); camera.lookAt(0,0,0); }
  if(!Dungeon.inside) for(const o of ores){
    if(!o.active){ if(now>o.respawn){ o.active=true; o.hp=Growth.pickHits(); o.g.visible=true; setOreLetter(o,pickLetter(o.lesson)); } continue; }
    o.spr.position.y=2.6+Math.sin(now/450+o.phase)*.13; o.gem.rotation.y+=dt*1.2;
    if(o.shake>0){ o.shake-=dt; o.rock.position.x=Math.sin(now/20)*.12; } else o.rock.position.x=0; }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.v.y-=15*dt; p.m.position.addScaledVector(p.v,dt); p.life-=dt; if(p.life<=0){ scene.remove(p.m); parts.splice(i,1); } }
  FIRES.forEach((f,i)=>{ const s=1+Math.sin(now/120+i)*.12; f.scale.set(s,s,s); });
  if(PORTAL.swirl){ PORTAL.swirl.rotation.z+=dt*1.5; PORTAL.swirl.material.opacity=.6+Math.sin(now/300)*.15; }
  renderer.render(scene,camera);
}

panelEl.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t) return; const d=t.dataset;
  switch(d.act){
    case 's-tab': soc.tab=d.k; UI.render(); break;
    case 's-add': Social.addByCode($('#s-code').value); break;
    case 's-req': Social.request(d.u); break;
    case 's-acc': Social.accept(d.u); break;
    case 's-rej': Social.reject(d.u); break;
    case 's-unf': if(confirm('친구를 끊을까요?')){ Social.unfriend(d.u); UI.close(); } break;
    case 's-block': if(confirm('이 친구를 차단할까요? 말풍선·초대·코스가 보이지 않아요.')){ Social.block(d.u); UI.render(); } break;
    case 's-unblock': Social.unblock(d.u); UI.render(); break;
    case 's-call': Social.inviteHere(d.u); break;
    case 's-pinv': Party.invite(d.u); break;
    case 's-visit': Social.visit(d.u); break;
    case 's-prof': UI.open('profile',{uid:d.u}); break;
    case 's-go': { const n=UI.arg?.n; UI.close(); if(n) Social.goTo(n); break; }
    case 's-nick': Social.setNick(soc.nickOpts[+d.i]); soc.nickOpts=null; UI.render(); break;
    case 's-reroll': soc.nickOpts=Social.nickOptions(); UI.render(); break;
    case 's-vis': Social.setVisit(d.k); UI.render(); break;
    case 's-stk': Social.sticker(d.u,+d.i); UI.arg.loaded=false; UI.render(); break;
    case 's-report': UI.open('report',d.type==='map'?{type:'map',target:d.id,name:Maps.idx[d.id]?.title}
      :d.type==='sticker'?{type:'sticker',target:d.k,owner:d.u,name:'방명록 스티커'}:{type:d.type||'player',target:d.u,name:Social.nameOf(d.u)}); break;
    case 's-rep': { const a=UI.arg; Social.report(a.type,a.target,a.name,+d.i,a.owner?{owner:a.owner}:null); UI.close(); break; }
    case 'p-create': await Party.create(); UI.render(); break;
    case 'p-join': { const pid=d.p; UI.close(); await Party.join(pid); break; }
    case 'p-dec': Party.decline(d.p); if(UI.modal==='invite') UI.close(); else UI.render(); break;
    case 'p-lead': Party.delegate(d.u); break;
    case 'p-kick': if(confirm('이 친구를 파티에서 내보낼까요?')) Party.kick(d.u); break;
    case 'p-quest': Party.setQuest(d.k); break;
    case 'p-dungeon': UI.close(); Party.startDungeon(); break;
    case 'p-ping': Party.ping(); UI.close(); break;
    case 'p-leave': if(confirm('파티에서 나갈까요?')) Party.leave(); break;
    case 'p-disband': Party.disband(); break;
    case 'r-atk': UI.rb.type=d.k; UI.rb.q=Quiz.make(d.k,pick(LESSONS).n); UI.rb.phase='quiz'; UI.rb.msg=''; UI.render(); break;
    case 'r-gauge': Raid.gaugeAttack(); UI.render(); break;
    case 'emo': Multi.emote(d.e); UI.close(); break;
    case 'rk-tab': rk.tab=d.k; UI.render(); break;
    case 'm-tab': mp.tab=d.k; UI.render(); break;
    case 'm-search': mp.q=$('#m-q').value; mp.l=+$('#m-l').value; UI.render(); break;
    case 'm-play': Maps.open(d.id,'play'); break;
    case 'm-new': Maps.create(); break;
    case 'm-edit': Maps.open(d.id,'edit'); break;
    case 'm-test': Maps.open(d.id,'play'); break;
    case 'm-pub': await Maps.setPublic(d.id,d.v==='1'); break;
    case 'm-sel': mp.sel=mp.sel===d.id?null:d.id; UI.render(); break;
    case 'm-save': Maps.saveMeta(d.id,{title:$('#mf-t').value,desc:$('#mf-d').value,diff:$('#mf-diff').value,lesson:$('#mf-l').value}); break;
    case 'm-del': Maps.remove(d.id); break;
    case 'm-again': UI.close(); Maps.replay(); break;
    case 'm-out': UI.close(); Maps.exit(); break;
    // 선생님
    case 'a-raid-start': Raid.start('chief'); break;
    case 'a-raid-stop': if(confirm('레이드를 끝낼까요? 참여한 학생은 참여 보상을 받아요.')) Raid.stop(); break;
    case 'a-map-hide': { const v=d.v==='1'; FB.update('userMaps/'+d.id,{hidden:v,...(v?{public:false}:{})}); FB.update('mapIndex/'+d.id,{hidden:v,...(v?{public:false}:{})}); toast(v?'🙈 코스를 숨겼어요.':'코스 숨김을 풀었어요.'); break; }
    case 'a-map-del': if(confirm('이 코스를 지울까요?')){ await FB.remove('mapPlays/'+d.id); await FB.remove('mapIndex/'+d.id); await FB.remove('userMaps/'+d.id); } break;
    case 'a-rep-done': FB.remove('reports/'+d.id); break;
  }
});

Object.assign(UI,{
  seasonHud(){
    const el=$('#season-hud'), c=Season.active(), P=Season.preset();
    if(!c||!P){ el.classList.add('hidden'); this._sh=''; return; } el.classList.remove('hidden');
    const step=Season.passStep(), next=SEASON_PASS[step], pts=Season.pts();
    const pct=next?Math.min(100,(pts-(SEASON_PASS[step-1]?.pts||0))/(next.pts-(SEASON_PASS[step-1]?.pts||0))*100):100;
    const d=Math.ceil(Season.left()/864e5);

      <i class="sbar"><b style="width:${pct}%"></b></i></span></button>`;

  },
  netHud(){
    const el=$('#net-hud'); if(!GS.started){ el.classList.add('hidden'); return; } el.classList.remove('hidden');

    else if(Net.saving){ t='💾 저장 중…'; }

function renderSeason(){
  const c=Season.cur, A=Season.active(), P=Season.preset();
  if(!c||!P) return head('🎪 시즌','')+'<p class="empty">지금은 진행 중인 시즌이 없어요. 선생님이 새 시즌을 열면 알려 드릴게요!</p>';
  let h=head(`${P.emoji} ${esc(c.title||P.title)}`,esc(c.note||P.intro));
  h+=`<p class="p-sub">${A?`남은 기간 ${Math.ceil(Season.left()/864e5)}일`:'시즌이 끝났어요. 그동안 모은 아이템과 건축물은 그대로 남아 있어요!'}</p>`;
  if(Studio.pub.notice) h+=`<div class="quest today"><span class="q-title">📢 ${esc(Studio.pub.notice.title)}</span><p class="q-note">${esc(Studio.pub.notice.body||'')}</p></div>`;
  if(!GS.isStudent()) return h+'<p class="hint">촌장님은 집무실 → 시즌 탭에서 시즌을 열고 닫을 수 있어요.</p>';
  const pts=Season.pts();
  h+=`<h3>🎁 시즌 보상 트랙 <small>(활동으로만 쌓여요 · 지금 ${pts}점)</small></h3><div class="pass">`;
  SEASON_PASS.forEach((s,i)=>{ const got=!!GS.inv.claims[`season:${c.seasonId}:${i}`], reach=pts>=s.pts;
    h+=`<div class="pstep ${got?'got':reach?'ready':''}"><b>${s.pts}점</b><span>${esc(s.name)}</span><small>${rewardText(s.reward)}</small><i>${got?'✅ 받았어요':reach?'…지급 중':'🔒'}</i></div>`; });
  h+='</div>';
  h+='<h3>📋 시즌 과제</h3>'+(Season.quests().map(q=>{ const p=Season.questProg(q), done=Season.questDone(q);
    return `<div class="quest ${done?'':'today'}"><div class="q-head"><span class="q-title">${esc(q.text)}</span><span class="q-date">${done?'✅ 완료':`+${q.pts}점`}</span></div>
      <div class="bars"><div class="bar">${Math.min(p,q.n)}/${q.n}<i><b style="width:${Math.min(100,p/q.n*100)}%"></b></i></div></div></div>`; }).join('')||'<p class="empty">이번 시즌 과제가 없어요.</p>');
  const tips=Analytics.myTips();
  if(tips.length) h+='<h3>🌱 다음에 해 볼 활동</h3><div class="tips">'+tips.map(t=>`<div class="tip"><span>${t.e}</span><p>${t.t}</p></div>`).join('')+'</div>';
  return h+'<p class="hint">시즌이 끝나도 얻은 아이템·건축물·친구는 그대로예요. 시즌 점수만 새로 시작해요.</p>';
}

function drawDonut(id,pct,color){
  const c=document.getElementById(id); if(!c) return; const x=c.getContext('2d'), R=48, cx=60, cy=60;
  x.clearRect(0,0,120,120); x.lineWidth=16; x.strokeStyle='rgba(255,255,255,.18)';
  x.beginPath(); x.arc(cx,cy,R,0,Math.PI*2); x.stroke();
  x.strokeStyle=color; x.lineCap='round'; x.beginPath(); x.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(0,Math.min(1,pct/100))); x.stroke();
  x.fillStyle='#fff'; x.font='700 24px Jua, sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(pct+'%',cx,cy);
}

panelEl.addEventListener('click',async e=>{

      const P=SEASONS[sn4.preset], days=Math.max(1,Math.min(120,+$('#sn-days').value||14)), note=$('#sn-note').value.slice(0,60), now=FB.now();
      if(Season.cur) await FB.set('season/archive/'+Season.cur.seasonId,{...Season.cur,status:'ended',archivedAt:now}).catch(()=>{});
      await FB.set('season/current',{seasonId:'s'+now.toString(36),title:P.title,theme:P.key,startAt:now,endAt:now+days*864e5,status:'active',note,by:GS.me.uid});

    case 'sn-end': if(confirm('시즌을 끝낼까요? 학생의 아이템과 건축물은 그대로 남아요.')){ await FB.update('season/current',{status:'ended',endAt:FB.now()}); } break;
    // 콘텐츠 스튜디오
    case 'st-type': st4.type=d.k; st4.sel=null; UI.render(); break;
    case 'st-new': { const id=await Studio.create(st4.type); st4.sel=id||null; UI.render(); break; }
    case 'st-sel': st4.sel=st4.sel===d.id?null:d.id; UI.render(); break;
    case 'st-save': {
      const it=Studio.items[d.id]; if(!it) break; const g=i=>document.getElementById(i), v=i=>g(i)?g(i).value:undefined;
      const title=(v('sf-title')||it.title).slice(0,30); let data={};
      if(it.type==='quiz') data={qtype:v('sf-qtype'),lesson:+v('sf-lesson'),diff:+v('sf-diff'),prompt:v('sf-prompt').slice(0,60),answer:v('sf-answer').slice(0,80),wrong:v('sf-wrong').slice(0,80),hint:v('sf-hint').slice(0,40),reward:{exp:+v('sf-exp')||0,coins:+v('sf-coins')||0}};
      else if(it.type==='quest') data={desc:v('sf-desc').slice(0,60),stat:v('sf-stat'),n:Math.max(1,+v('sf-n')||1),period:v('sf-period'),reward:{exp:+v('sf-exp')||0,coins:+v('sf-coins')||0}};
      else if(it.type==='npc') data={npc:v('sf-npc'),lines:v('sf-lines').slice(0,400)};
      else if(it.type==='event') data={type:v('sf-etype'),goalMul:+v('sf-goal')||1,rewardMul:+v('sf-rew')||1,note:v('sf-note').slice(0,60)};
      else if(it.type==='raid') data={name:v('sf-name').slice(0,20),hpMul:+v('sf-hp')||1,rewardMul:+v('sf-rew')||1};
      else data={body:v('sf-body').slice(0,300)};
      Studio.items[d.id]={...it,title,data}; await Studio.save(d.id,{title,data}); toast('💾 저장했어요. 학생에게 보이려면 🌍 게시하기를 눌러요.'); break; }
    case 'st-pub': {
      const it=Studio.items[d.id];
      if(d.v==='published'&&it?.type==='quiz'&&!String(it.data?.answer||'').trim()){ toast('정답을 먼저 적어 주세요.'); break; }
      Studio.setStatus(d.id,d.v); toast(d.v==='published'?'🌍 학생에게 공개했어요.':'초안으로 내렸어요.'); break; }
    case 'st-arch': Studio.setStatus(d.id,'archived'); break;
    case 'st-trash': if(confirm('휴지통으로 보낼까요? 30일 안에 되살릴 수 있어요.')) Studio.trash(d.id); break;
    case 'st-restore': Studio.restore(d.id); toast('되살렸어요. 초안 상태로 돌아왔어요.'); break;
    case 'st-purge': if(confirm('완전히 지울까요? 되돌릴 수 없어요.')) Studio.purge(d.id); break;
    case 'st-try': { const it=Studio.items[d.id]; if(!it) break;
      UI.openQuiz(Studio.buildQ({id:d.id,...it.data}),{title:'🧪 테스트 플레이',sub:'학생에게 보이는 그대로예요. (보상은 지급되지 않아요)',noReward:true}); break; }
    case 'st-prev': { const it=Studio.items[d.id], dd=it?.data||{};
      toast(it.type==='npc'?`💬 ${NPCS[dd.npc]?.name||''}: “${esc(String(dd.lines||'').split('\n')[0]||'')}”`
        :it.type==='raid'?`👾 ${esc(dd.name||'')} · 체력 ×${dd.hpMul} · 보상 ×${dd.rewardMul}`
        :it.type==='quest'?`📜 ${esc(it.title)} — ${STAT_OPTIONS.find(s=>s[0]===dd.stat)?.[1]||''} ${dd.n}회`
        :it.type==='event'?`🎪 ${EVENT_TYPES[dd.type]?.name||''} · 목표 ×${dd.goalMul}`:`📢 ${esc(String(dd.body||'').slice(0,60))}`,5000); break; }
    // 분석·안전
    case 'an-st': an4.uid=d.u; UI.render(); break;
    case 'an-back': an4.uid=null; UI.render(); break;
    case 'sf-stat': Safety.setStatus(d.id,d.k); break;
    case 'sf-nick': Safety.askNick(d.u); break;
    case 'sf-ban': { const r=prompt('제한 이유를 짧게 적어 주세요 (학생에게 보여요)','친구와 사이좋게 지내기 위해 잠시 쉬어요'); if(r!==null) Safety.ban(d.u,+d.d||3,r); break; }
    case 'sf-unban': Safety.unban(d.u); break;
    case 'sf-sticker': Safety.removeSticker(d.u,d.k); break;
  }
});

      <span>단어 만들기</span><span>${r.words}번</span><span>문장 만들기</span><span>${r.sentences}번</span><span>문제 맞히기</span><span>${r.quiz}개</span></div>
