<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>알파벳 마을 - 5학년 영어 복습</title>
<!-- [4차] PWA: 홈 화면에 설치하고, 인터넷이 끊겨도 껍데기는 바로 열려요 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b5266">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="알파벳 마을">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --slate:#1d3a4a; --slate-d:#0f2430; --slate-l:#2b5266;
  --gem:#ffc93c; --gem-d:#c98b00; --gem-ink:#3b2500;
  --leaf:#3cc6b4; --leaf-d:#1e8f80; --leaf-ink:#05302a;
  --berry:#ff6b8b; --berry-d:#c2405e; --grape:#8a5cf6; --grape-d:#5b35b8;
  --ink:#fff8e6; --ink-soft:#b9d3df;
  --kr:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --en:'Fredoka','Jua','Arial Rounded MT Bold',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9ad8f5;color:var(--ink);font-family:var(--kr);-webkit-user-select:none;user-select:none;touch-action:none}
input,select{user-select:text;-webkit-user-select:text;font-family:var(--kr)}
.hidden{display:none!important}
.en{font-family:var(--en);font-weight:700}
#game{position:fixed;inset:0}
#game canvas{display:block}

.btn{font-family:var(--kr);font-size:17px;color:var(--ink);background:var(--slate);border:3px solid var(--slate-d);border-radius:14px;box-shadow:0 4px 0 var(--slate-d);padding:7px 14px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--slate-d)}
.btn:focus-visible,.card:focus-visible,.tile:focus-visible,.wtile:focus-visible,.bb:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.gem{background:var(--gem);color:var(--gem-ink);border-color:var(--gem-d);box-shadow:0 4px 0 var(--gem-d)}
.btn.leaf{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf-d);box-shadow:0 4px 0 var(--leaf-d)}
.btn.berry{background:var(--berry);color:#fff;border-color:var(--berry-d);box-shadow:0 4px 0 var(--berry-d)}
.btn.grape{background:var(--grape);color:#fff;border-color:var(--grape-d);box-shadow:0 4px 0 var(--grape-d)}
.btn.sm{font-size:15px;padding:4px 10px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* 로그인 */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;background:radial-gradient(circle at 50% 40%,rgba(15,36,48,.15),rgba(15,36,48,.55));padding:16px}
.login-box{background:var(--slate);border:4px solid var(--slate-d);box-shadow:0 8px 0 var(--slate-d);border-radius:26px;width:min(440px,100%);padding:24px 26px 20px;text-align:center;max-height:calc(100vh - 32px);overflow:auto}
.title-tiles{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.title-tiles span{font-family:var(--en);font-weight:700;font-size:40px;width:60px;height:68px;display:flex;align-items:center;justify-content:center;background:var(--gem);color:var(--gem-ink);border-radius:14px;box-shadow:0 6px 0 var(--gem-d);animation:drop .6s cubic-bezier(.3,1.6,.5,1) both}
.title-tiles span:nth-child(2){background:var(--leaf);color:var(--leaf-ink);box-shadow:0 6px 0 var(--leaf-d);animation-delay:.12s}
.title-tiles span:nth-child(3){background:var(--berry);color:#fff;box-shadow:0 6px 0 var(--berry-d);animation-delay:.24s}
@keyframes drop{from{transform:translateY(-120px) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.login-box h1{font-size:42px;margin:8px 0 4px;font-weight:400}
.login-box .sub{color:var(--ink-soft);margin:0 0 14px;font-size:16px;line-height:1.5}
.login-box label{display:block;text-align:left;font-size:16px;margin:10px 0 5px;color:var(--ink-soft)}
.login-box input{width:100%;font-size:21px;padding:9px 14px;border-radius:12px;border:3px solid var(--slate-d);background:var(--ink);color:var(--gem-ink)}
.row2{display:grid;grid-template-columns:1.6fr 1fr;gap:10px}
.swatches{display:flex;gap:10px;justify-content:center;margin:8px 0 16px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid var(--slate-d);cursor:pointer}
.swatches button.on{outline:4px solid #fff;outline-offset:2px}
.big{font-size:22px;padding:11px 20px;width:100%}
.linkbtn{background:none;border:none;color:var(--ink-soft);font-family:var(--kr);font-size:16px;margin-top:12px;cursor:pointer;text-decoration:underline}
#login-msg{min-height:20px;margin-top:10px;font-size:14px;color:var(--ink-soft);line-height:1.45}
#login-msg.err{color:var(--berry)}
.small-note{font-size:13px;color:var(--ink-soft);text-align:left;margin:6px 0 0;line-height:1.45}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud > *{pointer-events:auto}
#me-card{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;background:var(--slate);border:3px solid var(--slate-d);box-shadow:0 4px 0 var(--slate-d);border-radius:16px;padding:8px 14px;min-width:170px}
#me-name{font-size:19px}
#me-score{font-size:15px;color:var(--gem)}
#me-res{font-size:14px;color:var(--ink-soft);margin-top:2px}
#tracker{position:absolute;top:calc(168px + env(safe-area-inset-top,0px));left:12px;display:flex;flex-direction:column;gap:6px;max-width:260px}
.trk{background:rgba(29,58,74,.92);border:3px solid var(--slate-d);border-radius:12px;padding:6px 10px;font-size:15px;cursor:pointer;line-height:1.35}
.trk small{color:var(--gem);font-size:14px}
#hud-btns{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:52vw}
#center-top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,40vw);pointer-events:none}
#center-top > *{pointer-events:auto}
#notice{background:var(--gem);color:var(--gem-ink);border:3px solid var(--gem-d);border-radius:14px;padding:7px 16px;font-size:17px;text-align:center;box-shadow:0 4px 0 var(--gem-d);width:100%}
#ev-hud{background:var(--slate);border:3px solid var(--slate-d);border-radius:16px;box-shadow:0 4px 0 var(--slate-d);padding:8px 14px;width:100%}
#ev-hud.success{border-color:var(--leaf)} #ev-hud.fail{border-color:var(--berry)} #ev-hud.starting{border-color:var(--gem)}
.ev-top{display:flex;justify-content:space-between;gap:8px;font-size:18px}
.ev-top .t{font-family:var(--en);color:var(--gem)}
.ev-bar{height:14px;background:var(--slate-d);border-radius:7px;margin:6px 0 4px;overflow:hidden}
.ev-bar b{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--gem));border-radius:7px;transition:width .4s}
.ev-sub{font-size:14px;color:var(--ink-soft)}
#dg-hud{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));right:12px;background:#2a1d3f;border:3px solid #150d24;box-shadow:0 4px 0 #150d24;border-radius:16px;padding:10px 14px;width:250px}
#dg-hud .hp{height:14px;background:#150d24;border-radius:7px;overflow:hidden;margin:4px 0 8px}
#dg-hud .hp b{display:block;height:100%;background:var(--berry);border-radius:7px;transition:width .3s}
#dg-hud .row{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
#dg-hud .btns{display:flex;gap:6px;margin-top:8px}
#build-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:stretch;background:var(--slate);border:3px solid var(--slate-d);box-shadow:0 4px 0 var(--slate-d);border-radius:18px;padding:8px;max-width:96vw;overflow-x:auto}
.bb{font-family:var(--kr);background:var(--slate-l);border:3px solid var(--slate-d);color:var(--ink);border-radius:12px;padding:5px 8px;min-width:74px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto}
.bb .e{font-size:24px;line-height:1}
.bb .n{font-size:14px}
.bb .c{font-size:11px;color:var(--ink-soft);white-space:nowrap}
.bb.on{background:var(--gem);color:var(--gem-ink);border-color:var(--gem-d)} .bb.on .c{color:var(--gem-ink)}
.bb.poor{opacity:.5}
.bb.tool{background:var(--slate-d)}
.bb.tool.on{background:var(--berry);color:#fff;border-color:var(--berry-d)}
#prompt{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--slate);border:3px solid var(--slate-d);border-radius:16px;padding:9px 18px;font-size:19px;box-shadow:0 4px 0 var(--slate-d);pointer-events:none!important;white-space:nowrap}
#prompt kbd{font-family:var(--en);background:var(--gem);color:var(--gem-ink);border-radius:6px;padding:0 7px;margin-right:4px}
body.building #prompt{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
#minihelp{position:absolute;left:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:13px;color:#1d3a4a;background:rgba(255,255,255,.6);padding:4px 10px;border-radius:10px;pointer-events:none!important}
body.building #minihelp{display:none}
#hurt{position:fixed;inset:0;pointer-events:none!important;background:radial-gradient(circle,transparent 55%,rgba(255,40,60,.65));opacity:0;transition:opacity .35s;z-index:9}
#hurt.on{opacity:1;transition:none}
#joy{position:absolute;left:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(15,36,48,.35);border:3px solid rgba(255,255,255,.5);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--gem);box-shadow:0 4px 0 var(--gem-d)}
#act{position:absolute;right:26px;bottom:calc(40px + env(safe-area-inset-bottom,0px));width:88px;height:88px;border-radius:50%;font-size:30px;padding:0}
#jump{position:absolute;right:124px;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;font-size:24px;padding:0}
.touch-only{display:none}
@media (pointer:coarse){
  .touch-only{display:block} #minihelp{display:none}
  #prompt{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  #build-bar{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  body.building #prompt{bottom:calc(250px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:760px){ #center-top{top:auto;bottom:calc(200px + env(safe-area-inset-bottom,0px));width:88vw} #hud-btns{max-width:60vw} #hud-btns .btn{font-size:14px;padding:5px 9px} #dg-hud{top:auto;bottom:calc(160px + env(safe-area-inset-bottom,0px));width:210px} }

#toasts{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--slate);border:3px solid var(--slate-d);border-radius:14px;padding:8px 16px;font-size:17px;box-shadow:0 4px 0 var(--slate-d);animation:tin .25s ease-out;max-width:90vw;text-align:center}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.pop{position:fixed;z-index:30;font-family:var(--en);font-weight:700;font-size:28px;color:var(--gem-ink);background:var(--gem);border-radius:10px;padding:0 10px;box-shadow:0 4px 0 var(--gem-d);pointer-events:none;animation:popup 1.1s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
.pop.hit{background:var(--berry);color:#fff;box-shadow:0 4px 0 var(--berry-d);font-size:32px}
.pop.ev{background:var(--leaf);color:var(--leaf-ink);box-shadow:0 4px 0 var(--leaf-d);font-size:20px;font-family:var(--kr);font-weight:400}
@keyframes popup{to{transform:translate(-50%,-170%);opacity:0}}

/* 모달 */
#modal{position:fixed;inset:0;background:rgba(15,36,48,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal.open{display:flex}
.panel{background:var(--slate);border:4px solid var(--slate-d);box-shadow:0 8px 0 var(--slate-d);border-radius:24px;width:min(940px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:16px 20px 22px}
.panel.dark{background:#2a1d3f;border-color:#150d24;box-shadow:0 8px 0 #150d24}
.panel.dark .p-head{background:#2a1d3f}
.p-head{display:flex;align-items:center;gap:10px;position:sticky;top:-16px;background:var(--slate);padding:6px 0;z-index:2}
.p-head h2{margin:0;font-size:28px;font-weight:400;flex:1}
.x{background:var(--slate-l);border:3px solid var(--slate-d);color:var(--ink);font-size:20px;width:42px;height:42px;border-radius:12px;cursor:pointer}
.p-sub{margin:2px 0 12px;color:var(--ink-soft);font-size:16px;line-height:1.5;max-width:70ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.tab{font-family:var(--kr);font-size:17px;padding:6px 14px;border-radius:12px;border:3px solid var(--slate-d);background:var(--slate-l);color:var(--ink);cursor:pointer}
.tab.on{background:var(--gem);color:var(--gem-ink);border-color:var(--gem-d)}
.l-title{font-size:16px;color:var(--ink-soft);margin:0 0 10px}
.l-title .en{color:var(--ink)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.card{font-family:var(--kr);text-align:left;background:var(--slate-l);border:3px solid var(--slate-d);color:var(--ink);border-radius:14px;padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card .ko{font-size:17px;line-height:1.3}
.card .meta{font-size:13px;color:var(--ink-soft);line-height:1.4}
.card.done{border-color:var(--leaf-d);background:#24584f}
.card.sel{border-color:var(--gem);box-shadow:0 0 0 2px var(--gem)}
.card.locked{opacity:.65}
.scard{flex-direction:row;align-items:flex-start;gap:10px}
.scard .item{font-size:34px;line-height:1}
.scard-body{display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:13px;background:var(--slate-d);border-radius:8px;padding:2px 7px;color:var(--ink-soft)}
.chip.have{color:var(--leaf)}
.craft{margin-top:14px;background:var(--slate-d);border-radius:18px;padding:14px 16px}
.panel.dark .craft{background:#150d24}
.craft-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.craft-ko{font-size:24px;flex:1;min-width:180px}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 6px;min-height:60px;align-items:center}
.slot{width:46px;height:54px;border:3px dashed rgba(255,255,255,.35);border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--en);font-weight:700;font-size:30px;background:transparent;color:var(--gem-ink)}
.slot.fixed{border:none;width:auto;min-width:16px;color:var(--ink)}
.slot.filled{border:none;background:var(--gem);box-shadow:0 5px 0 var(--gem-d);cursor:pointer}
.slot.filled.wrong{background:var(--berry);box-shadow:0 5px 0 var(--berry-d);color:#fff;animation:shake .4s}
.slot.filled.good{background:var(--leaf);box-shadow:0 5px 0 var(--leaf-d);color:var(--leaf-ink)}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tile{position:relative;font-family:var(--en);font-weight:700;font-size:28px;width:50px;height:56px;border:none;border-radius:12px;background:var(--gem);color:var(--gem-ink);box-shadow:0 5px 0 var(--gem-d);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gem-d)}
.tile .cnt{position:absolute;top:-7px;right:-7px;font-size:12px;font-family:var(--kr);background:var(--slate-d);color:var(--ink);border-radius:9px;padding:1px 6px}
.tile.dim{opacity:.3}
.tray.big .tile{cursor:default}
.hint{font-size:14px;color:var(--ink-soft);margin:8px 0 0;line-height:1.5}
.empty{color:var(--ink-soft);font-size:16px;margin:6px 0}
.ansline{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;align-items:center;border-bottom:3px dashed rgba(255,255,255,.3);padding:12px 0;margin:6px 0 10px}
.ansline .ph{color:var(--ink-soft);font-size:16px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.wtile{font-family:var(--en);font-weight:500;font-size:22px;padding:8px 14px;border:none;border-radius:12px;background:var(--leaf);color:var(--leaf-ink);box-shadow:0 5px 0 var(--leaf-d);cursor:pointer}
.wtile.good{background:var(--gem);color:var(--gem-ink);box-shadow:0 5px 0 var(--gem-d)}
.wtile.bad{background:var(--berry);color:#fff;box-shadow:0 5px 0 var(--berry-d)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.choices .wtile{font-size:24px;padding:14px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.celebrate{animation:glow 1s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,201,60,.9)}100%{box-shadow:0 0 0 22px rgba(255,201,60,0)}}
.reveal{margin-top:12px;font-size:22px;display:flex;align-items:center;gap:10px}
.reveal span{font-size:54px;animation:drop .6s cubic-bezier(.3,1.6,.5,1)}
.craft .btn.gem{margin-top:8px}
.result{font-size:22px;margin-top:12px}
.result.ok{color:var(--leaf)} .result.no{color:var(--berry)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
h3{font-weight:400;font-size:19px;margin:16px 0 8px}
h3 small{color:var(--gem);font-size:15px;margin-left:6px}
.wchip{font-family:var(--kr);font-size:14px;background:var(--leaf);color:var(--leaf-ink);border:none;border-radius:10px;padding:5px 10px;box-shadow:0 3px 0 var(--leaf-d);cursor:pointer}
.wchip .en{font-size:16px}
.wchip.lock{background:var(--slate-l);color:var(--ink-soft);box-shadow:none;cursor:default}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.icard{background:var(--slate-l);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:3px;position:relative;border:3px solid var(--slate-d)}
.icard .item{font-size:40px}
.icard small{color:var(--ink-soft);font-size:13px;line-height:1.35}
.icard em{position:absolute;top:8px;right:10px;font-style:normal;color:var(--gem)}
.icard.lock .item{filter:grayscale(1);opacity:.5}
.quest{background:var(--slate-l);border:3px solid var(--slate-d);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.quest.today{border-color:var(--gem)}
.q-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q-date{color:var(--gem);font-size:15px}
.q-title{font-size:20px}
.q-note{color:var(--ink-soft);font-size:15px;margin:4px 0 0}
.bars{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 8px}
.bar{flex:1;min-width:160px;font-size:14px}
.bar i{display:block;height:12px;border-radius:6px;background:var(--slate-d);margin-top:4px;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--leaf);border-radius:6px}
.stamp{display:inline-block;font-size:16px;padding:4px 10px;border-radius:10px}
.stamp.ok{background:#b3262e;color:#fff;transform:rotate(-4deg);border:2px dashed #ffd9dc}
.stamp.wait{background:var(--slate-d);color:var(--gem)}
.stamp.no{background:var(--berry);color:#fff}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-size:18px}
.rank-row:nth-child(odd){background:var(--slate-l)}
.rank-row.me{outline:3px solid var(--gem)}
.rank-row .n{width:34px;text-align:center}
.rank-row .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--slate-d)}
.rank-row .nm{flex:1}
.rank-row .sc{color:var(--gem)}

let audioCtx=null;
function beep(freq=660,dur=.08,type='square',vol=.05){
  if(typeof Perf!=='undefined'&&Perf&&!Perf.sfx) return; // [4차] 효과음 설정
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=type;o.frequency.value=freq; g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur); o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}
}
const tune=notes=>notes.forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.07),i*90));
function speak(t){
  try{ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.9; const vs=speechSynthesis.getVoices();
    const v=vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>v.lang.startsWith('en')); if(v)u.voice=v; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){}
}
function toast(html,ms=2600){ const d=document.createElement('div'); d.className='toast'; d.innerHTML=html; $('#toasts').appendChild(d);
  while($('#toasts').children.length>4) $('#toasts').firstChild.remove(); setTimeout(()=>d.remove(),ms); }

   students/, crafts/           예전 버전 데이터 (읽기 전용, 첫 접속 때 옮겨 와요) */
const FB={
  mode:'offline', uid:null, isAdmin:false, api:null, _m:null, _auth:null, _offset:0,
  now(){ return Date.now()+this._offset; },
  serverTs(){ return this.mode==='online'?this._m.dbM.serverTimestamp():Date.now(); }, // [2차] 서버가 시각을 채워요
  async init(){
    if(!FIREBASE_CONFIG.apiKey||!FIREBASE_CONFIG.databaseURL){ this.api=makeLocalStore(); this.mode='offline'; return; }
    const V='10.12.2', base=`https://www.gstatic.com/firebasejs/${V}/`;
    const [appM,authM,dbM]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-database.js')]);
    const app=appM.initializeApp(FIREBASE_CONFIG); this._auth=authM.getAuth(app); this._m={authM,dbM};
    const db=dbM.getDatabase(app); const r=p=>dbM.ref(db,ROOT+(p?'/'+p:''));
    dbM.onValue(dbM.ref(db,'.info/serverTimeOffset'),s=>{ this._offset=s.val()||0; });
    const warn=(p,e)=>console.warn('[DB] 권한 또는 연결 문제:',p,e?.message||e);
    this.api={
      set:(p,v)=>dbM.set(r(p),v).catch(e=>{warn(p,e);throw e;}),
      update:(p,o)=>dbM.update(r(p),o).catch(e=>{warn(p,e);throw e;}),
      get:async p=>(await dbM.get(r(p))).val(),
      on:(p,cb,err)=>dbM.onValue(r(p),s=>cb(s.val()),e=>{ warn(p,e); err&&err(e); }), // [3차] 권한 거부를 알려 줘요
      remove:p=>dbM.remove(r(p)).catch(e=>warn(p,e)),
      inc:(p,n)=>dbM.set(r(p),dbM.increment(n)).catch(e=>warn(p,e)),
      push:(p,v)=>{ const k=dbM.push(r(p)); dbM.set(k,v).catch(e=>warn(p,e)); return k.key; },
      transaction:async(p,fn)=>{ const res=await dbM.runTransaction(r(p),fn,{applyLocally:true}); return {committed:res.committed,value:res.snapshot.val()}; },
      onConn:cb=>dbM.onValue(dbM.ref(db,'.info/connected'),s=>cb(!!s.val())), // [4차] 연결 상태
      onDisconnectRemove:p=>dbM.onDisconnect(r(p)).remove(),
      cancelDisconnect:p=>dbM.onDisconnect(r(p)).cancel()
    };
    this.mode='online';
  },
  set(p,v){return this.api.set(p,v);}, update(p,o){return this.api.update(p,o);}, get(p){return this.api.get(p);},
  on(p,cb,err){return this.api.on(p,cb,err);}, remove(p){return this.api.remove(p);}, inc(p,n){return this.api.inc(p,n);},
  push(p,v){return this.api.push(p,v);}, transaction(p,fn){return this.api.transaction(p,fn);},
  onDisconnectRemove(p){ return this.api.onDisconnectRemove?.(p); }, cancelDisconnect(p){ return this.api.cancelDisconnect?.(p); },

  // 학생: 이름으로 만든 가짜 이메일 + 비밀 숫자. 어느 기기에서든 같은 UID가 돼요.
  async loginStudent(name,pin){
    if(this.mode==='offline'){ this.uid='local-'+(await sha256hex(name)).slice(0,12); return {created:false}; }
    const {authM}=this._m, email=`s${(await sha256hex(name)).slice(0,24)}@${STUDENT_EMAIL_DOMAIN}`, pw=`${pin}#AV5-banwol`;
    try{ const c=await authM.createUserWithEmailAndPassword(this._auth,email,pw); this.uid=c.user.uid; return {created:true}; }
    catch(e){ if(e.code!=='auth/email-already-in-use') throw e; }
    try{ const c=await authM.signInWithEmailAndPassword(this._auth,email,pw); this.uid=c.user.uid; return {created:false}; }
    catch(e){ if(/wrong-password|invalid-credential|invalid-login/.test(e.code||'')) throw new Error('PIN'); throw e; }
  },
  // 선생님: 콘솔에서 만든 이메일 계정. 관리자인지는 admins/{uid}로 확인(최종 판단은 보안 규칙).
  async loginTeacher(email,pw){
    if(this.mode==='offline'){ this.uid='local-chief'; this.isAdmin=true; return; }
    const {authM}=this._m; const c=await authM.signInWithEmailAndPassword(this._auth,email,pw); this.uid=c.user.uid;
    this.isAdmin=(await this.get('admins/'+this.uid))===true;
  },
  async logout(){ if(this.mode==='online'){ try{ await this._m.authM.signOut(this._auth); }catch(e){} } location.reload(); }
};
function makeLocalStore(){
  let tree={}; try{ tree=JSON.parse(localStorage.getItem('english5_offline_v2')||'{}'); }catch(e){}
  delete tree.players; delete tree.dungeon;
  const subs=[]; const parts=p=>p?p.split('/').filter(Boolean):[]; const clone=v=>v==null?null:JSON.parse(JSON.stringify(v));
  const getAt=p=>{ let o=tree; for(const k of parts(p)){ if(o==null||typeof o!=='object') return null; o=o[k]; } return o===undefined?null:clone(o); };
  const setAt=(p,v)=>{ const ks=parts(p); if(!ks.length){tree=v||{};return;} let o=tree;
    for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; }
    if(v==null) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]]=clone(v); };
  let pend=false, saveT=null;
  const persist=()=>{ clearTimeout(saveT); saveT=setTimeout(()=>{ try{localStorage.setItem('english5_offline_v2',JSON.stringify(tree));}catch(e){} },300);
    if(pend) return; pend=true; setTimeout(()=>{ pend=false; subs.forEach(s=>s.cb(getAt(s.p))); },0); };
  return {
    onConn:cb=>cb(true), // [4차]
    set:async(p,v)=>{setAt(p,v);persist();}, update:async(p,o)=>{for(const k in o) setAt((p?p+'/':'')+k,o[k]); persist();},
    get:async p=>getAt(p), on:(p,cb)=>{const s={p,cb};subs.push(s);setTimeout(()=>cb(getAt(p)),0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1);};},
    remove:async p=>{setAt(p,null);persist();}, inc:async(p,n)=>{setAt(p,(getAt(p)||0)+n);persist();},
    push:(p,v)=>{const k='k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);setAt(p+'/'+k,v);persist();return k;},
    transaction:async(p,fn)=>{ const cur=getAt(p), nv=fn(cur); if(nv===undefined) return {committed:false,value:cur}; setAt(p,nv); persist(); return {committed:true,value:nv}; }
  };
}

   inventory.coins/rares를 대신 써 주도록 옮기고, 규칙에서 학생 쓰기를 막으면 돼요. */

    // [2차] 성장·아이템·퀘스트 (기존 계정은 여기 기본값으로 채워져요)
    level:1,exp:0,gems:0,stamina:BALANCE.staminaMax,staminaAt:0,title:TITLES[0][1],equipped:{...DEFAULT_EQUIP},items:{},stats:{},

    class:null,classes:{},badges:{},badge:'',week:null,seen:{}}; },
  load(d){ const def=this.defaults(); this.inv=Object.assign(this.defaults(),d||{});
    for(const k in def) if(def[k]&&typeof def[k]==='object'&&(typeof this.inv[k]!=='object'||!this.inv[k])) this.inv[k]=def[k];
    for(const k of ['level','exp','gems','stamina','coins','wood','stone']) if(typeof this.inv[k]!=='number') this.inv[k]=def[k];
    this.inv.equipped={...DEFAULT_EQUIP,...(d?.equipped||{})}; if(!this.inv.title) this.inv.title=def.title; },
  isStudent(){ return this.me.role==='student'; },
  change(){ this._dirty=true; UI.hud(); },
  flush(force=false){
    if(!this._dirty||!this.isStudent()||!this.me.uid) return;
    const t=performance.now(); if(!force&&t-this._last<LIMITS.saveMs) return; this._last=t; this._dirty=false;
    Net.onSave(); // [4차] 저장 표시
    FB.set('inventory/'+this.me.uid,this.inv).catch(()=>{});
    FB.set('profiles/'+this.me.uid,{name:this.me.name,color:this.me.color,score:this.score,words:this.wordCount(),items:this.itemCount(),level:this.inv.level,title:this.inv.title,likes:this.inv.likes||0,visit:this.inv.visit||'friends',badge:this.inv.badge||'',cls:this.inv.class||'',lastSeen:FB.now()}).catch(()=>{});
  },
  addScore(n){ this.score+=n; },
  wordCount(){ return Object.values(this.inv.words).filter(Boolean).length; },
  itemCount(){ return Object.values(this.inv.sentences).filter(Boolean).length; },
  // [2차] 모든 재화·아이템을 한 창구에서 세고, 빼고, 더해요
  count(k){ const inv=this.inv; if(!inv) return 0; if(RES_KEYS[k]) return inv[k]||0; const D=ITEM_DEFS[k]; if(D?.base) return 1; if(D?.store==='rares') return inv.rares[k]||0; return inv.items[k]||0; },
  addItem(k,n=1){ const inv=this.inv; if(RES_KEYS[k]) inv[k]=(inv[k]||0)+n; else if(ITEM_DEFS[k]?.store==='rares') inv.rares[k]=(inv.rares[k]||0)+n; else if(ITEM_DEFS[k]) inv.items[k]=(inv.items[k]||0)+n; },
  take(k,n=1){ if(this.count(k)<n) return false; if(ITEM_DEFS[k]?.base) return true; const inv=this.inv;
    const bx=RES_KEYS[k]?inv:ITEM_DEFS[k]?.store==='rares'?inv.rares:inv.items; bx[k]-=n; if(bx!==inv&&bx[k]<=0) delete bx[k]; this.change(); return true; },
  canAfford(c){ return Object.entries(c||{}).every(([k,v])=>this.count(k)>=v); },
  spend(c){ if(!this.canAfford(c)) return false; for(const [k,v] of Object.entries(c||{})) this.take(k,v); this.change(); return true; },
  _fullAt:-1e9,
  grant(r={}){
    for(const k of ['coins','gems','wood','stone']) if(r[k]) this.inv[k]=(this.inv[k]||0)+r[k];
    for(const [k,n] of Object.entries(r.items||{})) this.addItem(k,n);
    if(r.letters){ const cap=Growth.bagCap(); let total=Growth.letterTotal(), lost=0;
      r.letters.forEach(l=>{ if(total<cap||!this.isStudent()){ this.inv.letters[l]=(this.inv.letters[l]||0)+1; total++; } else lost++; });
      if(lost&&performance.now()-this._fullAt>8000){ this._fullAt=performance.now(); toast(`🎒 가방이 꽉 찼어요! (${cap}개) 단어를 만들어 알파벳을 쓰거나 🛠️ 공방에서 더 큰 가방을 만들어요.`,4200); } }
    if(r.rare) this.inv.rares[r.rare]=(this.inv.rares[r.rare]||0)+1;
    if(r.score) this.addScore(r.score);
    this.change();
  },
  logCraft(type,id){ if(this.isStudent()) FB.inc(`craftlog/${this.me.uid}/${today()}/${type}/${id}`,1); }
};
function missingLetters(w){
  const need={}; letterList(w).forEach(l=>need[l]=(need[l]||0)+1);
  const miss=[]; for(const l in need){ const m=need[l]-(GS.inv.letters[l]||0); for(let i=0;i<m;i++) miss.push(l); } return miss;
}
function questProgress(q,crafts=GS.crafts){
  const ws=new Set(), ss=new Set(), L=+q.lesson||0;
  for(const d in crafts||{}){ if(d<q.date) continue; const c=crafts[d]||{};
    for(const id in c.w||{}) if(!L||WORDS[id]?.lesson===L) ws.add(id);
    for(const id in c.s||{}) if(!L||SENTS[id]?.lesson===L) ss.add(id); }
  return {w:ws.size,s:ss.size};
}

function mesh(geo,m,x=0,y=0,z=0,parent=scene){ const o=new THREE.Mesh(geo,m); o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; parent.add(o); return o; }

// 충돌: 정적 + 태그(건물)별 동적 원형 충돌체
const colliders=[];
const collide=(x,z,r,tag=null,h=0)=>colliders.push({x,z,r,tag,h}); // [3차] h: 이 높이보다 높이 뛰면 넘어가요
const removeColliders=tag=>{ for(let i=colliders.length-1;i>=0;i--) if(colliders[i].tag===tag) colliders.splice(i,1); };

function roundRect(x,X,Y,W,H,R){ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); }
function textSprite(text,{font='56px Jua',color='#fff8e6',bg='rgba(15,36,48,.88)',h=.7,padX=22,padY=14}={}){
  const c=document.createElement('canvas'),x=c.getContext('2d'); x.font=font; const size=parseInt(font.match(/(\d+)px/)[1]);
  c.width=Math.ceil(x.measureText(text).width)+padX*2; c.height=size+padY*2; x.font=font;
  if(bg){ x.fillStyle=bg; roundRect(x,0,0,c.width,c.height,Math.min(28,c.height/2)); x.fill(); }
  x.fillStyle=color; x.textAlign='center'; x.textBaseline='middle'; x.fillText(text,c.width/2,c.height/2+size*.06);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false})); s.scale.set(h*c.width/c.height,h,1); s.renderOrder=5; return s;
}
function disposeSprite(s){ s.material.map?.dispose(); s.material.dispose(); }

  ctx.fillStyle='#ffc93c'; roundRect(ctx,10,8,108,104,24); ctx.fill();

}
function tree(x,z,s,rnd=Math.random,parent=scene,tag=null){
  mesh(new THREE.CylinderGeometry(.25*s,.35*s,1.8*s,8),mat(0x8a5a36),x,.9*s,z,parent);
  const f=mesh(new THREE.IcosahedronGeometry(1.5*s,0),mat([0x3f9e4d,0x4fb35a,0x2f8a45,0x6cc36b][Math.floor(rnd()*4)],{flatShading:true}),x,2.6*s,z,parent);
  f.rotation.y=rnd()*3; if(parent===scene) collide(x,z,.6*s,tag);
}
function building(x,z,w,d,h,wall,roof,faceX,faceZ){
  const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
  box(w,h,d,wall,0,h/2,0,g);
  const r=Math.max(w,d)/Math.SQRT2+.5, rm=mesh(new THREE.ConeGeometry(r,2.2,4),mat(roof,{flatShading:true}),0,h+1.1,0,g);
  rm.rotation.y=Math.PI/4; rm.scale.set(w/Math.max(w,d),1,d/Math.max(w,d));
  box(1.2,2,.12,0x6b4226,0,1,d/2+.02,g); box(1,.9,.1,0xbde8ff,-w/3,h*.6,d/2+.03,g); box(1,.9,.1,0xbde8ff,w/3,h*.6,d/2+.03,g);
  g.lookAt(faceX,0,faceZ); collide(x,z,Math.max(w,d)/2+.3); return g;
}

  t.fillStyle=bg; roundRect(t,0,0,512,256,30); t.fill(); t.fillStyle='rgba(255,255,255,.9)'; roundRect(t,14,14,484,228,22); t.fill();
  t.fillStyle='#1d3a4a'; t.textAlign='center'; t.font='bold 60px Fredoka'; t.fillText(lines[0],256,82);
  t.font='500 36px Fredoka'; t.fillText(lines[1],256,140); t.font='46px Jua'; t.fillText(lines[2],256,208);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g); box(.25,2.4,.25,0x8a5a36,0,1.2,0,g);
  const b=new THREE.Mesh(new THREE.PlaneGeometry(3.4,1.7),new THREE.MeshLambertMaterial({map:tex,side:THREE.DoubleSide})); b.position.y=3.1; g.add(b);
  g.lookAt(faceX,0,faceZ); collide(x,z,.4);
}

    box(2.8,.6,1.2,0xb5653a,0,.35,0,bt); box(1,.8,.9,0xffffff,-.3,1,0,bt); box(.08,1.6,.08,0x6b4226,.6,1.4,0,bt); bt.rotation.y=Z.a;

  } else if(L.n===9){
    const [x,z]=P(9,0); const dia=mesh(new THREE.BoxGeometry(6.5,.06,6.5),mat(0xc98c5a),x,.05,z); dia.rotation.y=Math.PI/4+Z.a; dia.castShadow=false;
    [[0,3.8],[3.8,0],[0,-3.8],[-3.8,0]].forEach(([a,b])=>{ const [bx,bz]=P(9+a*.95,b*.95); box(.5,.12,.5,0xffffff,bx,.1,bz); });

  const t=performance.now(); if(t-lastUse<200) return; lastUse=t;
  if(Maps.mode==='edit') return Maps.action(); if(Maps.mode==='play') return; // [3차]
  if(Build.mode) return Build.action();
  if(Interact.near) return Interact.near.use();
  if(Dungeon.inside) return UI.open('battle');
}
addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.code==='Escape'){ if(UI.modal) UI.close(); else if(Build.mode) Build.toggle(false); return; }
  if(!GS.started||UI.modal) return;
  keys[e.code]=true;
  if(e.code==='Space'){ jumpReq=true; e.preventDefault(); }
  if(e.code==='KeyE') interact();
  if(e.code==='KeyI') UI.open('bag');
  if(e.code==='KeyQ'&&GS.isStudent()) UI.open('board');
  if(Build.mode){ if(e.code==='KeyR') Build.rotate(); if(e.code==='KeyX') Build.setDemolish(!Build.demolish); }
  if(Maps.mode==='edit'&&e.code==='KeyX'){ Maps.erase=!Maps.erase; UI.mapBar(); }
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
const cv=renderer.domElement; let drag=null;
cv.addEventListener('pointerdown',e=>{ drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:0}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){ mouse.ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); mouse.t=performance.now(); }
  if(!drag||drag.id!==e.pointerId) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.moved+=Math.abs(dx)+Math.abs(dy); drag.x=e.clientX; drag.y=e.clientY; camYaw-=dx*.006; camPitch=Math.min(1.25,Math.max(.12,camPitch+dy*.004)); });
cv.addEventListener('pointerup',()=>{ if(drag&&drag.moved<8&&GS.started&&!UI.modal) interact(); drag=null; });
cv.addEventListener('wheel',e=>{ camDist=Math.min(26,Math.max(6,camDist+e.deltaY*.01)); },{passive:true});
const joyEl=$('#joy'), knob=$('#knob');
function moveJoy(e){ const r=joyEl.getBoundingClientRect(); let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  const m=r.width/2, l=Math.hypot(dx,dy); if(l>m){dx*=m/l;dy*=m/l;} knob.style.transform=`translate(${dx}px,${dy}px)`; joy.x=dx/m; joy.y=dy/m; }
joyEl.addEventListener('pointerdown',e=>{ joy.id=e.pointerId; joyEl.setPointerCapture(e.pointerId); moveJoy(e); });
joyEl.addEventListener('pointermove',e=>{ if(e.pointerId===joy.id) moveJoy(e); });
const joyEnd=()=>{ joy.id=null; joy.x=joy.y=0; knob.style.transform=''; };
joyEl.addEventListener('pointerup',joyEnd); joyEl.addEventListener('pointercancel',joyEnd);
$('#act').addEventListener('click',()=>{ if(!UI.modal) interact(); });
$('#jump').addEventListener('click',()=>{ jumpReq=true; });

function updatePlayer(dt){
  let ix=0,iz=0;
  if(!UI.modal){ if(keys.KeyW||keys.ArrowUp) iz+=1; if(keys.KeyS||keys.ArrowDown) iz-=1; if(keys.KeyA||keys.ArrowLeft) ix-=1; if(keys.KeyD||keys.ArrowRight) ix+=1; ix+=joy.x; iz-=joy.y; }
  const l=Math.hypot(ix,iz); if(l>1){ix/=l;iz/=l;}
  const sy=Math.sin(camYaw), cy=Math.cos(camYaw), mx=-sy*iz+cy*ix, mz=-cy*iz-sy*ix;
  const sp=(keys.ShiftLeft||keys.ShiftRight)?10:6.5, mv=Math.hypot(mx,mz);
  const nx=pos.x+mx*sp*dt, nz=pos.z+mz*sp*dt;
  if(walkable(nx,nz)){ pos.x=nx; pos.z=nz; } else if(walkable(nx,pos.z)) pos.x=nx; else if(walkable(pos.x,nz)) pos.z=nz;
  if(mv>.05){ const tgt=Math.atan2(mx,mz); const d=((tgt-facing+Math.PI*3)%(Math.PI*2))-Math.PI; facing+=d*Math.min(1,dt*12); }
  if(jumpReq&&onGround&&!UI.modal){ vy=8.5; onGround=false; } jumpReq=false;
  vy-=24*dt; pos.y+=vy*dt; if(pos.y<=0){pos.y=0;vy=0;onGround=true;}
  for(const c of colliders){ const dx=pos.x-c.x, dz=pos.z-c.z; if(Math.abs(dx)>c.r+1||Math.abs(dz)>c.r+1) continue; if(c.h&&pos.y>c.h) continue; const d=Math.hypot(dx,dz), m=c.r+.45; if(d<m&&d>1e-4){ pos.x=c.x+dx/d*m; pos.z=c.z+dz/d*m; } }
  player.position.copy(pos); player.rotation.y=facing; animAvatar(player,mv*sp,dt);
}

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §8 MULTIPLAYER (위치 동기화, 보간, 쓰기 빈도 제한)             ║
   ╚══════════════════════════════════════════════════════════════╝ */
const Multi={ remotes:{}, raw:{}, lastSay:null, lastEmo:null, lastSent:0, lastKey:'',
  send(now,force=false){
    if(FB.mode!=='online'||!player) return;
    const k=`${pos.x.toFixed(1)},${pos.y.toFixed(1)},${pos.z.toFixed(1)},${facing.toFixed(1)}`;
    if(!force&&(now-this.lastSent<LIMITS.presenceMs||(k===this.lastKey&&now-this.lastSent<LIMITS.presenceIdleMs))) return;
    this.lastSent=now; this.lastKey=k;
    FB.set('players/'+GS.me.uid,{name:GS.me.name,color:GS.me.color,role:GS.me.role,x:+pos.x.toFixed(2),y:+pos.y.toFixed(2),z:+pos.z.toFixed(2),ry:+facing.toFixed(2),t:FB.now(),say:this.lastSay,hat:GS.inv?.equipped?.hat||null,pet:GS.inv?.equipped?.pet||null,
      // [3차] 위치 종류·코스·감정 표현도 함께 보내요
      loc:Social.loc(),m:Maps.mode==='play'?Maps.id:null,emo:this.lastEmo}).catch(()=>{});
  },
  onPlayers(val){
    val=val||{}; this.raw=val;
    for(const uid in val){ if(uid===GS.me.uid) continue; const p=val[uid]; if(!p||typeof p.x!=='number') continue;
      // [3차] 차단 / [5차] 다른 학급 친구는 월드에서 보이지 않아요
      if(Social.isBlocked(uid)||(p.role!=='chief'&&!Classes.inClass(uid))){ if(this.remotes[uid]){ scene.remove(this.remotes[uid].av); disposeAvatar(this.remotes[uid].av); delete this.remotes[uid]; } continue; }
      let r=this.remotes[uid];
      if(!r){ if(Object.keys(this.remotes).length>=LIMITS.maxRemotes) continue;
        r=this.remotes[uid]={av:makeAvatar(p.color||'#888',p.name||'?',p.role==='chief'),cur:new THREE.Vector3(p.x,p.y,p.z),ry:p.ry||0,sayT:0,name:p.name,role:p.role}; scene.add(r.av); }
      r.tx=p.x; r.ty=p.y; r.tz=p.z; r.try=p.ry||0; r.name=p.name; r.role=p.role;
      if(r.role!=='chief') setHat(r.av,p.hat||null); Pets.attachRemote(r,p.pet||null); // [2차]
      r.m=p.m||null; if(p.emo&&p.emo.t!==r.emoT){ r.emoT=p.emo.t; if(Math.abs(FB.now()-p.emo.t)<8000) setBubble(r.av,p.emo.e); } // [3차]
      if(p.say&&p.say.t!==r.sayT){ r.sayT=p.say.t; if(Math.abs(FB.now()-p.say.t)<10000) setBubble(r.av,p.say.text); } }
    for(const uid in this.remotes) if(!val[uid]){ scene.remove(this.remotes[uid].av); disposeAvatar(this.remotes[uid].av); delete this.remotes[uid]; }
  },
  update(dt){
    const k=Math.min(1,dt*9);
    for(const uid in this.remotes){ const r=this.remotes[uid]; const ox=r.cur.x, oz=r.cur.z;
      if(Math.hypot(r.tx-r.cur.x,r.tz-r.cur.z)>40) r.cur.set(r.tx,r.ty,r.tz); // 순간이동은 바로 따라가요
      else { r.cur.x+=(r.tx-r.cur.x)*k; r.cur.y+=(r.ty-r.cur.y)*k; r.cur.z+=(r.tz-r.cur.z)*k; }
      const d=((r.try-r.ry+Math.PI*3)%(Math.PI*2))-Math.PI; r.ry+=d*k;
      if(r.petObj) r.petObj.position.y=2.3+Math.sin(performance.now()/300)*.2;
      r.av.position.copy(r.cur); r.av.rotation.y=r.ry;
      // [3차] 챌린지 무대에서는 같은 코스를 하는 친구만 보여요
      // [4차] 너무 먼 친구는 그리지 않아요 (저사양 기기 보호)
      const far=Math.hypot(r.cur.x-pos.x,r.cur.z-pos.z)>Perf.q.remoteDist;
      r.av.visible=!far&&(!Maps.inStage(r.cur.x,r.cur.z)||(!!Maps.id&&r.m===Maps.id));
      animAvatar(r.av,Math.hypot(r.cur.x-ox,r.cur.z-oz)/Math.max(dt,1e-3),dt); }
  },
  studentsOnline(){ return Object.values(this.remotes).filter(r=>r.role!=='chief').length+(GS.isStudent()?1:0); },
  emote(e){ if(!player) return; setBubble(player,e); this.lastEmo={e,t:FB.now()}; this.send(performance.now(),true); }, // [3차]
  say(text,voice=true){ if(!player) return; setBubble(player,text); if(voice) speak(text.replace(/^[^A-Za-z]+/,'')); this.lastSay={text,t:FB.now()}; this.send(performance.now(),true); }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §9 LEARNING CORE (채집·단어·문장·문제) → Bus 'learn' 발생      ║
   ╚══════════════════════════════════════════════════════════════╝ */
const Learn={ lastMine:0, lastSayAt:0,
  mine(o){
    const now=performance.now(); if(now-this.lastMine<260) return;
    const hits=Growth.pickHits(); if(o.hp>hits) o.hp=hits;                 // [2차] 곡괭이에 따라 캐는 횟수
    if(o.hp<=1&&GS.isStudent()&&Stamina.value()<BALANCE.staminaMine){      // [2차] 기운(스태미나)
      if(now-this.lastMine>1500) toast('⚡ 기운이 모자라요! 잠깐 쉬거나 🍎 사과를 먹어요. (30초마다 1씩 차올라요)'); this.lastMine=now; return; }
    this.lastMine=now;
    player.userData.swing=.3; o.hp--; o.shake=.25; burst(o.x,1,o.z,0x9aa6b5,6); beep(300+Math.random()*80,.06,'square',.04);
    if(o.hp>0) return;
    if(GS.isStudent()) Stamina.spend(BALANCE.staminaMine);
    const P=Growth.pick().stats, extraP=BALANCE.mineExtra+(P.extra||0)+(Growth.hasPet('pet_fairy')?.15:0);
    const got=[o.letter]; if(Math.random()<extraP) got.push(pickLetter(o.lesson));
    const M=BALANCE.mineDrops, stone=Math.random()<M.stone?1:0, items={};
    if(Math.random()<M.iron) items.iron=1; if(Math.random()<M.shard+(P.shard||0)) items.shard=1;
    GS.grant({letters:got,stone,score:got.length,items});
    burst(o.x,1.6,o.z,0xffc93c,14); tune([660,880]); popAt(o.x,3,o.z,'+ '+got.join(' ')+(stone?' 🪨':'')+(items.iron?' 🔩':'')+(items.shard?' 🔷':''));
    o.active=false; o.g.visible=false; o.respawn=now+12000;
    Bus.emit('learn',{kind:'mine',lesson:o.lesson,x:o.x,z:o.z});
    if(stone) Bus.emit('learn',{kind:'loot',id:'stone',n:1});
    if(items.iron) Bus.emit('learn',{kind:'loot',id:'iron',n:1});
    if(items.shard) Bus.emit('learn',{kind:'loot',id:'shard',n:1});
  },
  finishWord(w,placed){
    placed.forEach(l=>{ if(l){ GS.inv.letters[l]--; if(GS.inv.letters[l]<=0) delete GS.inv.letters[l]; } });
    const first=!GS.inv.words[w.id]; GS.inv.words[w.id]=(GS.inv.words[w.id]||0)+1;
    GS.grant({score:first?10:3,coins:(first?2:1)+(Growth.hasPet('pet_sprite')?1:0)}); GS.logCraft('w',w.id);
    if(GS.focusWord===w) GS.focusWord=null;
    Bus.emit('learn',{kind:'word',first,id:w.id}); return first; // [5차] 복습 추천에 쓰여요
  },
  finishSentence(s){
    const first=!GS.inv.sentences[s.id]; GS.inv.sentences[s.id]=(GS.inv.sentences[s.id]||0)+1;
    GS.grant({score:first?30:10,coins:first?5:2}); GS.logCraft('s',s.id);
    Bus.emit('learn',{kind:'sentence',first,id:s.id}); return first; // [5차]
  },
  miss(id){ GS.inv.mistakes[id]=(GS.inv.mistakes[id]||0)+1; GS.change(); Bus.emit('learn',{kind:'miss'}); },
  said(){ const t=performance.now(); if(t-this.lastSayAt<20000) return; this.lastSayAt=t; Bus.emit('learn',{kind:'say'}); }
};
const norm=t=>t.toLowerCase().replace(/[^a-z0-9']/g,'');
const Quiz={
  words(lesson){ return lesson?LES[lesson].words:Object.values(WORDS); },
  choice(lesson){
    const pool=this.words(lesson), w=pick(pool);
    const others=shuffle([...new Set(pool.filter(x=>x.en!==w.en&&x.ko!==w.ko).map(x=>x.en))]).slice(0,3);
    return {type:'choice',prompt:w.ko,answer:w.en,options:shuffle([w.en,...others]),id:w.id};
  },
  spell(lesson){
    const pool=this.words(lesson).filter(w=>letterList(w).length<=10), w=pick(pool);
    const tiles=shuffle([...letterList(w),pick(ALL_LETTERS),pick(ALL_LETTERS)]).map(l=>({l,used:false}));
    return {type:'spell',prompt:w.ko,answer:w.en,tiles,placed:[],id:w.id};
  },
  sentence(lesson){
    const pool=lesson?LES[lesson].sents:Object.values(SENTS), s=pick(pool);
    const mine=new Set(s.tokens.map(norm)); const extra=shuffle(Object.values(SENTS).flatMap(o=>o.tokens).filter(t=>!mine.has(norm(t)))).slice(0,1);
    return {type:'sentence',prompt:s.ko,answer:s.en,pool:shuffle([...s.tokens,...extra]).map(t=>({t,used:false})),ans:[],id:s.id,len:s.tokens.length};
  },
  // [4차] 선생님이 만든 문제가 있으면 가끔 그 문제가 나와요
  make(type,lesson){ return Studio.makeQuiz(type,lesson)||this[type](lesson); }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §10 EVENT SYSTEM (마을 랜덤 이벤트)                            ║
   ╚══════════════════════════════════════════════════════════════╝
   상태: starting(5초 준비) → running → success | fail → ended(쿨다운 뒤 다음 후보)
   진행 주체(driver): 관리자 브라우저. 선생님 화면이 열려 있어야 자동 이벤트가 돌아가요.
   (체험 모드에서는 이 기기가 driver.)  TODO(서버): Cloud Functions 스케줄러로 옮기면 선생님 없이도 돌아가요. */
const EventSys={
  cur:null, next:null, settings:{auto:true}, contrib:{}, chests:{}, myPts:0, pending:0, lastFlush:0, flushT:null,
  subs:[], visuals:[], chestObjs:[], lastDrive:0, lastState:null,
  init(){
    FB.on('events/current',v=>this.onCurrent(v));
    FB.on('events/next',v=>{ this.next=v; UI.refreshAdmin(); });
    FB.on('events/settings',v=>{ this.settings=v||{auto:true}; UI.refreshAdmin(); });
    Bus.on('learn',d=>this.onLearn(d));
  },
  isDriver(){ return FB.isAdmin||FB.mode==='offline'; },
  onCurrent(v){
    const prevId=this.cur?.id; this.cur=v;
    if(v?.id!==prevId){
      this.subs.forEach(u=>u&&u()); this.subs=[]; this.contrib={}; this.chests={}; this.myPts=0; this.pending=0;
      if(v?.id){ this.subs.push(FB.on('events/contrib/'+v.id,c=>{ this.contrib=c||{}; const mine=this.contrib[GS.me.uid]?.p||0; if(mine>this.myPts) this.myPts=mine; UI.refreshAdmin(); }));
        if(v.type==='treasure') this.subs.push(FB.on('events/chests/'+v.id,c=>{ this.chests=c||{}; this.syncChests(); })); }
      this.buildVisuals();
    }
    if(v&&v.state!==this.lastState){ this.announce(v); this.lastState=v.state; }
    this.checkReward(); UI.eventHud(); UI.refreshAdmin();
  },
  announce(e){
    const T=EVENT_TYPES[e.type]; if(!T) return;
    if(e.state==='starting'){ toast(`${T.emoji} <b>${T.name}</b> 이벤트가 곧 시작해요!<br><small>${esc(T.desc)}</small>`,6000); tune([523,659,784]); }
    else if(e.state==='running'){ beep(880,.15,'triangle',.08); }
    else if(e.state==='success'){ toast(`🎉 <b>${T.name}</b> 성공! 모두 대단해요!`,4500); tune([784,988,1175,1568]); }
    else if(e.state==='fail'){ toast(`😢 <b>${T.name}</b>… 아쉽게 시간이 끝났어요. 다음엔 꼭 해내요!`,4500); }
  },
  total(){ let s=0; for(const uid in this.contrib) if(uid!==GS.me.uid) s+=this.contrib[uid]?.p||0; return s+this.myPts; },
  progress(){ const e=this.cur; return e?.goal?Math.min(1,this.total()/e.goal):0; },
  onLearn(d){
    const e=this.cur; if(!e||e.state!=='running'||!GS.isStudent()) return;
    const T=EVENT_TYPES[e.type]; let pts=T.points[d.kind]||0;
    if(e.type==='meteor'&&d.kind==='mine'&&d.lesson===e.lesson) pts=3;
    if(!pts) return;
    if(!this.myPts) Bus.emit('learn',{kind:'eventJoin'}); // [2차]
    this.myPts+=pts; this.pending+=pts;
    Bus.emit('learn',{kind:'eventPts',n:pts}); // [3차] 파티 퀘스트 기여도
    if(player) popAt(pos.x,pos.y+3.6,pos.z,`${T.emoji} +${pts}`,'ev');
    this.flush(); UI.eventHud();
  },
  flush(force=false){
    if(!this.pending||!this.cur) return; const t=performance.now();
    if(!force&&t-this.lastFlush<LIMITS.contribMs){ clearTimeout(this.flushT); this.flushT=setTimeout(()=>this.flush(true),LIMITS.contribMs); return; }
    this.lastFlush=t; this.pending=0;
    FB.set(`events/contrib/${this.cur.id}/${GS.me.uid}`,{n:GS.me.name,p:this.myPts}).catch(()=>{});
  },
  checkReward(){
    const e=this.cur; if(!e||!GS.isStudent()||!['success','fail'].includes(e.state)) return;
    if(GS.inv.eventClaims[e.id]) return; const my=this.myPts; if(!my) return;
    GS.inv.eventClaims[e.id]=true; const ks=Object.keys(GS.inv.eventClaims); if(ks.length>20) delete GS.inv.eventClaims[ks[0]];
    // TODO(서버): 보상 지급은 Cloud Functions가 contrib를 확인하고 inventory에 써 주도록 옮기기
    const ok=e.state==='success';
    if(ok){ const r=e.reward||{}; const bonus=Math.min(20,my); const items=Math.random()<BALANCE.eventShardChance?{shard:1}:{};
      GS.grant({coins:(r.coins||0)+bonus,wood:r.wood||0,stone:r.stone||0,score:20,items});
      toast(`🎁 이벤트 보상: 🪙${(r.coins||0)+bonus} 🪵${r.wood||0} 🪨${r.stone||0} ⭐20${items.shard?' 🔷1':''}`,4500);
      if(items.shard) Bus.emit('learn',{kind:'loot',id:'shard',n:1}); }
    else { GS.grant({coins:5}); toast('🎗️ 참가상 🪙5를 받았어요.'); }
    Bus.emit('learn',{kind:'eventReward',success:ok}); // [2차] 경험치
  },
  // --- driver ---
  drive(){
    if(!this.isDriver()||!GS.started) return; const t=performance.now(); if(t-this.lastDrive<1000) return; this.lastDrive=t;
    const now=FB.now(), e=this.cur;
    if(e&&e.state==='starting'&&now>=e.startedAt) FB.update('events/current',{state:'running'});
    else if(e&&e.state==='running'){ if(this.total()>=e.goal) this.finish('success'); else if(now>=e.endsAt) this.finish('fail'); }
    else if(e&&(e.state==='success'||e.state==='fail')&&now>=(e.endedAt||0)+8000){
      FB.update('events/current',{state:'ended'}); this.scheduleNext(now); }
    else if(!e||e.state==='ended'){
      if(this.settings.auto===false) return;
      if(!this.next) this.scheduleNext(now);
      else if(now>=this.next.at&&now>=(e?.cooldownUntil||0)) this.start(this.next.type);
    }
  },
  scheduleNext(now=FB.now()){ const mins=5+Math.random()*5; FB.set('events/next',{type:pick(EVENT_KEYS),at:Math.round(now+mins*60e3)}); },
  start(type){
    const T=EVENT_TYPES[type]; if(!T) return; const now=FB.now();
    if(this.cur&&['starting','running'].includes(this.cur.state)){ toast('이미 진행 중인 이벤트가 있어요.'); return; }
    const C=Studio.eventCfg(); const cfg=(C&&C.type===type)?C:null; // [4차] 선생님이 만든 이벤트 설정
    const goal=Math.max(5,Math.round(T.goalPer*Math.max(3,Multi.studentsOnline())*(cfg?+cfg.goalMul||1:1)));
    const rw=cfg?Object.fromEntries(Object.entries(T.reward).map(([k,v])=>[k,typeof v==='number'?Math.round(v*(+cfg.rewardMul||1)):v])):T.reward;
    FB.set('events/current',{id:'e'+now.toString(36),type,state:'starting',startedAt:now+5000,endsAt:now+5000+T.duration*1000,goal,
      note:cfg?.note||null,lesson:Classes.pickLesson(), // [5차] 학급 레슨 범위
      seed:Math.floor(Math.random()*1e9),reward:rw});
    FB.remove('events/next');
  },
  finish(state){ const now=FB.now(); FB.update('events/current',{state,endedAt:now,cooldownUntil:now+8000+60e3,finalTotal:this.total()}); },
  // --- visuals (동적 오브젝트는 이벤트당 최대 12개) ---
  clearVisuals(){ this.visuals.forEach(o=>{ scene.remove(o); o.traverse(c=>{ if(c.isSprite) disposeSprite(c); const fi=FIRES.indexOf(c); if(fi>=0) FIRES.splice(fi,1); }); }); this.visuals=[];
    this.chestObjs.forEach(c=>{ scene.remove(c.g); Interact.remove(c.it); }); this.chestObjs=[]; },
  buildVisuals(){
    this.clearVisuals(); const e=this.cur; if(!e||e.state==='ended') return;
    const rnd=mulberry(e.seed||1);
    if(e.type==='treasure'){
      for(let i=0;i<8;i++){ let x,z,tries=0; do{ const a=rnd()*Math.PI*2, r=16+rnd()*52; x=Math.sin(a)*r; z=-Math.cos(a)*r; tries++; }
        while(tries<20&&colliders.some(c=>Math.hypot(c.x-x,c.z-z)<c.r+1.5));
        const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rnd()*6; scene.add(g);
        box(1.3,.8,.9,0x9c5b2e,0,.4,0,g); box(1.36,.35,.96,0xffc93c,0,.95,0,g); box(.25,.3,.1,0x3b2500,0,.7,.48,g);
        const s=textSprite('🎁',{font:'64px Jua',bg:null,h:.9}); s.position.y=2; g.add(s);
        const c={i,g,x,z}; c.it=Interact.add({kind:'chest',x,z,r:2.6,icon:'🎁',enabled:()=>!this.chests[i]&&this.cur?.state==='running'&&GS.isStudent(),
          label:()=>'보물상자 열기 (문제 풀기)',use:()=>this.openChest(c)}); this.chestObjs.push(c);
      }
      this.syncChests();
    } else if(e.type==='monster'){
      for(let i=0;i<6;i++){ const m=Dungeon.makeMonsterMesh(i%2?'bat':'slime'); const a=i/6*Math.PI*2; m.position.set(Math.sin(a)*16,0,-Math.cos(a)*16); m.userData.orbit=a; scene.add(m); this.visuals.push(m); }
    } else if(e.type==='meteor'){
      const Z=zoneOfLesson(e.lesson); const g=new THREE.Group(); g.position.set(Z.cx,0,Z.cz); scene.add(g);
      disc(3.5,0x4a3b35,0,0,.05,g);
      mesh(new THREE.DodecahedronGeometry(1.8,0),new THREE.MeshLambertMaterial({color:0x7a2e1f,emissive:0xff4a1a,emissiveIntensity:.5,flatShading:true}),0,1.4,0,g);
      for(let q=0;q<4;q++){ const f=mesh(new THREE.ConeGeometry(.35,1.1,6),new THREE.MeshBasicMaterial({color:0xff8c1a}),Math.sin(q*1.6)*1.8,.6,Math.cos(q*1.6)*1.8,g); FIRES.push(f); }
      const s=textSprite(`☄️ 운석이 떨어졌어요! L${e.lesson} 구역`,{font:'52px Jua',h:1.1,bg:'rgba(122,46,31,.92)'}); s.position.y=6; g.add(s);
      g.userData.meteor=true; this.visuals.push(g);
    } else if(e.type==='festival'){
      for(let i=0;i<12;i++){ const a=i/12*Math.PI*2, g=new THREE.Group(); g.position.set(Math.sin(a)*12.5,0,-Math.cos(a)*12.5); scene.add(g);
        box(.15,3,.15,0x8a5a36,0,1.5,0,g); mesh(new THREE.SphereGeometry(.45,10,8),new THREE.MeshLambertMaterial({color:[0xff6b8b,0xffc93c,0x3cc6b4,0x9b8cff][i%4],emissive:0x331100}),0,3.2,0,g);
        g.visible=false; g.userData.festival=i; this.visuals.push(g); }
    }
  },
  syncChests(){ this.chestObjs.forEach(c=>{ c.g.visible=!this.chests[c.i]; }); },
  openChest(c){
    UI.openQuiz(Quiz.make('choice',pick(LESSONS).n),{title:'🎁 보물상자의 문제',sub:'뜻에 맞는 영어 단어를 골라요!',onDone:async ok=>{
      if(!ok){ toast('상자가 꽉 잠겼어요. 다시 해 봐요!'); return; }
      const res=await FB.transaction(`events/chests/${this.cur.id}/${c.i}`,cur=>cur?undefined:GS.me.uid).catch(()=>({committed:false}));
      if(res.committed){ burst(c.x,1,c.z,0xffc93c,18); tune([659,784,1047]); GS.grant({coins:3}); Bus.emit('learn',{kind:'chest'}); toast('🎁 보물상자를 열었어요! 🪙3'); }
      else toast('앗, 친구가 한발 먼저 열었어요!');
    }});
  },
  updateVisuals(dt,now){
    const e=this.cur; if(!e) return; const p=this.progress();
    for(const v of this.visuals){
      if(v.userData.orbit!==undefined){ v.userData.orbit+=dt*.25; const a=v.userData.orbit; v.position.set(Math.sin(a)*16,Math.abs(Math.sin(now/300+a))*.6,-Math.cos(a)*16);
        const s=Math.max(.2,1-p*.8); v.scale.setScalar(s); v.visible=e.state!=='success'; }
      else if(v.userData.meteor){ const s=Math.max(.15,1-p*.85); v.children[1].scale.setScalar(s); v.visible=e.state!=='success'; }
      else if(v.userData.festival!==undefined){ v.visible=v.userData.festival<Math.floor(p*12)||e.state==='success'; }
    }
    if(e.state==='ended'&&this.visuals.length+this.chestObjs.length) this.clearVisuals();
  }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §11 DUNGEON SYSTEM (공용 던전 방: 3웨이브 + 보스)              ║
   ╚══════════════════════════════════════════════════════════════╝
   dungeon/room = {runId,state:'idle'|'running'|'cleared'|'failed',wave,startedAt,endsAt,updatedAt,cooldownUntil,monsters,players}
   - 몬스터 체력은 transaction으로 여러 명이 동시에 깎아도 안전해요.
   - 웨이브 넘기기/성공/실패도 transaction으로 딱 한 번만 일어나요.
   ⚠ TODO(서버): 지금은 로그인한 누구나 dungeon/room을 쓸 수 있어요. Cloud Functions(onCall: attack)로
     피해 계산과 보상을 옮기고, 규칙에서 클라이언트 쓰기를 players/{uid}로만 좁히면 돼요. */
const Dungeon={
  room:null, inside:false, hp:DG.maxHp, combo:0, meshes:{}, lastHp:{}, nextHit:0, lastHpSend:0, claimedRun:null, leftRun:null, leaveT:null,
  init(){ FB.on('dungeon/room',v=>this.onRoom(v)); },
  portalLabel(){ const r=this.room, now=FB.now();
    if(GS.inv&&GS.inv.faintUntil>now) return `😵 어지러워요… ${fmtClock(GS.inv.faintUntil-now)} 뒤에 입장`;
    if(GS.inv&&GS.inv.dungeonCooldown>now) return `🌀 포털 충전 중 ${fmtClock(GS.inv.dungeonCooldown-now)}`;
    if(r?.state==='running') return `던전에 들어가기 (웨이브 ${Math.min(r.wave,3)}${r.wave>=4?' 보스전!':''}, ${Object.keys(r.players||{}).length}명 모험 중)`;
    return '던전에 들어가기 (새 모험 시작)'; },
  spawnWave(n,players){ const f=1+.5*(Math.min(Math.max(players,1),7)-1); const out={};
    WAVES[n-1].forEach((t,i)=>{ const hp=Math.round(MONSTER_TYPES[t].hp*f); out[`m${n}_${i}`]={type:t,hp,max:hp}; }); return out; },
  meEntry(prev){ return {name:GS.me.name,color:GS.me.color,dmg:prev?.dmg||0,hp:this.hp,joinedAt:FB.now()}; },
  async tryEnter(){
    if(Raid.fighting()) return toast('👾 레이드 중에는 포털이 닫혀 있어요. 광장의 괴물부터 물리쳐요!'); if(Maps.mode) return; // [3차]
    if(!GS.isStudent()){ toast('던전은 학생 모험가만 들어갈 수 있어요. 촌장님은 집무실에서 지켜봐 주세요!'); return; }
    const now=FB.now(), inv=GS.inv;
    if(inv.faintUntil>now) return toast(`😵 아직 어지러워요! ${fmtClock(inv.faintUntil-now)} 뒤에 다시 들어갈 수 있어요.`);
    // [2차] 쿨다운이나 기운이 모자라면 입장권을 저절로 써요
    const cooling=inv.dungeonCooldown>now, tired=Stamina.value()<BALANCE.staminaDungeon, hasTicket=GS.count('ticket')>0;
    if((cooling||tired)&&!hasTicket) return toast(cooling?`🌀 포털이 힘을 모으는 중이에요. ${fmtClock(inv.dungeonCooldown-now)} 뒤에 다시 열려요. (🎫 입장권이 있으면 바로 들어가요)`
      :`⚡ 던전에 들어가려면 기운이 ${BALANCE.staminaDungeon} 필요해요. 🍎 사과를 먹거나 잠깐 쉬어요.`);
    const useTicket=cooling||tired;
    const uid=GS.me.uid; let rejoin=false;
    const res=await FB.transaction('dungeon/room',cur=>{
      const t=FB.now();
      const empty=!cur?.players||!Object.keys(cur.players).length;
      const stale=cur&&cur.state==='running'&&(t>cur.endsAt||(empty&&t-(cur.updatedAt||0)>DG.staleMs));
      if(!cur||cur.state!=='running'||stale){
        if(cur&&!stale&&(cur.cooldownUntil||0)>t) return; // 방 정리 중
        this.hp=DG.maxHp; rejoin=false;
        return {runId:'r'+t.toString(36),state:'running',wave:1,startedAt:t,endsAt:t+DG.timeLimit,updatedAt:t,monsters:this.spawnWave(1,1),players:{[uid]:this.meEntry()}};
      }
      const prev=this.leftRun?.runId===cur.runId?this.leftRun:null; rejoin=!!prev;
      this.hp=prev?prev.hp:DG.maxHp;
      cur.players=cur.players||{}; cur.players[uid]=this.meEntry(prev); cur.updatedAt=t; return cur;
    }).catch(e=>{ console.warn(e); return {committed:false}; });
    if(!res.committed){ const cd=(this.room?.cooldownUntil||0)-FB.now(); return toast(`🧹 던전을 청소하는 중이에요. ${cd>0?fmtClock(cd)+' 뒤에':'잠시 뒤에'} 다시 와요!`); }
    if(!rejoin){ if(useTicket){ GS.take('ticket',1); toast('🎫 던전 입장권을 썼어요!'); } else Stamina.spend(BALANCE.staminaDungeon); Bus.emit('learn',{kind:'dungeonJoin'}); }
    this.inside=true; this.combo=0; this.claimedRun=null; this.nextHit=performance.now()+DG.attackEvery+3000;
    FB.onDisconnectRemove(`dungeon/room/players/${uid}`);
    teleport(DUN.x+(Math.random()-.5)*4,DUN.z+14,Math.PI); setSky('dungeon'); Build.toggle(false);
    toast(rejoin?'⚔️ 다시 돌아왔어요! 친구들과 함께 싸워요.':'⚔️ 던전에 들어왔어요! E를 누르면 공격 문제가 나와요.',4000);
    UI.dungeonHud();
  },
  leave(reason='exit'){
    if(!this.inside) return; const uid=GS.me.uid, r=this.room;
    if(r?.state==='running'&&r.players?.[uid]) this.leftRun={runId:r.runId,hp:this.hp,dmg:r.players[uid].dmg||0};
    FB.remove(`dungeon/room/players/${uid}`); FB.cancelDisconnect(`dungeon/room/players/${uid}`);
    this.inside=false; clearTimeout(this.leaveT); setSky('village'); teleport(0,5.5,Math.PI); UI.close(); UI.dungeonHud();
    if(reason==='exit') toast('🏘️ 마을로 돌아왔어요. 끝까지 함께 있어야 보상을 받을 수 있어요!');
  },
  faint(){
    GS.inv.faintUntil=FB.now()+DG.faintCooldown; GS.change(); this.leftRun=null;
    this.leave('faint'); toast('😵 기절했어요! 마을에서 1분 쉬고 다시 도전해요.',4500); beep(150,.4,'sawtooth',.06);
  },
  aliveMonsters(){ return Object.entries(this.room?.monsters||{}).filter(([,m])=>m.hp>0); },
  target(){ const a=this.aliveMonsters(); if(!a.length) return null; a.sort((x,y)=>x[1].hp-y[1].hp); return {id:a[0][0],...a[0][1]}; },
  async attack(type,q,ok){
    const r=this.room; if(!this.inside||r?.state!=='running') return {msg:'싸움이 끝났어요.'};
    if(!ok){ this.combo=0; const tg=this.target(); const dmg=Math.round((tg?MONSTER_TYPES[tg.type].atk:5)*1.5); this.hurt(dmg); Learn.miss(q.id);
      return {msg:`앗! 틀려서 몬스터에게 ${dmg}만큼 맞았어요. 콤보가 사라졌어요.`,bad:true}; }
    const tg=this.target(); if(!tg) return {msg:'다음 웨이브를 기다려요!'};
    const mult=Math.min(2,1+.15*this.combo); const dmg=Math.round(ATTACKS[type].dmg(q)*mult*(Growth.hasPet('pet_owl')?1.1:1)); this.combo++;
    const res=await FB.transaction(`dungeon/room/monsters/${tg.id}/hp`,cur=>(typeof cur!=='number'||cur<=0)?undefined:Math.max(0,cur-dmg)).catch(()=>({committed:false}));
    if(res.committed){ FB.inc(`dungeon/room/players/${GS.me.uid}/dmg`,dmg); Bus.emit('learn',{kind:'quiz'}); player.userData.swing=.3; tune([700,900]);
      const m=this.meshes[tg.id]; if(m){ burst(m.position.x,1.5,m.position.z,0xffc93c,12); } }
    this.checkWave();
    return {msg:`${MONSTER_TYPES[tg.type].name}에게 ${dmg} 피해!${mult>1?` (콤보 x${mult.toFixed(2)})`:''}`};
  },
  async checkWave(){
    const r=this.room; if(!r||r.state!=='running') return;
    await FB.transaction('dungeon/room',cur=>{
      if(!cur||cur.state!=='running') return; const t=FB.now();
      if(Object.values(cur.monsters||{}).some(m=>m.hp>0)) return;
      if(cur.wave>=WAVES.length){ cur.state='cleared'; cur.clearedAt=t; cur.cooldownUntil=t+DG.roomCooldown; }
      else { cur.wave++; cur.monsters=this.spawnWave(cur.wave,Object.keys(cur.players||{}).length); }
      cur.updatedAt=t; return cur;
    }).catch(()=>{});
  },
  async checkTimeout(){
    await FB.transaction('dungeon/room',cur=>{ if(!cur||cur.state!=='running'||FB.now()<cur.endsAt) return; cur.state='failed'; cur.cooldownUntil=FB.now()+DG.roomCooldown; return cur; }).catch(()=>{});
  },
  hurt(n){ this.hp=Math.max(0,this.hp-n); hurtFlash(); beep(200,.12,'sawtooth',.05); UI.dungeonHud(); this.sendHp(true); if(this.hp<=0) this.faint(); },
  sendHp(force){ const t=performance.now(); if(!force&&t-this.lastHpSend<1000) return; this.lastHpSend=t; if(this.inside) FB.set(`dungeon/room/players/${GS.me.uid}/hp`,this.hp).catch(()=>{}); },
  onRoom(v){
    this.room=v; this.syncMeshes();
    if(this.inside){
      const me=v?.players?.[GS.me.uid];
      if(v?.state==='cleared'&&this.claimedRun!==v.runId){ this.claimedRun=v.runId; this.reward(v); }
      else if(v?.state==='failed'&&this.claimedRun!==v.runId){ this.claimedRun=v.runId; toast('⌛ 시간이 다 됐어요! 도깨비 대왕이 도망갔어요. 다음엔 더 빨리!',5000); this.leaveT=setTimeout(()=>this.leave('fail'),4000); }
      else if(v?.state==='running'&&!me){ this.inside=false; setSky('village'); teleport(0,5.5,Math.PI); toast('던전 방이 새로 열려서 마을로 나왔어요.'); }
    }
    UI.dungeonHud(); if(UI.modal==='battle') UI.render();
  },
  reward(v){
    const me=v.players?.[GS.me.uid]; if(!me||!(me.dmg>0)||GS.inv.dungeonRuns[v.runId]){ this.leaveT=setTimeout(()=>this.leave('clear'),6000); return; }
    GS.inv.dungeonRuns[v.runId]=true; const ks=Object.keys(GS.inv.dungeonRuns); if(ks.length>20) delete GS.inv.dungeonRuns[ks[0]];
    const top=Object.entries(v.players||{}).sort((a,b)=>(b[1].dmg||0)-(a[1].dmg||0))[0]?.[0]===GS.me.uid;
    // [2차] 드롭표(BALANCE.dungeonDrops)에서 딱 하나. 이미 가진 장비·펫이면 💎10으로 바꿔 줘요.
    // ⚠ TODO(서버): 드롭 추첨과 지급은 Cloud Functions(onCall: claimDungeon)로 옮겨야 조작을 막을 수 있어요.
    GS.inv.claims['dg:'+v.runId]=FB.now();
    const items={...BALANCE.dungeonMats}; if(Math.random()<.5) items.shard=(items.shard||0)+1;
    const r={coins:40+Math.min(40,Math.round(me.dmg/20)),wood:8,stone:8,score:50,items};
    const dropId=rollDrop(BALANCE.dungeonDrops,top?1.5:1); let drop=null;
    if(dropId){ const Dd=ITEM_DEFS[dropId];
      if(isUnique(dropId)&&GS.count(dropId)>0){ r.gems=10; drop={...Dd,dup:true}; }
      else { if(Dd.store==='rares') r.rare=dropId; else items[dropId]=(items[dropId]||0)+1; drop=Dd; } }
    GS.grant(r); GS.inv.dungeonCooldown=FB.now()+DG.personalCooldown; GS.change();
    Bus.emit('learn',{kind:'dungeonClear'}); Bus.emit('learn',{kind:'loot',id:'iron',n:items.iron||0}); if(items.shard) Bus.emit('learn',{kind:'loot',id:'shard',n:items.shard});
    if(drop&&!drop.dup&&['rare','epic'].includes(drop.rarity)) Announce.rare(drop);
    tune([784,988,1175,1568,2093]); UI.open('dgresult',{r,dmg:me.dmg,top,drop});
    this.leaveT=setTimeout(()=>this.leave('clear'),9000);
  },
  update(dt,now){
    for(const id in this.meshes){ const m=this.meshes[id]; const u=m.userData; u.t=(u.t||0)+dt;
      m.position.y=u.dead?Math.max(-3,m.position.y-dt*3):Math.abs(Math.sin(u.t*3))*.3;
      if(u.wing) { u.wing[0].rotation.z=Math.sin(u.t*14)*.7; u.wing[1].rotation.z=-Math.sin(u.t*14)*.7; }
      if(u.flash>0){ u.flash-=dt; m.scale.setScalar(u.base*(1+u.flash*.6)); } else m.scale.setScalar(u.base); }
    if(!this.inside||this.room?.state!=='running') return;
    if(now>this.nextHit){ this.nextHit=now+DG.attackEvery; const atk=Math.min(15,this.aliveMonsters().reduce((s,[,m])=>s+MONSTER_TYPES[m.type].atk,0)); if(atk) this.hurt(atk); }
    if(FB.now()>this.room.endsAt) this.checkTimeout();
    this.sendHp(false);
  },
  makeMonsterMesh(type){
    const T=MONSTER_TYPES[type], g=new THREE.Group(), c=T.color; const eye=mat(0xffffff), pupil=mat(0x1b1b1b);
    if(type==='slime'){ box(1.4,1.1,1.4,c,0,.55,0,g); box(1.1,.2,1.1,new THREE.Color(c).offsetHSL(0,0,.1).getHex(),0,1.15,0,g); }
    else if(type==='bat'){ box(.9,.8,.8,c,0,1.4,0,g); const w1=box(1,.1,.6,0x5b35b8,-.9,1.5,0,g), w2=box(1,.1,.6,0x5b35b8,.9,1.5,0,g); g.userData.wing=[w1,w2]; }
    else if(type==='golem'){ box(1.4,1.3,1,c,0,1.3,0,g); box(.9,.8,.8,c,0,2.3,0,g); box(.45,1.2,.45,c,-.95,1.2,0,g); box(.45,1.2,.45,c,.95,1.2,0,g); box(.5,.7,.5,c,-.4,.35,0,g); box(.5,.7,.5,c,.4,.35,0,g); }
    else { box(1.6,1.6,1.2,c,0,1.6,0,g); box(1.2,1,1,0xc23a31,0,2.9,0,g); mesh(new THREE.ConeGeometry(.18,.6,6),mat(0xfff1d6),-.4,3.6,0,g); mesh(new THREE.ConeGeometry(.18,.6,6),mat(0xfff1d6),.4,3.6,0,g);
      box(.5,1.3,.5,c,-1.1,1.5,0,g); box(.5,1.3,.5,c,1.1,1.5,0,g); box(.6,.8,.6,c,-.45,.4,0,g); box(.6,.8,.6,c,.45,.4,0,g); }
    const ey=type==='slime'?.7:type==='bat'?1.5:type==='golem'?2.35:2.95, ez=type==='slime'?.71:type==='bat'?.41:type==='golem'?.41:.51;
    [-.22,.22].forEach(x=>{ mesh(new THREE.BoxGeometry(.22,.22,.04),type==='boss'?new THREE.MeshBasicMaterial({color:0xffe14a}):eye,x,ey,ez,g); if(type!=='boss') mesh(new THREE.BoxGeometry(.1,.12,.02),pupil,x,ey,ez+.03,g); });
    g.userData.base=T.size; g.scale.setScalar(T.size); return g;
  },
  hpSprite(m,cur,max,name){
    const c=document.createElement('canvas'); c.width=256; c.height=64; const x=c.getContext('2d');
    x.fillStyle='rgba(21,13,36,.9)'; roundRect(x,0,0,256,64,14); x.fill(); x.fillStyle='#fff8e6'; x.font='24px Jua'; x.textAlign='center'; x.fillText(name,128,26);
    x.fillStyle='#3a2a55'; roundRect(x,14,36,228,16,8); x.fill(); x.fillStyle='#ff6b8b'; roundRect(x,14,36,Math.max(8,228*cur/max),16,8); x.fill();
    const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;

    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false})); s.scale.set(2.4/m.userData.base,.6/m.userData.base,1);
    s.position.y=(m.userData.type==='boss'?4.3:m.userData.type==='golem'?3.3:2.4); m.add(s); m.userData.hp=s;
  },
  syncMeshes(){
    const mons=this.room?.state==='running'?(this.room.monsters||{}):{};
    for(const id in this.meshes) if(!mons[id]){ scene.remove(this.meshes[id]); this.meshes[id].traverse(o=>{ if(o.isSprite) disposeSprite(o); }); delete this.meshes[id]; delete this.lastHp[id]; }
    const ids=Object.keys(mons).sort();
    ids.forEach((id,i)=>{ const md=mons[id]; let m=this.meshes[id];
      if(!m){ m=this.makeMonsterMesh(md.type); m.userData.type=md.type; const n=ids.length, boss=md.type==='boss';
        m.position.set(DUN.x+(boss?0:(i-(n-1)/2)*4.5),0,DUN.z-(boss?10:8)); scene.add(m); this.meshes[id]=m; this.lastHp[id]=md.hp; this.hpSprite(m,md.hp,md.max,MONSTER_TYPES[md.type].name); }
      if(this.lastHp[id]!==md.hp){ const d=this.lastHp[id]-md.hp; if(d>0&&this.inside){ popAt(m.position.x,3.5*m.userData.base,m.position.z,'-'+d,'hit'); m.userData.flash=.25; }
        this.lastHp[id]=md.hp; this.hpSprite(m,md.hp,md.max,MONSTER_TYPES[md.type].name); }
      m.userData.dead=md.hp<=0; });
  }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §12 BUILDING SYSTEM (개인 섬 배정, 격자 건축, 생산)            ║
   ╚══════════════════════════════════════════════════════════════╝
   plots/{idx} = uid  (빈 섬만 transaction으로 차지)
   builds/{uid}/{bid} = {t,i,j,r,at,p}   i,j = 왼쪽 위 칸, r = 0~3 (90°씩), p = 마지막으로 거둔 시각
   ⚠ TODO(서버): 비용 차감과 건물 수 제한은 지금 클라이언트가 확인해요. Cloud Functions(onCall: build)로 옮길 수 있어요. */
const RESERVED=new Set(['7,14','8,14','7,15','8,15']); // 선착장 칸은 비워 둬요
const Build={
  plotOwner:{}, myPlot:null, data:{}, objs:{}, occ:{}, mode:false, sel:'tree', rot:0, demolish:false, ghost:null, ghostKey:'', cursor:null,
  prodIts:[], lastLod:0, lastReady:0,
  // [3차] 섬마다 따로 구독해요. 방문 허락이 없으면 보안 규칙이 읽기를 막고, 그 섬은 🔒로 보여요.
  subs:{}, locked:{}, visitSeen:{},
  init(){ FB.on('plots',v=>this.onPlots(v||{})); },
  subscribeOwners(){
    for(const uid of Object.keys(this.plotOwner)){ if(this.subs[uid]) continue;
      this.subs[uid]=FB.on('builds/'+uid,v=>{ this.locked[uid]=false; this.data={...this.data,[uid]:v||{}}; this.onBuilds(this.data); this.signFor(uid); },
        ()=>{ this.locked[uid]=true; this.subs[uid]=null; this.data={...this.data,[uid]:{}}; this.onBuilds(this.data); this.signFor(uid); }) || (()=>{}); }
    for(const uid in this.subs) if(this.plotOwner[uid]===undefined){ this.subs[uid]?.(); delete this.subs[uid]; }
  },
  resubscribe(uid){ this.subs[uid]?.(); delete this.subs[uid]; this.subscribeOwners(); },
  resubscribeFriendsOnly(){ for(const uid of Object.keys(this.plotOwner)) if(this.locked[uid]||(GS.profiles[uid]?.visit||'friends')==='friends') this.resubscribe(uid); },
  signFor(uid){ const idx=this.plotOwner[uid]; if(idx!==undefined) drawPlotSign(plots[idx],GS.profiles[uid]?.name||'모험가',this.locked[uid]); },
  onPlots(v){
    this.plotOwner={}; this.myPlot=null;
    plots.forEach(P=>{ const uid=v[P.idx]||null; if(P.owner!==uid){ P.owner=uid; drawPlotSign(P,uid?(GS.profiles[uid]?.name||'모험가'):null); }
      if(uid) this.plotOwner[uid]=P.idx; if(uid&&uid===GS.me.uid) this.myPlot=P.idx; });
    this.subscribeOwners(); this.onBuilds(this.data,true); UI.hud();
  },
  refreshSigns(){ plots.forEach(P=>{ if(!P.owner) return; const u=P.owner, v=GS.profiles[u]?.visit||'friends';
    if(this.visitSeen[u]!==undefined&&this.visitSeen[u]!==v) this.resubscribe(u); this.visitSeen[u]=v; drawPlotSign(P,GS.profiles[u]?.name||'모험가',this.locked[u]); }); },
  foot(t,r){ const B=BUILD_TYPES[t]; return r%2?{w:B.d,d:B.w}:{w:B.w,d:B.d}; },
  onBuilds(v,force=false){
    this.data=v;
    const seen=new Set();
    for(const uid in v){ const idx=this.plotOwner[uid]; if(idx===undefined) continue; seen.add(uid);
      const P=plots[idx]; const cur=v[uid]||{}; const objs=this.objs[uid]||(this.objs[uid]={});
      for(const bid in objs) if(!cur[bid]||force||objs[bid].key!==JSON.stringify(cur[bid])){ this.removeObj(uid,bid,P); }
      for(const bid in cur){ if(objs[bid]) continue; const b=cur[bid]; if(!BUILD_TYPES[b.t]) continue; this.addObj(uid,bid,b,P); }
      this.rebuildOcc(uid); }
    for(const uid in this.objs) if(!seen.has(uid)){ const idx=this.plotOwner[uid]; for(const bid in this.objs[uid]) this.removeObj(uid,bid,idx!==undefined?plots[idx]:null); delete this.objs[uid]; delete this.occ[uid]; }
    this.rebuildProduction();
  },
  addObj(uid,bid,b,P){
    const {w,d}=this.foot(b.t,b.r); const g=this.makeMesh(b.t,GS.profiles[uid]?.color||'#ff6b8b');
    const lx=-8+b.i+w/2, lz=-8+b.j+d/2; g.position.set(lx,0,lz); g.rotation.y=b.r*Math.PI/2; P.builds.add(g);
    const B=BUILD_TYPES[b.t]; if(B.col){ const [wx,wz]=plotToWorld(P,lx,lz); collide(wx,wz,B.col,`b:${uid}:${bid}`); }
    this.objs[uid][bid]={g,key:JSON.stringify(b),lx,lz};
  },
  removeObj(uid,bid,P){ const o=this.objs[uid]?.[bid]; if(!o) return; o.g.parent?.remove(o.g); o.g.traverse(c=>{ if(c.isSprite) disposeSprite(c); }); removeColliders(`b:${uid}:${bid}`); delete this.objs[uid][bid]; },
  rebuildOcc(uid){ const m=new Map(); for(const [bid,b] of Object.entries(this.data[uid]||{})){ if(!BUILD_TYPES[b.t]) continue; const {w,d}=this.foot(b.t,b.r); for(let x=0;x<w;x++) for(let z=0;z<d;z++) m.set(`${b.i+x},${b.j+z}`,bid); } this.occ[uid]=m; },
  canPlace(t,i,j,r){
    const {w,d}=this.foot(t,r), occ=this.occ[GS.me.uid]||new Map();
    if(i<0||j<0||i+w>16||j+d>16) return '섬 밖으로 나가요';
    for(let x=0;x<w;x++) for(let z=0;z<d;z++){ const k=`${i+x},${j+z}`; if(occ.has(k)) return '다른 건물과 겹쳐요'; if(RESERVED.has(k)) return '선착장은 비워 둬요'; }
    if(Object.keys(this.data[GS.me.uid]||{}).length>=LIMITS.maxBuildsPerPlot) return `섬이 꽉 찼어요 (최대 ${LIMITS.maxBuildsPerPlot}개)`;
    const B=BUILD_TYPES[t]; if(B.rare||B.item){ if(!(GS.count(t)>0)) return '가지고 있는 장식이 없어요'; } else if(!GS.canAfford(B.cost)) return '재료가 모자라요';
    return null;
  },
  async claimPlot(){
    if(this.myPlot!==null) return this.myPlot;
    for(const P of plots){ if(P.owner) continue;
      const res=await FB.transaction('plots/'+P.idx,cur=>cur?undefined:GS.me.uid).catch(()=>({committed:false}));
      if(res.committed){ this.myPlot=P.idx; toast(`🏝️ ${P.idx+1}번 섬이 내 섬이 되었어요!`,3500); tune([523,784,1047]); return P.idx; } }
    toast('섬이 모두 주인을 찾았어요. 촌장님께 말씀드려요!'); return null;
  },
  myP(){ return this.myPlot!==null?plots[this.myPlot]:null; },
  onMyPlot(){ const P=this.myP(); return P&&plotAt(pos.x,pos.z)===P; },
  async goHome(){
    if(Maps.mode) Maps.close(true); // [3차]
    if(Dungeon.inside) return toast('던전에서는 섬으로 갈 수 없어요. 먼저 나가요!');
    const idx=await this.claimPlot(); if(idx===null) return; const P=plots[idx];
    const [x,z]=plotToWorld(P,0,7.4); teleport(x,z,Math.PI-P.a); UI.hud();
  },
  goVillage(){ if(Maps.mode) Maps.close(true); this.toggle(false); teleport(0,5.5,Math.PI); UI.hud(); },
  toggle(on){
    if(on&&!this.onMyPlot()){ toast('내 섬에서만 건축할 수 있어요.'); return; }
    this.mode=!!on; document.body.classList.toggle('building',this.mode||Maps.mode==='edit');
    const P=this.myP(); if(P) P.grid.visible=this.mode;
    if(!this.mode&&this.ghost){ this.ghost.parent?.remove(this.ghost); this.ghost=null; this.ghostKey=''; }
    this.demolish=false; UI.buildBar(); UI.hud();
  },
  select(t){ this.sel=t; this.demolish=false; UI.buildBar(); },
  rotate(){ this.rot=(this.rot+1)%4; beep(600,.04,'triangle',.05); },
  setDemolish(v){ this.demolish=v; UI.buildBar(); },
  cursorCell(){
    const P=this.myP(); if(!P) return null; let lx,lz;
    if(performance.now()-mouse.t<2500){ const rc=new THREE.Raycaster(); rc.setFromCamera(mouse.ndc,camera);
      const hit=new THREE.Vector3(); if(!rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),hit)) return null; [lx,lz]=worldToPlot(P,hit.x,hit.z); }
    else { const fx=pos.x+Math.sin(facing)*3, fz=pos.z+Math.cos(facing)*3; [lx,lz]=worldToPlot(P,fx,fz); }
    if(Math.abs(lx)>8.5||Math.abs(lz)>8.5) return null;
    const cx=Math.floor(lx+8), cz=Math.floor(lz+8);
    if(this.demolish) return {i:cx,j:cz};
    const {w,d}=this.foot(this.sel,this.rot); return {i:cx-Math.floor((w-1)/2),j:cz-Math.floor((d-1)/2)};
  },
  update(now){
    if(now-this.lastLod>500){ this.lastLod=now; plots.forEach(P=>{ P.group.visible=Math.hypot(pos.x-P.cx,pos.z-P.cz)<LIMITS.plotViewDist; }); }
    if(now-this.lastReady>2000){ this.lastReady=now; this.updateReadySigns(); }
    if(!this.mode) return;
    if(!this.onMyPlot()){ this.toggle(false); return; }
    const P=this.myP(), c=this.cursorCell(); this.cursor=c;
    if(this.demolish){ if(this.ghost){ this.ghost.parent?.remove(this.ghost); this.ghost=null; this.ghostKey=''; }
      const bid=c&&this.occ[GS.me.uid]?.get(`${c.i},${c.j}`); this.demolishTarget=bid||null;
      UI.prompt(bid?`<kbd>E</kbd> ${BUILD_TYPES[this.data[GS.me.uid][bid].t].name} 철거하기 (재료 절반 돌려받기)`:'철거할 건물을 가리켜요'); return; }
    const key=this.sel+'|'+this.rot;
    if(this.ghostKey!==this.sel){ if(this.ghost) this.ghost.parent?.remove(this.ghost); this.ghost=this.makeMesh(this.sel,GS.me.color,true); P.builds.add(this.ghost); this.ghostKey=this.sel; }
    if(!c){ this.ghost.visible=false; UI.prompt('섬 위를 가리키면 미리보기가 보여요'); return; }
    const {w,d}=this.foot(this.sel,this.rot); this.ghost.visible=true; this.ghost.position.set(-8+c.i+w/2,0,-8+c.j+d/2); this.ghost.rotation.y=this.rot*Math.PI/2;

  },
  action(){
    const c=this.cursor; if(!c) return; const uid=GS.me.uid;
    if(this.demolish){ const bid=this.demolishTarget; if(!bid) return; const b=this.data[uid][bid], B=BUILD_TYPES[b.t];
      if(B.rare||B.item){ GS.addItem(b.t,1); GS.change(); } else { const back={}; for(const [k,v] of Object.entries(B.cost)) back[k]=Math.floor(v/2); GS.grant(back); }
      FB.remove(`builds/${uid}/${bid}`); beep(240,.1,'square',.05); toast(`🧹 ${B.name}을(를) 치웠어요.`); return; }
    const why=this.canPlace(this.sel,c.i,c.j,this.rot); if(why){ toast('🚫 '+why); beep(180,.15,'sawtooth',.04); return; }

  rebuildProduction(){

    for(const [bid,b] of Object.entries(this.data[uid]||{})){ const B=BUILD_TYPES[b.t]; if(!B?.produce) continue; const o=this.objs[uid]?.[bid]; if(!o) continue;

        label:()=>{ const left=(b.p||0)+B.produce.every-FB.now(); return left>0?`${B.emoji} ${B.name}에서 만드는 중… ${fmtClock(left)}`:`${B.emoji} ${B.name} 결과 거두기 (${B.produce.what})`; },
        use:()=>this.collect(bid,b)})); }
  },
  collect(bid,b){

    else { const need=Object.values(WORDS).filter(w=>!GS.inv.words[w.id]).flatMap(w=>missingLetters(w)); const src=need.length?need:ALL_LETTERS;
      r={letters:Array.from({length:5},()=>pick(src)),score:5,coins:3}; }
    GS.grant(r); b.p=now; FB.update(`builds/${GS.me.uid}/${bid}`,{p:now});
    tune([659,880,1047]); toast(`${B.emoji} ${B.name}: ${r.letters.join(' ')} ${r.stone?'🪨'+r.stone:''}${r.coins?' 🪙'+r.coins+' ⭐'+r.score:''}`,3500);
    Bus.emit('learn',{kind:'lab'});
  },
  updateReadySigns(){
    const uid=GS.me.uid; for(const [bid,o] of Object.entries(this.objs[uid]||{})){ const b=this.data[uid]?.[bid], B=BUILD_TYPES[b?.t]; if(!B?.produce) continue;
      const ready=(b.p||0)+B.produce.every<=FB.now(); if(ready&&!o.ready){ const s=textSprite('✨ 다 됐어요!',{font:'44px Jua',h:.6,bg:'rgba(201,139,0,.92)'}); s.position.y=4.2; o.g.add(s); o.ready=s; }
      else if(!ready&&o.ready){ o.g.remove(o.ready); disposeSprite(o.ready); o.ready=null; } }
  },
  makeMesh(t,color,ghost=false){

    if(t==='tree'){ add(new THREE.CylinderGeometry(.18,.25,1.4,8),0x8a5a36,0,.7,0); add(new THREE.IcosahedronGeometry(.8,0),0x4fb35a,0,1.9,0); }
    else if(t==='fence'){ bx(.14,.9,.14,0xb07a45,-.43,.45,0); bx(.14,.9,.14,0xb07a45,.43,.45,0); bx(1,.12,.08,0xd9a066,0,.65,0); bx(1,.12,.08,0xd9a066,0,.35,0); }
