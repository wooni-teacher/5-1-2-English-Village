    else if(t==='mine'){ add(new THREE.DodecahedronGeometry(.8,0),0x7d8a9c,-.3,.6,-.2); add(new THREE.DodecahedronGeometry(.6,0),0x8d97a6,.5,.45,.3); add(new THREE.OctahedronGeometry(.3,0),0xffc93c,.1,1.35,0); bx(.8,.4,.5,0x6b4226,.4,.25,.7); }
    else if(t==='lab'){ bx(2.6,1.8,2.6,0xe8f4ff,0,.9,0); add(new THREE.SphereGeometry(1.1,16,10,0,Math.PI*2,0,Math.PI/2),0x3cc6b4,0,1.8,0); bx(.08,1,.08,0x999999,.8,3,0); add(new THREE.OctahedronGeometry(.25,0),0xffc93c,.8,3.6,0); bx(.8,1.2,.08,0x1d3a4a,0,.6,1.31); }
    else if(t==='statue'){ bx(.8,.4,.8,0x9aa0a8,0,.2,0); bx(.55,.9,.45,0xb8bec6,0,.85,0); bx(.45,.45,.45,0xb8bec6,0,1.55,0); }
    else if(t==='fountain'){ add(new THREE.CylinderGeometry(.95,1,.4,16),0xb8b0a0,0,.2,0); add(new THREE.CylinderGeometry(.8,.8,.05,16),0x5fc6ee,0,.42,0); add(new THREE.CylinderGeometry(.15,.2,1,8),0xb8b0a0,0,.8,0); [0xff6b8b,0xffc93c,0x3cc6b4,0x9b8cff].forEach((c,q)=>add(new THREE.SphereGeometry(.14,8,6),c,Math.sin(q*1.57)*.35,1.35,Math.cos(q*1.57)*.35)); }
    else if(t==='dragon'){ bx(1.2,.8,.7,0x2ecc71,0,.6,0); bx(.6,.6,.6,0x2ecc71,.8,1.2,0); bx(.2,.2,.2,0xffc93c,1.1,1.3,.2); const w1=bx(.8,.08,.6,0x27ae60,-.1,1.1,.55); w1.rotation.x=.5; const w2=bx(.8,.08,.6,0x27ae60,-.1,1.1,-.55); w2.rotation.x=-.5; bx(.8,.2,.2,0x2ecc71,-.9,.5,0); }
    else if(t==='crystal'){ const m=add(new THREE.OctahedronGeometry(.45,0),0x7fd7ff,0,1.1,0); m.scale.set(1,2,1); bx(.7,.25,.7,0x9aa0a8,0,.12,0); }
    else if(t==='lamp'){ add(new THREE.CylinderGeometry(.07,.09,2.2,8),0x3d3d48,0,1.1,0); const l=new THREE.Mesh(new THREE.BoxGeometry(.4,.35,.4),new THREE.MeshBasicMaterial({color:0xffe68a})); l.position.y=2.35; g.add(l); bx(.5,.08,.5,0x3d3d48,0,2.56,0); }
    else if(t==='bench'){ bx(1.8,.12,.5,0xb07a45,0,.5,0); bx(1.8,.5,.1,0xb07a45,0,.8,-.22); [-.75,.75].forEach(x=>bx(.1,.5,.45,0x6b4226,x,.25,0)); }

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §16 [2차] REWARDS — 모든 보상은 rewardId로 딱 한 번만           ║
   ╚══════════════════════════════════════════════════════════════╝
   inventory.claims[rewardId] = 받은 시각. 예) att:20718, daily:20718:w3, npc:toto1, tut:2, dg:r1abc
   ⚠ TODO(서버): claims와 보상 지급을 Cloud Functions(onCall: claimReward)로 옮기면 조작을 막을 수 있어요. */
function rewardText(r={}){
  const p=[]; if(r.exp) p.push(`✨경험치 ${r.exp}`);
  for(const k of ['coins','gems','wood','stone']) if(r[k]) p.push(`${RES_NAMES[k]}${r[k]}`);
  if(r.score) p.push(`⭐${r.score}`);
  for(const [id,n] of Object.entries(r.items||{})) p.push(`${ITEM_DEFS[id]?.emoji||'🎁'}${ITEM_DEFS[id]?.name||id}${n>1?' ×'+n:''}`);
  if(r.rare) p.push(`${BUILD_TYPES[r.rare].emoji}${BUILD_TYPES[r.rare].name}`);
  if(r.letters?.length) p.push('알파벳 '+r.letters.join(' '));
  return p.join('  ');
}
const Rewards={
  give(id,r,label){
    if(!GS.isStudent()) return false;
    if(id){ if(GS.inv.claims[id]) return false; GS.inv.claims[id]=FB.now(); }
    const {exp,...rest}=r||{}; GS.grant(rest); if(exp) Growth.addExp(exp);
    if(label) toast(`${label}<br><small>${rewardText(r)}</small>`,3800);
    GS.change(); return true;
  },
  prune(){ const cut=FB.now()-30*86400e3; for(const [k,t] of Object.entries(GS.inv.claims)) if(/^(att|daily):/.test(k)&&t<cut) delete GS.inv.claims[k]; }
};
function rollDrop(table,mult=1){ let r=Math.random(); for(const e of table){ const p=e.p*mult; if(r<p) return e.id; r-=p; } return null; }

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §17 [2차] GROWTH — 레벨·경험치·칭호·기운·장비 능력치           ║
   ╚══════════════════════════════════════════════════════════════╝ */
const Growth={
  need(L){ return BALANCE.needExp(L); },
  title(L){ let t=TITLES[0][1]; for(const [lv,n] of TITLES) if(L>=lv) t=n; return t; },
  addExp(n){
    if(!GS.isStudent()||!n) return; const inv=GS.inv; inv.exp+=Math.round(n); let up=0;
    while(inv.exp>=this.need(inv.level)&&inv.level<99){ inv.exp-=this.need(inv.level); inv.level++; up++; inv.gems+=BALANCE.levelGems; }
    if(up){ inv.title=this.title(inv.level); this.fx(inv.level,up); } GS.change();
  },
  fx(L,up){
    const el=$('#lvup'); el.innerHTML=`<div class="lv-big">레벨 업!</div><div class="lv-sub">Lv.${L} ${esc(this.title(L))}  💎+${BALANCE.levelGems*up}</div>`;
    el.classList.remove('hidden','go'); void el.offsetWidth; el.classList.add('go'); clearTimeout(this._t); this._t=setTimeout(()=>el.classList.add('hidden'),2600);
    tune([523,659,784,1047,1319]); if(player) [0xffc93c,0x3cc6b4,0xff6b8b].forEach((c,i)=>setTimeout(()=>burst(pos.x,pos.y+1.5,pos.z,c,16),i*150));
    if(TITLES.some(([lv])=>lv===L)) toast(`🏅 새 칭호 「${esc(this.title(L))}」를 얻었어요!`,4000);
  },
  pick(){ return ITEM_DEFS[GS.inv?.equipped?.pickaxe]||ITEM_DEFS.pick_wood; },
  pickHits(){ return this.pick().stats.hits; },
  bagCap(){ return (ITEM_DEFS[GS.inv.equipped.bag]||ITEM_DEFS.bag_basic).stats.cap; },
  letterTotal(){ return Object.values(GS.inv.letters).reduce((a,b)=>a+b,0); },
  hasPet(id){ return GS.inv?.equipped?.pet===id; }
};
const Stamina={
  max:()=>BALANCE.staminaMax,
  value(){ const inv=GS.inv; if(!inv) return 0; const regen=Math.floor(Math.max(0,FB.now()-(inv.staminaAt||0))/BALANCE.staminaRegenMs); return Math.min(this.max(),(inv.stamina??this.max())+regen); },
  set(v){ GS.inv.stamina=Math.max(0,Math.min(this.max(),Math.round(v))); GS.inv.staminaAt=FB.now(); GS.change(); },
  spend(n){ const v=this.value(); if(v<n) return false; this.set(v-n); return true; },
  add(n){ this.set(this.value()+n); }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §18 [2차] PROGRESS — 학습 행동 통계 → 경험치·튜토리얼·추천 활동 ║
   ╚══════════════════════════════════════════════════════════════╝
   inventory.stats = {mined, words, wordsNew, sentences, quizRight, says, stoneGot, ironGot, shardGot,
                      builds, trees, labs, labCollect, eventJoins, events, dungeonJoins, dungeonWins} */
const Progress={
  inc(k,n=1){ GS.inv.stats[k]=(GS.inv.stats[k]||0)+n; },
  init(){ Bus.on('learn',d=>this.on(d)); },
  on(d){
    if(!GS.isStudent()) return; const E=BALANCE.exp;
    switch(d.kind){
      case 'mine': this.inc('mined'); Growth.addExp(E.mine); break;
      case 'word': this.inc('words'); if(d.first) this.inc('wordsNew'); Growth.addExp((d.first?E.wordNew:E.wordRepeat)*(Growth.hasPet('pet_sprite')?1.2:1)); break;
      case 'sentence': this.inc('sentences'); Growth.addExp(d.first?E.sentNew:E.sentRepeat); break;
      case 'quiz': this.inc('quizRight'); Growth.addExp(E.quiz); break;
      case 'say': this.inc('says'); Growth.addExp(E.say); break;
      case 'loot': this.inc(d.id+'Got',d.n||1); break;
      case 'build': this.inc('builds'); if(d.t==='tree') this.inc('trees'); if(d.t==='lab') this.inc('labs'); break;
      case 'lab': this.inc('labCollect'); break;
      case 'eventJoin': this.inc('eventJoins'); break;
      case 'eventReward': this.inc('events'); Growth.addExp(d.success?E.eventWin:E.eventJoin); break;
      case 'dungeonJoin': this.inc('dungeonJoins'); break;
      case 'dungeonClear': this.inc('dungeonWins'); Growth.addExp(E.dungeonClear); break;
      default: return;
    }
    Tutorial.check(); Daily.check(); GS.change();
  }
};
const Tutorial={
  ensure(){ const t=GS.inv.tutorial; if(t.step==null){ t.step=0; t.base=this.statAt(0); GS.change(); } },
  statAt(i){ const s=TUTORIAL[i]?.stat; return s?(GS.inv.stats[s]||0):0; },
  cur(){ const t=GS.inv?.tutorial; return !t||t.done||t.step==null?null:TUTORIAL[t.step]; },
  progress(){ const T=this.cur(); if(!T) return null; const t=GS.inv.tutorial;
    return T.report?{v:t.reported?1:0,n:1}:{v:Math.max(0,Math.min(T.n,(GS.inv.stats[T.stat]||0)-(t.base||0))),n:T.n}; },
  check(){
    const T=this.cur(); if(!T) return; const p=this.progress(); if(p.v<p.n) return;
    const t=GS.inv.tutorial, i=t.step; Rewards.give('tut:'+i,T.reward,`🎓 튜토리얼 ${i+1}단계 「${T.text}」 완료!`);
    t.step++; t.reported=false;
    if(t.step>=TUTORIAL.length){ t.done=true; toast('🎉 튜토리얼을 모두 마쳤어요! 이제 NPC 친구들의 퀘스트에 도전해요.',5000); }
    else t.base=this.statAt(t.step);
    GS.change();
  },
  report(){ const T=this.cur(); if(!T?.report) return false; GS.inv.tutorial.reported=true; this.check(); return true; },
  skip(){ GS.inv.tutorial.done=true; GS.change(); }
};
const NpcQuests={
  state(q){ return GS.inv.npcQuests[q.id]||null; },
  prog(q){ const s=this.state(q); if(!s) return 0; return Math.max(0,Math.min(q.n,(GS.inv.stats[q.stat]||0)-(s.base||0))); },
  prevDone(q){ if(q.tier===1) return true; const prev=NPC_QUESTS.find(x=>x.npc===q.npc&&x.tier===q.tier-1); return this.state(prev)?.s==='claimed'; },
  lockReason(q){ if(GS.inv.level<q.minLv) return `Lv.${q.minLv}부터 받을 수 있어요`; if(!this.prevDone(q)) return `${TIER_NAMES[q.tier-1]} 퀘스트를 먼저 끝내요`; return null; },
  canAccept(q){ return !this.state(q)&&!this.lockReason(q); },
  accept(q){ if(!this.canAccept(q)) return; GS.inv.npcQuests[q.id]={s:'on',base:GS.inv.stats[q.stat]||0,at:FB.now()}; GS.change(); tune([523,659]); toast(`📜 「${esc(q.title)}」 퀘스트를 받았어요!`); },
  claim(q){ const s=this.state(q); if(!s||s.s!=='on'||this.prog(q)<q.n) return;
    s.s='claimed'; Rewards.give('npc:'+q.id,q.reward,`${NPCS[q.npc].emoji} 「${esc(q.title)}」 완료!`); GS.change(); },
  active(){ return NPC_QUESTS.filter(q=>this.state(q)?.s==='on'); }
};
const kstDay=t=>Math.floor((t+9*3600e3)/86400e3);                 // 한국 시간(UTC+9) 기준 날짜 번호
const kstDate=t=>new Date(t+9*3600e3).toISOString().slice(0,10);
function hashStr(s){ let h=2166136261; for(const c of String(s)) h=Math.imul(h^c.charCodeAt(0),16777619); return h>>>0; }
const Daily={
  day(){ return kstDay(FB.now()); },
  ensure(){
    if(!GS.isStudent()) return; const d=this.day(), D=GS.inv.daily; if(D.day===d&&D.ids?.length) return;
    const rnd=mulberry(d*7919+hashStr(GS.me.uid)); const ids=DAILY_POOL.map(p=>[rnd(),p.id]).sort((a,b)=>a[0]-b[0]).slice(0,3).map(x=>x[1]);
    GS.inv.daily={day:d,ids,base:Object.fromEntries(ids.map(id=>[id,GS.inv.stats[DAILY_POOL.find(p=>p.id===id).stat]||0]))};
    GS.change();
  },
  list(){ const D=GS.inv.daily; return (D.ids||[]).map(id=>{ const P=DAILY_POOL.find(x=>x.id===id); if(!P) return null;
    const v=Math.max(0,Math.min(P.n,(GS.inv.stats[P.stat]||0)-(D.base?.[id]||0))); return {...P,v,done:v>=P.n,claimed:!!GS.inv.claims[`daily:${D.day}:${id}`]}; }).filter(Boolean); },
  check(){
    const D=GS.inv.daily; if(!D.ids||D.day!==this.day()) return; const L=this.list();
    L.forEach(t=>{ if(t.done&&!t.claimed) Rewards.give(`daily:${D.day}:${t.id}`,BALANCE.dailyReward,`☀️ 오늘의 추천 활동 「${t.text}」 완료!`); });
    if(L.length&&L.every(t=>t.done)) Rewards.give(`daily:${D.day}:all`,BALANCE.dailyAllReward,'🌈 오늘의 추천 활동을 모두 끝냈어요!');
  }
};
// 출석: attendance/{uid}/{날짜번호} = {at: 서버 시각}. 보안 규칙이 "이미 있으면 못 씀"과 "서버 시각만 허용"을 확인해요.
const Attendance={
  busy:false, pending:false,
  today(){ return kstDay(FB.now()); },
  claimedToday(){ return GS.inv.attendance.lastDay===this.today(); },
  nextStreak(){ const a=GS.inv.attendance; return a.lastDay===this.today()-1?((a.streak||0)%7)+1:1; },
  async claim(){
    if(this.busy||!GS.isStudent()||this.claimedToday()) return; this.busy=true; UI.render();
    const d=this.today(), uid=GS.me.uid;
    try{
      if(FB.mode==='offline'&&await FB.get(`attendance/${uid}/${d}`)) throw new Error('dup');
      await FB.set(`attendance/${uid}/${d}`,{at:FB.serverTs()});
      const s=this.nextStreak(); GS.inv.attendance={lastDay:d,streak:s,total:(GS.inv.attendance.total||0)+1};
      Rewards.give('att:'+d,ATTEND_REWARDS[s-1],`📅 ${s}일째 출석 도장 쾅!`); tune([659,784,1047]);
    }catch(e){ GS.inv.attendance.lastDay=d; GS.change(); toast('📅 오늘 출석 보상은 이미 받았어요. 내일 또 만나요!'); }
    this.busy=false; if(UI.modal==='attend') UI.render();
  }
};

/* ╔══════════════════════════════════════════════════════════════╗

function makeHat(id){
  const g=new THREE.Group(); const m=(geo,c,x,y,z)=>{ const o=new THREE.Mesh(geo,mat(c)); o.position.set(x,y,z); o.castShadow=true; g.add(o); return o; };
  if(id==='hat_straw'){ m(new THREE.CylinderGeometry(.62,.62,.05,20),0xf2d27a,0,0,0); m(new THREE.CylinderGeometry(.34,.4,.32,16),0xe8c460,0,.18,0); m(new THREE.CylinderGeometry(.41,.41,.07,16),0xff6b8b,0,.07,0); }
  else if(id==='hat_wizard'){ m(new THREE.CylinderGeometry(.58,.58,.05,20),0x5b35b8,0,0,0); m(new THREE.ConeGeometry(.38,1.05,12),0x8a5cf6,0,.55,0); m(new THREE.OctahedronGeometry(.1,0),0xffc93c,.12,.7,.3); }
  else if(id==='hat_cat'){ [-.24,.24].forEach(x=>{ const e=m(new THREE.ConeGeometry(.14,.32,4),0x6b6b6b,x,.12,0); e.rotation.y=Math.PI/4; m(new THREE.ConeGeometry(.07,.18,4),0xffb3c7,x,.1,.05); }); }
  else if(id==='hat_helmet'){ m(new THREE.SphereGeometry(.45,16,10,0,Math.PI*2,0,Math.PI/2),0xffc93c,0,-.05,0); m(new THREE.CylinderGeometry(.1,.1,.1,10),0xfff8e6,0,.12,.42).rotation.x=Math.PI/2; }
  else if(id==='hat_flower'){ const t=m(new THREE.TorusGeometry(.42,.05,6,24),0x3f9e4d,0,.02,0); t.rotation.x=Math.PI/2; [0xff6b8b,0xffc93c,0x9b8cff,0xffffff,0xff9f43].forEach((c,i)=>{ const a=i/5*Math.PI*2; m(new THREE.SphereGeometry(.09,8,6),c,Math.sin(a)*.42,.06,Math.cos(a)*.42); }); }
  else return null;
  g.position.y=2.72; return g;
}
function setHat(av,id){
  const u=av.userData; if(u.hatId===id) return; if(u.hatObj){ av.remove(u.hatObj); u.hatObj=null; } u.hatId=id||null;

}

    [-1,1].forEach(s=>{ const w=new THREE.Mesh(new THREE.BoxGeometry(.36,.22,.02),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.7})); w.position.set(s*.26,.06,-.05); w.rotation.y=s*.5; g.add(w); g.userData.wings=(g.userData.wings||[]).concat(w); }); }

const Pets={ mine:null, id:null,
  setMine(id){ if(this.id===id) return; if(this.mine){ scene.remove(this.mine); this.mine=null; } this.id=id||null;
    const m=id?makePetMesh(id):null; if(m){ m.position.set(pos.x,2,pos.z); scene.add(m); this.mine=m; } },

/* ╔══════════════════════════════════════════════════════════════╗

const Npc={ list:[],
  build(){
    for(const [id,N] of Object.entries(NPCS)){
      const a=N.deg*Math.PI/180, x=Math.sin(a)*N.r, z=-Math.cos(a)*N.r;
      const av=makeAvatar(N.color,`${N.emoji} ${N.name}`); setHat(av,N.hat); av.position.set(x,0,z);
      const base=Math.atan2(-x,-z); av.rotation.y=base; scene.add(av); collide(x,z,.7);
      const mark=textSprite('❗',{font:'64px Jua',bg:null,h:1}); mark.position.y=4.3; av.add(mark);
      this.list.push({id,N,av,x,z,mark,base});
      Interact.add({kind:'npc',x,z,r:3.2,icon:'💬',enabled:()=>!Dungeon.inside,label:()=>`${N.name}와(과) 이야기하기`,use:()=>UI.open('npc',{id,line:pick([...N.lines,...Studio.npcLines(id),...(Season.active()&&Season.preset()?[Season.preset().npcLine]:[])])})}); // [4차]
    }
  },
  hasNews(id){
    if(!GS.isStudent()||!GS.inv) return false; if(Tutorial.cur()?.report) return true;
    return NPC_QUESTS.some(q=>q.npc===id&&(NpcQuests.canAccept(q)||(NpcQuests.state(q)?.s==='on'&&NpcQuests.prog(q)>=q.n)));
  },
  update(dt,now){
    for(const n of this.list){
      const d=Math.hypot(pos.x-n.x,pos.z-n.z), tgt=d<9?Math.atan2(pos.x-n.x,pos.z-n.z):n.base;
      const dd=((tgt-n.av.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI; n.av.rotation.y+=dd*Math.min(1,dt*5);
      n.mark.visible=this.hasNews(n.id); n.mark.position.y=4.3+Math.sin(now/250)*.15;
    }
  }
};
// 희귀 아이템 전체 알림: announce = {text,t,uid}. 모든 접속자가 들어요.

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §22 [3차] SOCIAL — 별명·친구·알림·차단·신고·방문·좋아요·방명록 ║

const me_=()=>GS.me.uid;
function realName(uid){ return GS.allInv[uid]?.realName||GS.profiles[uid]?.name||'?'; }
const Social={
  friends:{}, requests:{}, blocks:{}, seen:{}, queue:[], lastReq:0, lastNotify:{}, lastReport:0, lastSticker:{}, likedToday:{},
  guestbook:{}, visitors:{}, myLikes:0, _reqCount:0,
  code(uid){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s='', h=hashStr(uid); for(let i=0;i<6;i++){ s+=A[h%A.length]; h=hashStr(uid+':'+i+':'+h); } return s; },
  genNick(seed){ const r=mulberry(seed>>>0); return `${NICK_ADJ[Math.floor(r()*NICK_ADJ.length)]} ${NICK_ANIMAL[Math.floor(r()*NICK_ANIMAL.length)]} ${10+Math.floor(r()*90)}`; },
  nickOptions(){ const b=Math.floor(Math.random()*1e9); return [0,1,2].map(i=>this.genNick(b+i*7919)); },
  init(){

    FB.on('friendRequests/'+uid,v=>{ const n=Object.keys(v||{}).length; if(n>this._reqCount&&this._reqCount>=0&&n) toast('💌 친구 요청이 왔어요! 👥 친구에서 확인해요.'); this._reqCount=n;
      this.requests=v||{}; for(const f in this.requests) if(this.isBlocked(f)) this.reject(f); UI.refreshSocial(); UI.hud(); });
    FB.on('blocks/'+uid,v=>{ this.blocks=v||{}; Multi.onPlayers(Multi.raw); UI.refreshSocial(); });
    FB.on('notify/'+uid,v=>this.onNotify(v||{}));
    FB.on('guestbook/'+uid,v=>{ this.guestbook=v||{}; const ks=Object.entries(this.guestbook).sort((a,b)=>(b[1].at||0)-(a[1].at||0)).slice(SOCIAL.guestbookKeep); ks.forEach(([k])=>FB.remove(`guestbook/${uid}/${k}`)); });
    FB.on('visits/'+uid,v=>{ this.visitors=v||{}; const ks=Object.entries(this.visitors).sort((a,b)=>(b[1].at||0)-(a[1].at||0)).slice(SOCIAL.visitsKeep); ks.forEach(([k])=>FB.remove(`visits/${uid}/${k}`)); });
    this.refreshLikes(); setInterval(()=>this.refreshLikes(),5*60e3);
  },
  async claimCode(){ const c=GS.me.fc; try{ const cur=await FB.get('friendCodes/'+c); if(!cur) await FB.set('friendCodes/'+c,me_()); }catch(e){} },
  isFriend(u){ return !!this.friends[u]; }, isBlocked(u){ return !!this.blocks[u]; },

  online(u){ return !!Multi.raw[u]; },
  loc(){ if(Dungeon.inside) return 'dungeon'; if(Maps.mode) return 'map'; const P=plotAt(pos.x,pos.z); if(P) return 'plot:'+(P.owner||'');
    if(Raid.active()&&Math.hypot(pos.x,pos.z)<RAID.zoneR) return 'raid'; return 'village'; },
  locText(l){ if(!l) return '오프라인'; if(l==='dungeon') return '⚔️ 던전'; if(l==='map') return '🏁 챌린지 코스'; if(l==='raid') return '👾 레이드';
    if(l.startsWith('plot:')){ const o=l.slice(5); return o===me_()?'🏝️ 내 섬':o?`🏝️ ${esc(this.nameOf(o))}의 섬`:'🏝️ 빈 섬'; } return '🏘️ 마을'; },
  // --- 친구 ---
  async addByCode(code){
    code=String(code||'').trim().toUpperCase(); if(!/^[A-Z0-9]{6}$/.test(code)) return toast('친구 코드는 영어와 숫자 6자리예요.');
    if(code===GS.me.fc) return toast('내 코드예요! 친구의 코드를 적어 주세요.');
    const uid=await FB.get('friendCodes/'+code).catch(()=>null); if(!uid) return toast('그 코드의 친구를 찾지 못했어요. 다시 확인해 주세요.');
    this.request(uid);
  },
  async request(uid){
    const t=performance.now();
    if(uid===me_()||Safety.blocked('friend')) return; if(this.isFriend(uid)) return toast('이미 친구예요!');
    if(!Classes.inClass(uid)) return toast('우리 학급 친구에게만 요청할 수 있어요.'); // [5차] if(this.isBlocked(uid)) return toast('차단한 친구에게는 요청할 수 없어요.');
    if(Object.keys(this.friends).length>=SOCIAL.maxFriends) return toast(`친구는 ${SOCIAL.maxFriends}명까지 사귈 수 있어요.`);
    if(t-this.lastReq<SOCIAL.reqCooldownMs) return toast(`⏳ ${Math.ceil((SOCIAL.reqCooldownMs-(t-this.lastReq))/1000)}초 뒤에 다시 보낼 수 있어요.`);

    this.lastReq=t;
    try{ await FB.set(`friendRequests/${uid}/${me_()}`,{name:GS.me.name,level:GS.inv.level,at:FB.serverTs()}); toast(`💌 ${esc(this.nameOf(uid))} 님에게 친구 요청을 보냈어요!`); }
    catch(e){ toast('이미 요청을 보냈어요. 친구가 확인할 때까지 기다려요. (1시간 뒤에 다시 보낼 수 있어요)'); }
  },
  async accept(uid){
    if(Object.keys(this.friends).length>=SOCIAL.maxFriends) return toast(`친구는 ${SOCIAL.maxFriends}명까지예요. 먼저 정리해 주세요.`);
    const m=me_(), at=FB.now();
    try{ await FB.update('',{[`friendships/${m}/${uid}`]:{at},[`friendships/${uid}/${m}`]:{at},[`friendRequests/${m}/${uid}`]:null});
      tune([659,880,1047]); toast(`🤝 ${esc(this.nameOf(uid))} 님과 친구가 되었어요!`); }
    catch(e){ toast('친구 수락에 실패했어요. 잠시 뒤에 다시 해 주세요.'); }
  },
  reject(uid){ FB.remove(`friendRequests/${me_()}/${uid}`); },
  unfriend(uid,silent){ const m=me_(); FB.update('',{[`friendships/${m}/${uid}`]:null,[`friendships/${uid}/${m}`]:null}).catch(()=>{}); if(!silent) toast('친구 목록에서 지웠어요.'); },
  block(uid){ const m=me_(); FB.set(`blocks/${m}/${uid}`,true); if(this.isFriend(uid)) this.unfriend(uid,true); if(this.requests[uid]) this.reject(uid);
    if(Party.data?.members?.[uid]&&Party.isLeader()) Party.kick(uid); toast('🚫 차단했어요. 이 친구의 말풍선·초대·코스가 보이지 않아요.'); },
  unblock(uid){ FB.remove(`blocks/${me_()}/${uid}`); toast('차단을 풀었어요.'); },
  // --- 알림(초대) ---
  async notify(uid,type,data={}){
    const t=performance.now(); if(t-(this.lastNotify[uid+type]||0)<SOCIAL.notifyCooldownMs) return toast('⏳ 조금 뒤에 다시 초대해요.');
    this.lastNotify[uid+type]=t; FB.push(`notify/${uid}`,{type,from:me_(),name:GS.me.name,at:FB.serverTs(),...data});

  inviteHere(uid){ this.notify(uid,'come',{x:+pos.x.toFixed(1),z:+pos.z.toFixed(1),where:this.loc()}); toast(`📨 ${esc(this.nameOf(uid))} 님을 불렀어요!`); },

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §23 [3차] PARTY — 최대 4명, 파티장 권한, 파티 던전, 파티 퀘스트 ║
   ╚══════════════════════════════════════════════════════════════╝
   parties/{pid} = {leader, createdAt, members:{uid:{name,lv,st,at}}, quest:{id,qid,at,done}, dungeon:{at,by}, ping:{uid,name,x,z,t}, buff:{until,by}}
   partyInvites/{uid}/{pid} = {from, at}      파티장만 보낼 수 있어요 (규칙이 확인)
   partyProgress/{pid}/{qid}/{uid} = 기여 수   본인만 써요
   상태 머신: (없음) → 생성 → 초대/참가/탈퇴 → 위임 → 해산(삭제). 5명째는 가장 늦게 들어온 사람이 스스로 나가요. */
const Party={
  id:null, data:null, unsub:null, progUnsub:null, qid:null, progress:{}, contrib:0, lastFlush:0, flushT:null, invites:{},
  lastDungeonAt:0, lastPingT:0, lastPingSent:0, pings:[], lastStat:0, lastStatKey:'',
  init(){ if(!GS.isStudent()) return; const m=me_();
    FB.on('partyInvites/'+m,v=>{ this.invites=v||{}; UI.refreshSocial(); });
    if(GS.inv.party) this.watch(GS.inv.party);
    Bus.on('learn',d=>this.onLearn(d)); },
  watch(pid){ this.unwatch(); this.id=pid; this.lastDungeonAt=FB.now()-60000; this.lastPingT=FB.now();
    if(GS.inv.party!==pid){ GS.inv.party=pid; GS.change(); } this.unsub=FB.on('parties/'+pid,v=>this.onParty(v)); },
  unwatch(){ this.unsub?.(); this.progUnsub?.(); this.unsub=this.progUnsub=null; this.id=null; this.data=null; this.qid=null; this.progress={}; },
  clearLocal(msg){ if(msg) toast(msg); this.unwatch(); GS.inv.party=null; GS.change(); UI.partyHud(); UI.refreshSocial(); },
  onParty(v){
    const m=me_(); if(!v||!v.members?.[m]){ if(this.id) this.clearLocal(v?'파티에서 나왔어요.':'파티가 해산되었어요.'); return; }
    this.data=v;
    const ms=this.members(); if(ms.length>PARTY.max&&ms.slice(PARTY.max).some(([u])=>u===m)){ toast('파티가 꽉 찼어요! (최대 4명)'); this.leave(true); return; }
    const qid=v.quest?.qid||null;
    if(qid!==this.qid){ this.progUnsub?.(); this.qid=qid; this.progress={}; this.contrib=0;
      if(qid) this.progUnsub=FB.on(`partyProgress/${this.id}/${qid}`,p=>{ this.progress=p||{}; this.contrib=Math.max(this.contrib,this.progress[m]||0); this.checkQuest(); UI.partyHud(); }); }
    if(v.dungeon&&v.dungeon.at>this.lastDungeonAt){ this.lastDungeonAt=v.dungeon.at;
      if(v.dungeon.by!==m&&FB.now()-v.dungeon.at<60000&&!Dungeon.inside&&!Maps.mode){ toast('👥 파티장이 던전으로 출발했어요! 함께 이동해요.',3500); setTimeout(()=>Dungeon.tryEnter(),1500); } }
    if(v.ping&&v.ping.t>this.lastPingT){ this.lastPingT=v.ping.t; if(FB.now()-v.ping.t<PARTY.pingMs) this.showPing(v.ping); }
    UI.partyHud(); UI.refreshSocial();
  },
  members(){ return Object.entries(this.data?.members||{}).sort((a,b)=>(a[1].at||0)-(b[1].at||0)); },
  isLeader(){ return this.data?.leader===me_(); },
  entry(){ return {name:GS.me.name,lv:GS.inv.level,st:Stamina.value(),at:FB.now()}; },
  async create(){ if(this.id) return true; const pid='p'+FB.now().toString(36)+Math.random().toString(36).slice(2,5);
    try{ await FB.set('parties/'+pid,{leader:me_(),createdAt:FB.now(),members:{[me_()]:this.entry()}}); this.watch(pid); toast('🎉 파티를 만들었어요! 친구 목록에서 초대해요.'); return true; }
    catch(e){ toast('파티를 만들지 못했어요.'); return false; } },
  async invite(uid){
    if(Social.isBlocked(uid)||Safety.blocked('party')) return; if(!Classes.inClass(uid)) return toast('우리 학급 친구만 초대할 수 있어요.'); // [5차]
    if(!this.id&&!(await this.create())) return;
    if(!this.isLeader()) return toast('파티장만 초대할 수 있어요.');
    if(this.members().length>=PARTY.max) return toast('파티가 꽉 찼어요! (최대 4명)');
    if(this.data?.members?.[uid]) return toast('이미 우리 파티예요.');
    try{ await FB.set(`partyInvites/${uid}/${this.id}`,{from:me_(),at:FB.now()}); Social.notify(uid,'party',{pid:this.id}); toast(`📨 ${esc(Social.nameOf(uid))} 님을 파티에 초대했어요!`); }
    catch(e){ toast('초대를 보내지 못했어요.'); }
  },
  async join(pid){
    if(this.id===pid) return; const d=await FB.get('parties/'+pid).catch(()=>null);
    if(!d){ toast('그 파티는 이미 사라졌어요.'); FB.remove(`partyInvites/${me_()}/${pid}`); return; }
    if(Object.keys(d.members||{}).length>=PARTY.max){ toast('파티가 꽉 찼어요!'); FB.remove(`partyInvites/${me_()}/${pid}`); return; }
    if(this.id) await this.leave(true);
    try{ await FB.set(`parties/${pid}/members/${me_()}`,this.entry()); }catch(e){ toast('초대가 끝났어요. 다시 초대받아요.'); return; }
    FB.remove(`partyInvites/${me_()}/${pid}`); this.watch(pid); tune([659,880]); toast('👥 파티에 들어왔어요!');
  },
  decline(pid){ FB.remove(`partyInvites/${me_()}/${pid}`); },
  async leave(silent){
    if(!this.id) return; const pid=this.id, m=me_();
    if(this.isLeader()){ const others=this.members().filter(([u])=>u!==m);
      if(!others.length){ await FB.remove('parties/'+pid).catch(()=>{}); this.clearLocal(silent?null:'파티를 해산했어요.'); return; }
      await FB.set(`parties/${pid}/leader`,others[0][0]).catch(()=>{}); }
    await FB.remove(`parties/${pid}/members/${m}`); this.clearLocal(silent?null:'파티에서 나왔어요.');
  },
  delegate(uid){ if(!this.isLeader()) return; FB.set(`parties/${this.id}/leader`,uid); toast(`👑 ${esc(Social.nameOf(uid))} 님이 파티장이 되었어요.`); },
  kick(uid){ if(!this.isLeader()||uid===me_()) return; FB.remove(`parties/${this.id}/members/${uid}`); },
  disband(){ if(!this.isLeader()) return; if(!confirm('파티를 해산할까요? 모두 파티에서 나가요.')) return; FB.remove('parties/'+this.id); },
  claimLeader(){ // 파티장이 오래 떠나 있으면 가장 먼저 들어온 사람이 이어받아요
    const L=this.data?.leader; if(!this.id||!L||this.data.members?.[L]) return; if(this.members()[0]?.[0]===me_()) FB.set(`parties/${this.id}/leader`,me_()); },
  ping(){ if(!this.id) return; const t=performance.now(); if(t-this.lastPingSent<PARTY.pingCooldownMs) return; this.lastPingSent=t;
    FB.set(`parties/${this.id}/ping`,{uid:me_(),name:GS.me.name,x:+pos.x.toFixed(1),z:+pos.z.toFixed(1),t:FB.now()}); },
  showPing(p){
    const g=new THREE.Group(); g.position.set(p.x,0,p.z);
    const beam=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,30,10,1,true),new THREE.MeshBasicMaterial({color:0xffc93c,transparent:true,opacity:.55,side:THREE.DoubleSide})); beam.position.y=15; g.add(beam);
    const s=textSprite(`📍 ${p.name}`,{font:'52px Jua',h:.9,bg:'rgba(201,139,0,.92)'}); s.position.y=4; g.add(s);
    scene.add(g); this.pings.push({g,until:performance.now()+PARTY.pingMs}); if(this.pings.length>4){ const o=this.pings.shift(); scene.remove(o.g); }
    beep(988,.12,'triangle',.07); if(p.uid!==me_()) toast(`📍 ${esc(p.name)}: 여기로 모여요!`);
  },
  startDungeon(){ if(!this.isLeader()) return toast('파티장만 던전 출발을 할 수 있어요.');
    Dungeon.tryEnter().then(()=>{ if(Dungeon.inside) FB.set(`parties/${this.id}/dungeon`,{at:FB.now(),by:me_()}); }); },
  buff(){ if(!this.id) return; FB.set(`parties/${this.id}/buff`,{until:FB.now()+PARTY.buffMs,by:GS.me.name}).catch(()=>{}); },
  buffMult(){ return this.data?.buff?.until>FB.now()?PARTY.buffMult:1; },
  // --- 파티 퀘스트 ---
  setQuest(id){ if(!this.isLeader()) return; FB.set(`parties/${this.id}/quest`,{id,qid:'q'+FB.now().toString(36),at:FB.now()}); },
  quest(){ const q=this.data?.quest; const Q=q&&PARTY_QUESTS.find(x=>x.id===q.id); return Q?{...Q,qid:q.qid,done:q.done}:null; },
  total(){ return Object.values(this.progress).reduce((a,b)=>a+(+b||0),0); },
  onLearn(d){
    const Q=this.quest(); if(!Q||Q.done) return; let n=0;
    if(Q.stat==='words'&&d.kind==='word') n=1; else if(Q.stat==='sentences'&&d.kind==='sentence') n=1;
    else if(Q.stat==='dungeonWins'&&d.kind==='dungeonClear') n=1; else if(Q.stat==='eventPts'&&d.kind==='eventPts') n=d.n||0;
    if(!n||this.total()>=Q.n) return; this.contrib+=n; this.flush(); UI.partyHud();
  },
  flush(force){ if(!this.id||!this.qid) return; const t=performance.now();
    if(!force&&t-this.lastFlush<2000){ clearTimeout(this.flushT); this.flushT=setTimeout(()=>this.flush(true),2000); return; }
    this.lastFlush=t; FB.set(`partyProgress/${this.id}/${this.qid}/${me_()}`,this.contrib).catch(()=>{}); },
  checkQuest(){
    const Q=this.quest(); if(!Q) return; const total=this.total(); if(total<Q.n) return;
    const my=this.progress[me_()]||0;
    if(my>0){ const f=.6+.8*Math.min(1,my/total); // 기여도에 따라 60%~140%, 기여 0이면 보상 없음
      const r={exp:Math.round(Q.reward.exp*f),coins:Math.round(Q.reward.coins*f),...(Q.reward.items?{items:Q.reward.items}:{})};
      if(Rewards.give('pq:'+Q.qid,r,`👥 파티 퀘스트 「${Q.text}」 성공! (내 기여 ${my}/${total})`)) tune([784,988,1175]); }
    if(this.isLeader()&&!Q.done) FB.update(`parties/${this.id}/quest`,{done:true});
  },
  tick(now){
    if(!this.id||!this.data) return;
    if(now-this.lastStat>PARTY.statSyncMs){ this.lastStat=now; const e=this.entry(), k=`${e.name}|${e.lv}|${e.st}`;
      if(k!==this.lastStatKey){ this.lastStatKey=k; FB.update(`parties/${this.id}/members/${me_()}`,{name:e.name,lv:e.lv,st:e.st}).catch(()=>{}); }
      this.claimLeader(); }
    for(let i=this.pings.length-1;i>=0;i--){ const p=this.pings[i]; if(now>p.until){ scene.remove(p.g); this.pings.splice(i,1); } else p.g.children[0].rotation.y+=.05; }
  }
};

/* ╔══════════════════════════════════════════════════════════════╗
   ║ §24 [3차] RAID — 광장의 영어 괴물 대왕 (방 상태 머신)          ║
   ╚══════════════════════════════════════════════════════════════╝
   raid/current = {id, state:'announce'|'fight'|'won'|'lost'|'ended', createdAt, startAt, endsAt, endedAt, hp, max, seed, by}
   raid/dmg/{raidId}/{uid} = {n, d}     본인만 써요 (한 번에 너무 크게 오르면 규칙이 막아요)
   raid/settings = {weekend}            관리자만
   - 상태 전환은 모두 transaction으로, 조건이 맞을 때 딱 한 번만 일어나요.
   - 피해는 모아서 1.5초마다 한 번만 보내고, 보스 공격 모양은 seed로 모두의 화면에서 똑같이 계산해요(동기화 불필요).
   ⚠ TODO(서버): hp 감소와 보상은 Cloud Functions(onCall: raidHit / claimRaid)로 옮기면 조작을 막을 수 있어요. */
const Raid={
  cur:null, dmgMap:{}, unsubD:null, pending:0, myDmg:0, lastFlush:0, combo:0, gauge:0, hp:RAID.playerHp, faintUntil:0,
  boss:null, teles:[], lastK:-1, lastTick:0, settings:{weekend:true}, rewardT:null,
  init(){ FB.on('raid/current',v=>this.onRaid(v)); FB.on('raid/settings',v=>{ this.settings=v||{weekend:true}; UI.refreshAdmin(); }); Bus.on('learn',d=>this.onLearn(d)); },
  active(){ return !!this.cur&&['announce','fight'].includes(this.cur.state); },
  fighting(){ return this.cur?.state==='fight'; },
  phaseIdx(){ const c=this.cur; if(!c?.max) return 0; const r=c.hp/c.max; return r>RAID.phases[0].min?0:r>RAID.phases[1].min?1:2; },
  shownHp(){ return Math.max(0,(this.cur?.hp||0)-this.pending); },
  onRaid(v){
    const prevId=this.cur?.id, prevState=this.cur?.state; const prevHp=this.cur?.hp; this.cur=v;
    if(v?.id!==prevId){ this.unsubD?.(); this.dmgMap={}; this.myDmg=0; this.pending=0; this.combo=0; this.gauge=0; this.hp=RAID.playerHp; this.lastK=-1; this.clearTeles();
      if(v?.id) this.unsubD=FB.on('raid/dmg/'+v.id,d=>{ this.dmgMap=d||{}; this.myDmg=Math.max(this.myDmg,this.dmgMap[me_()]?.d||0); UI.raidHud(); if(UI.modal==='raid') UI.render(); }); }
    if(v&&v.state!==prevState){ this.announce(v); if(['won','lost'].includes(v.state)){ clearTimeout(this.rewardT); this.rewardT=setTimeout(()=>this.checkReward(),2500); } }
    if(v&&prevHp!=null&&v.hp<prevHp&&this.boss) this.boss.userData.flash=.25;
    this.syncBoss(); UI.raidHud(); if(UI.modal==='raid') UI.render();
  },
  announce(v){
    if(v.state==='announce'){ toast('👾 <b>영어 괴물 대왕</b>이 30초 뒤에 광장에 나타나요! 모두 광장으로 모여요!',6000); tune([392,523,392,523]); }
    else if(v.state==='fight'){ toast('⚔️ 레이드 시작! 단어·문장을 만들고 괴물 앞에서 문제를 풀어 공격해요. 빨간 표시는 피해요!',5000); tune([523,659,784]); }
    else if(v.state==='won'){ toast('🎉 영어 괴물 대왕을 물리쳤어요! 모두 최고예요!',5000); tune([784,988,1175,1568]); }
    else if(v.state==='lost'){ toast('💨 괴물 대왕이 도망갔어요… 다음엔 꼭 물리쳐요!',5000); }
  },
  tx(fn){ return FB.transaction('raid/current',fn).catch(()=>({committed:false})); },
  bossName(){ return Studio.raidCfg()?.name||'영어 괴물 대왕'; }, // [4차] 선생님이 이름을 바꿀 수 있어요
  newRaid(by){ const now=FB.now(), n=Math.max(3,Multi.studentsOnline()), C=Studio.raidCfg();
    const max=Math.round((RAID.baseHp+RAID.perPlayerHp*n)*(C?+C.hpMul||1:1));
    return {id:'raid'+now.toString(36),state:'announce',createdAt:now,startAt:now+RAID.announceMs,endsAt:now+RAID.announceMs+RAID.fightMs,
      hp:max,max,seed:Math.floor(Math.random()*1e9),by,name:this.bossName(),rewardMul:C?+C.rewardMul||1:1}; },
  canStart(c,now){ return !c||c.state==='ended'||(['won','lost'].includes(c.state)&&now>(c.endedAt||0)+RAID.afterMs)||(['announce','fight'].includes(c.state)&&now>(c.endsAt||0)+60e3); },
  async start(by='chief'){ const res=await this.tx(cur=>this.canStart(cur,FB.now())?this.newRaid(by):undefined); if(!res.committed&&by==='chief') toast('이미 레이드가 진행 중이에요.'); },
  stop(){ this.tx(cur=>cur&&['announce','fight'].includes(cur.state)?{...cur,state:'lost',endedAt:FB.now()}:undefined); },
  tick(now,force){
    if(!force&&now-this.lastTick<1000) return; this.lastTick=now; const c=this.cur, t=FB.now();
    if(!c||c.state==='ended'){ this.weekendCheck(t); return; }
    if(c.state==='announce'&&t>=c.startAt) this.tx(cur=>cur?.id===c.id&&cur.state==='announce'&&FB.now()>=cur.startAt?{...cur,state:'fight'}:undefined);
    else if(c.state==='fight'){ if(c.hp<=0) this.tx(cur=>cur?.id===c.id&&cur.state==='fight'&&cur.hp<=0?{...cur,state:'won',endedAt:FB.now()}:undefined);
      else if(t>c.endsAt) this.tx(cur=>cur?.id===c.id&&cur.state==='fight'&&FB.now()>cur.endsAt?{...cur,state:'lost',endedAt:FB.now()}:undefined); }
    else if(['won','lost'].includes(c.state)&&t>(c.endedAt||0)+RAID.afterMs) this.tx(cur=>cur?.id===c.id&&['won','lost'].includes(cur.state)?{...cur,state:'ended'}:undefined);
    this.flush();
  },
  weekendCheck(t){
    if(this.settings.weekend===false||!GS.started) return; const d=new Date(t+9*3600e3), wd=d.getUTCDay(), h=d.getUTCHours();
    if(!(wd===0||wd===6)||h<RAID.weekendHours[0]||h>=RAID.weekendHours[1]) return;
    if(this.cur&&t-(this.cur.createdAt||0)<RAID.weekendGapMs) return; this.start('weekend');
  },
  // --- 공격 ---
  canAttack(){ return this.fighting()&&GS.isStudent()&&!Dungeon.inside&&!Maps.mode&&FB.now()>this.faintUntil; },
  mult(){ return Math.min(RAID.comboMax,1+RAID.comboStep*this.combo)*Party.buffMult(); },
  addDamage(base){ if(!this.canAttack()) return 0; const d=Math.round(base*this.mult()); this.pending+=d; this.myDmg+=d;
    if(this.boss){ this.boss.userData.flash=.25; popAt(0,9,0,'-'+d,'hit'); } this.flush(); UI.raidHud(); return d; },
  flush(force){
    if(!this.pending||!this.cur) return; const t=performance.now(); if(!force&&t-this.lastFlush<RAID.flushMs) return;
    this.lastFlush=t; const n=this.pending, id=this.cur.id; this.pending=0;
    FB.transaction('raid/current/hp',cur=>(typeof cur!=='number'||cur<=0)?undefined:Math.max(0,cur-n)).then(res=>{ if(res.committed&&res.value<=0) this.tick(performance.now(),true); }).catch(()=>{});
    FB.set(`raid/dmg/${id}/${me_()}`,{n:GS.me.name,d:this.myDmg}).catch(()=>{});
  },
  onLearn(d){
    if(!this.canAttack()) return;
    if(d.kind==='mine'){ this.gauge=Math.min(100,this.gauge+RAID.gaugePerLetter); UI.raidHud(); }
    else if(d.kind==='word'){ this.combo++; this.addDamage(RAID.dmg.word); }
    else if(d.kind==='sentence'){ this.combo++; this.addDamage(RAID.dmg.sentenceCraft); Party.buff(); toast('💪 문장 파워! 파티 모두의 공격력이 30초 동안 20% 세져요.'); }
    else if(d.kind==='miss') this.combo=0;
  },
  quizAttack(type,q,ok){ if(!this.canAttack()) return {msg:'지금은 공격할 수 없어요.'};
    if(!ok){ this.combo=0; Learn.miss(q.id); return {msg:'앗, 틀렸어요! 콤보가 사라졌어요.',bad:true}; }
    this.combo++; const d=this.addDamage(RAID.dmg[type]); return {msg:`영어 괴물에게 ${d} 피해!${this.combo>1?` (콤보 ${this.combo})`:''}`}; },
  gaugeAttack(){ if(this.gauge<100||!this.canAttack()) return; this.gauge=0; const d=this.addDamage(RAID.dmg.gauge); toast(`⚡ 알파벳 게이지 공격! ${d} 피해`); },
  ranking(){ return Object.entries(this.dmgMap).map(([uid,v])=>({uid,name:v.n,d:v.d||0})).filter(r=>!Social.isBlocked(r.uid)).sort((a,b)=>b.d-a.d); },
  checkReward(){
    const c=this.cur; if(!c||!['won','lost'].includes(c.state)||!GS.isStudent()) return;
    const my=Math.max(this.myDmg,this.dmgMap[me_()]?.d||0); if(!my||GS.inv.claims['raid:'+c.id]) return;
    const rank=this.ranking(), place=rank.findIndex(r=>r.uid===me_())+1; let r;
    if(c.state==='won'){ r=mergeReward(RAID.rewardWin,place&&place<=3?RAID.rewardTop:null,place===1?RAID.rewardFirst:null); r.score=30; }
    else r={...RAID.rewardLose};
    const mul=+c.rewardMul||1; if(mul!==1) for(const k of ['exp','coins','gems','score']) if(r[k]) r[k]=Math.round(r[k]*mul); // [4차]
    if(Rewards.give('raid:'+c.id,r)) UI.open('raidresult',{won:c.state==='won',place,my,r,total:rank.length});
  },
  // --- 보스 모습과 공격 패턴 ---
  syncBoss(){
    const show=this.cur&&['announce','fight','won','lost'].includes(this.cur.state);
    if(show&&!this.boss){ this.boss=this.makeBoss(); scene.add(this.boss); this.boss.position.set(0,this.cur.state==='announce'?30:7,0); }
    if(!show&&this.boss){ scene.remove(this.boss); this.boss.traverse(o=>{ if(o.isSprite) disposeSprite(o); }); this.boss=null; this.clearTeles(); }
  },
  makeBoss(){
    const g=new THREE.Group(), body=new THREE.MeshLambertMaterial({color:0x6b3fa0,emissive:0x2a0f4a});
    const add=(geo,m,x,y,z)=>{ const o=new THREE.Mesh(geo,m); o.position.set(x,y,z); o.castShadow=true; g.add(o); return o; };
    add(new THREE.BoxGeometry(5,4.5,3.6),body,0,0,0); add(new THREE.BoxGeometry(4,3,3.2),body,0,3.8,0);
    [-1,1].forEach(s=>{ add(new THREE.ConeGeometry(.45,1.6,6),mat(0xfff1d6),s*1.3,6,0);
      add(new THREE.BoxGeometry(.8,.8,.1),new THREE.MeshBasicMaterial({color:0xffe14a}),s*.9,4.1,1.62);
      const arm=add(new THREE.BoxGeometry(1.2,3.6,1.2),body,s*3.2,-.3,0); arm.userData.arm=s; });
    add(new THREE.BoxGeometry(2.2,.35,.1),new THREE.MeshBasicMaterial({color:0x1b1b1b}),0,3,1.62);
    ['A','B','C'].forEach((l,i)=>{ const c=document.createElement('canvas'); c.width=c.height=128; drawGem(c.getContext('2d'),l);
      const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true})); s.scale.set(1.2,1.2,1); s.position.set(-1.4+i*1.4,.2,1.9); g.add(s); });
    const lab=textSprite('👾 '+(this.cur?.name||this.bossName()),{font:'64px Jua',h:1.3,bg:'rgba(75,31,168,.92)'}); lab.position.y=7.8; g.add(lab);
    g.userData={body,flash:0,t:0}; return g;
  },
  clearTeles(){ this.teles.forEach(T=>scene.remove(T.mesh)); this.teles=[]; },
  makeAttack(rnd,ph){
